<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brum Brum</title>
<style>
  :root{--accent:#ffcc00;--panel:rgba(15,18,24,.92);}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#2f6e2b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#game,canvas#bg{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  #divider{position:fixed;background:#111;pointer-events:none}
  .hidden{display:none!important}

  .hud{position:fixed;background:rgba(0,0,0,.45);padding:10px 14px;border-radius:12px;font-variant-numeric:tabular-nums;line-height:1.35;min-width:190px;pointer-events:none}
  .hud .pname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
  .hud .pname i{display:inline-block;width:12px;height:12px;border-radius:3px}
  .hud .big{font-size:30px;font-weight:800;letter-spacing:.5px}
  .hud .lap{font-size:18px;font-weight:700;color:var(--accent)}
  .hud .small{font-size:13px;opacity:.85}
  .hud .spd{font-size:18px;font-weight:800;margin-top:2px}
  .hud .opp{font-size:14px;font-weight:700;color:#9fd8ff}
  .hud .note{font-size:14px;font-weight:700;color:#ff8a7a}
  .hud .item{margin-top:6px;font-size:17px;font-weight:800;background:rgba(255,255,255,.12);border-radius:10px;padding:5px 10px;display:inline-block}
  .hud .item:empty{display:none}
  .hud .item kbd{font-size:12px;margin-left:6px;vertical-align:middle}
  .hud .fx{font-size:13px;font-weight:700;color:#ffe14a}
  .roul{position:fixed;width:120px;height:120px;border-radius:16px;overflow:hidden;border:4px solid var(--accent);background:linear-gradient(135deg,#ff3cac,#ffb400,#2b86c5);box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
  .roul img{width:100%;height:100%;object-fit:contain;display:block;background:#111}
  .roul .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:62px;opacity:.45;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .roul .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);text-align:center;font-weight:800;font-size:13px;padding:3px 0}
  .roul.spin{border-color:#fff}
  .roul.done{animation:roulPop .4s ease-out}
  @keyframes roulPop{0%{transform:scale(1.4)}60%{transform:scale(.92)}100%{transform:scale(1)}}
  #mini{position:fixed;top:12px;border-radius:12px;background:rgba(0,0,0,.4);pointer-events:none}
  #msg{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-size:min(22vw,140px);font-weight:900;color:var(--accent);text-shadow:0 6px 0 rgba(0,0,0,.35);pointer-events:none;white-space:nowrap}
  .pop{position:fixed;transform:translateX(-50%);font-size:22px;font-weight:800;background:rgba(0,0,0,.55);padding:8px 18px;border-radius:12px;pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pop.good{color:#6dff8a}.pop.bad{color:#ff8a7a}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px;overflow:auto}
  .panel{background:var(--panel);border-radius:18px;padding:22px 24px;max-width:800px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:auto}
  h1{margin:0 0 4px;font-size:46px;font-weight:900;letter-spacing:2px;font-style:italic}
  h1 span{color:var(--accent)}
  h2{margin:0 0 10px;font-size:34px;font-style:italic;color:var(--accent)}
  h3{margin:16px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;opacity:.7}
  .sub{margin:0;opacity:.8}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .card{background:#222833;border:2px solid transparent;border-radius:12px;padding:10px;cursor:pointer;transition:.15s}
  .card:hover{background:#2a3140}
  .card.sel{border-color:var(--accent)}
  .card canvas{width:100%;height:auto;display:block;border-radius:8px;background:#2f6e2b}
  .card b{display:block;margin-top:6px;font-size:17px}
  .card div{font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:30px;flex-wrap:wrap}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button,.colors button{border:2px solid transparent;background:#222833;color:#fff;font-weight:700;font-size:16px;border-radius:10px;padding:8px 14px;cursor:pointer}
  .seg button.sel{border-color:var(--accent);color:var(--accent)}
  .colors{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .colors span{font-size:13px;opacity:.75;width:74px}
  .colors button{width:34px;height:34px;padding:0}
  .colors button.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .colors + .colors{margin-top:8px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:16px;cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--accent)}
  .btn{display:inline-block;border:0;border-radius:12px;padding:14px 26px;font-size:20px;font-weight:900;cursor:pointer;background:var(--accent);color:#111;margin-top:18px;margin-right:8px}
  .btn.alt{background:#333b49;color:#fff}
  .btn.small{padding:10px 18px;font-size:16px;margin-top:0}
  .btn:disabled{opacity:.5;cursor:default}
  .help{margin-top:16px;font-size:13px;opacity:.7;line-height:1.7}
  .warn{margin-top:14px;color:#ff8a7a;font-weight:700}
  kbd{background:#333b49;border-radius:4px;padding:1px 6px;font-family:inherit;font-size:12px}
  .lobby{margin-top:16px;background:#1b2029;border:2px solid #333b49;border-radius:14px;padding:14px}
  .lobby .join{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .lobby input{font-size:20px;font-weight:800;letter-spacing:4px;text-transform:uppercase;width:120px;padding:9px 12px;border-radius:10px;border:2px solid #333b49;background:#0f1218;color:#fff;user-select:text;-webkit-user-select:text}
  .lobby input:focus{outline:none;border-color:var(--accent)}
  .lobby .info{line-height:1.6;font-size:15px}
  .lobby .code{font-size:30px;font-weight:900;letter-spacing:6px;color:var(--accent);vertical-align:middle}
  .lobby .err{color:#ff8a7a;font-weight:700}
  .total{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
  .laps{margin:10px 0;font-variant-numeric:tabular-nums;font-size:17px}
  .laps div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .laps .best{color:#6dff8a;font-weight:700}
  .rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
  .rank .medal{font-size:30px;width:40px;text-align:center}
  .rank .who{flex:1;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
  .rank .who i{display:inline-block;width:14px;height:14px;border-radius:4px}
  .rank .t{text-align:right;font-size:20px;font-weight:800}
  .rank .t small{display:block;font-size:12.5px;font-weight:600;opacity:.75}
  .rec{font-size:22px;font-weight:800;color:#6dff8a;margin-top:10px}
  .rec.no{color:#ddd;font-size:16px;font-weight:600}

  #touch{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none}
  #touch button{position:fixed;bottom:18px;width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:28px;font-weight:900;pointer-events:auto;touch-action:none}
  #touch button.on{background:rgba(255,204,0,.5)}
  #tL{left:16px}#tR{left:104px}#tB{right:104px}#tG{right:16px;background:rgba(80,200,90,.3)!important}
  #touch #tI{right:60px;bottom:106px;width:64px;height:64px;font-size:26px;background:rgba(255,204,0,.3)}
  @media (max-width:600px){.hud{min-width:0;padding:8px 10px}.hud .big{font-size:22px}h1{font-size:34px}}
</style>
<script src="three.min.js"></script>
<script>if(!window.THREE) document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"><\/script>');</script>

<body>
<canvas id="bg"></canvas>
<canvas id="game" class="hidden"></canvas>
<div id="divider" class="hidden"></div>

<div id="huds"></div>
<canvas id="mini" class="hidden"></canvas>
<div id="msg"></div>
<div id="pop" class="pop hidden" style="left:50%;top:56%"></div>

<div id="touch" class="hidden">
  <button id="tL">◀</button><button id="tR">▶</button>
  <button id="tB">■</button><button id="tG">▲</button><button id="tI">★</button>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>BRUM <span>BRUM</span></h1>
    <p class="sub">Zeitfahren allein, Duell an einer Tastatur oder online von zwei Geräten.</p>
    <h3>Modus</h3>
    <div class="seg" id="modeSel"></div>
    <div id="lobby" class="lobby hidden">
      <div class="join" id="lobbyJoin">
        <button class="btn small" id="createBtn">Raum erstellen</button>
        <span style="opacity:.7">oder Code eingeben:</span>
        <input id="codeIn" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false">
        <button class="btn small alt" id="joinBtn">Beitreten</button>
      </div>
      <div class="info" id="lobbyInfo"></div>
      <button class="btn small alt hidden" id="leaveBtn" style="margin-top:10px">Raum verlassen</button>
    </div>
    <h3>Strecke</h3>
    <div class="cards" id="cards"></div>
    <div class="row">
      <div><h3>Runden</h3><div class="seg" id="lapsSel"></div></div>
      <div><h3>Autofarbe</h3><div id="colorRows"></div></div>
    </div>
    <label class="chk"><input type="checkbox" id="puChk" checked> 🎁 Power-Up-Würfel auf der Strecke <span style="opacity:.6;font-size:13px">(eigene Rekorde)</span></label>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="ghostChk" checked> Geist-Auto der Rekordfahrt anzeigen</label>
    <div class="warn hidden" id="err3d">⚠️ 3D konnte nicht gestartet werden (WebGL nicht verfügbar).</div>
    <button class="btn" id="startBtn">Los geht's! 🏁</button>
    <div class="help" id="help"></div>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="panel" style="max-width:500px">
    <h2 id="rTitle">🏁 Ziel!</h2>
    <div id="rBody"></div>
    <div class="rec" id="rRec"></div>
    <button class="btn" id="againBtn">Nochmal (R)</button>
    <button class="btn alt" id="menuBtn">Menü</button>
  </div>
</div>

<script>
"use strict";
// ---------- Grundsetup ----------
const cvs = document.getElementById('game');
const bgc = document.getElementById('bg'), bctx = bgc.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  bgc.width = W*DPR; bgc.height = H*DPR;
  if(R3) { R3.renderer.setPixelRatio(DPR); R3.renderer.setSize(W, H, false); }
}
addEventListener('resize', resize);
const $ = id => document.getElementById(id);

const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function fmt(t){ if(t == null) return '–'; const m = Math.floor(t/60), s = t - m*60; return m + ':' + s.toFixed(3).padStart(6,'0'); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- Strecken ----------
// Welten: Farben, Himmel, Hindernisse und Fahrverhalten neben der Strecke
const THEMES = {
  grass:  { icon:'🌳', sky:'#9fd3f5', fog:[900,2800], hemi:[0xe6f4ff,0x4a7a3a,2.2], sun:[0xfff4e0,2.6], outer:0x3d8a38,
            ground:'#3f8f3a', noise:['#3a8535','#48993f'], runoff:'#bfae78', road:'#4b4c52', obst:'pine', obstK:.65, rScale:1, offDrag:2.5, offGrip:4.5 },
  snow:   { icon:'❄️', sky:'#cfe3f2', fogColor:'#dfe9f2', fog:[600,2300], hemi:[0xffffff,0xb0c4d8,2.4], sun:[0xffffff,2.0], outer:0xe6edf4,
            ground:'#e8eef5', noise:['#d8e2ee','#f6f9fc'], runoff:'#c3cfdc', road:'#55585f', obst:'snowpine', obstK:.65, rScale:1, offDrag:1.5, offGrip:1.8 },
  city:   { icon:'🌃', night:true, sky:'#0b1430', fog:[700,2500], hemi:[0x7788bb,0x222233,1.1], sun:[0x9fb4ff,0.9], outer:0x30333a,
            ground:'#3a3d44', noise:['#34373d','#41444b'], runoff:'#2c2e33', road:'#26272b', obst:'building', obstK:.95, rScale:1.5, offDrag:1.2, offGrip:6, lamps:true },
  lava:   { icon:'🌋', lava:true, sky:'#3a0d05', fogColor:'#4a1508', fog:[600,2300], hemi:[0xffaa88,0x661100,1.5], sun:[0xffb080,1.7], outer:0xff5a1a,
            ground:'#ff5a1a', noise:['#ff8c1a','#c83010','#ffb030'], runoff:'#2a2523', road:'#3a3534', runoffW:76, obst:'rock', obstK:.9, rScale:1, offDrag:2.5, offGrip:4.5 },
  desert: { icon:'🏜️', sky:'#f7c98b', fogColor:'#f2c98e', fog:[900,3200], hemi:[0xfff0d0,0xc09050,2.3], sun:[0xfff0d0,3.0], outer:0xdcb46e,
            ground:'#e0b872', noise:['#d6ab62','#e9c584'], runoff:'#c99e5a', road:'#5a5550', obst:'cactus', obstK:.45, rScale:1, offDrag:2.0, offGrip:3.5 },
};

// pads = Turbo-Felder, ramps = Sprungschanzen (Position als Anteil der Runde)
const TRACK_DEFS = [
  { id:'sonne', name:'Sonnenring', theme:'grass', w:125, seed:7, pads:[.05,.47], ramps:[.72],
    pts:[[600,1400],[700,700],[1300,400],[2200,500],[2700,900],[3300,600],[3700,1000],[3600,1800],[3000,2300],[2200,2000],[1600,2400],[900,2300]] },
  { id:'berg', name:'Eispass', theme:'snow', w:108, seed:21, pads:[.25,.8], ramps:[.5],
    pts:[[500,500],[1500,400],[1800,900],[1400,1300],[1900,1700],[2600,1300],[2500,600],[3300,400],[3700,1200],[3500,2300],[2500,2500],[1500,2500],[600,2200],[900,1500],[400,1100]] },
  { id:'stadt', name:'Nachtstadt', theme:'city', w:115, seed:99, pads:[.06,.56], ramps:[.18,.68],
    pts:[[600,600],[2000,560],[3400,600],[3400,1200],[2800,1400],[3400,1700],[3400,2400],[2000,2440],[600,2400],[600,1800],[1200,1500],[600,1200]] },
  { id:'vulkan', name:'Vulkankrater', theme:'lava', w:112, seed:66, pads:[.2,.6], ramps:[.44,.8],
    pts:[[600,1500],[700,600],[1500,400],[2000,900],[1700,1400],[2200,1800],[2900,1300],[2700,600],[3500,450],[3800,1200],[3500,2200],[2600,2600],[1600,2500],[1000,2100]] },
  { id:'wueste', name:'Wüsten-Canyon', theme:'desert', w:132, seed:42, pads:[.04,.27,.52,.8], ramps:[.1,.35,.6,.92],
    pts:[[500,500],[3800,500],[4200,900],[4000,1500],[2600,1500],[2200,1900],[2600,2400],[4200,2500],[4300,3000],[3800,3300],[600,3300],[300,2800],[300,1000]] },
];

function buildTrack(def){
  const P = def.pts, m = P.length, pts = [];
  for(let i=0;i<m;i++){
    const p0=P[(i-1+m)%m], p1=P[i], p2=P[(i+1)%m], p3=P[(i+2)%m];
    const steps = Math.max(6, Math.ceil(Math.hypot(p2[0]-p1[0], p2[1]-p1[1]) / 8));
    for(let s=0;s<steps;s++){
      const t=s/steps, t2=t*t, t3=t2*t;
      const f=(a,b,c,d)=>0.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      pts.push({ x:f(p0[0],p1[0],p2[0],p3[0]), y:f(p0[1],p1[1],p2[1],p3[1]) });
    }
  }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of pts){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }
  const M = 450;
  for(const p of pts){ p.x += M-minX; p.y += M-minY; }
  const n = pts.length;
  let len = 0;
  for(let i=0;i<n;i++){
    const a=pts[(i-1+n)%n], b=pts[(i+1)%n], dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1;
    pts[i].tx=dx/l; pts[i].ty=dy/l;
    const c=pts[(i+1)%n]; len += Math.hypot(c.x-pts[i].x, c.y-pts[i].y);
  }
  const th = THEMES[def.theme] || THEMES.grass;
  const T = { ...def, th, pts, n, len, W:Math.ceil(maxX-minX+2*M), H:Math.ceil(maxY-minY+2*M) };
  const rng = mulberry32(def.seed), trees = [];
  for(let k=0;k<2500 && trees.length<280;k++){
    const x=rng()*T.W, y=rng()*T.H, r=(16+rng()*24)*th.rScale;
    let ok=true; const lim=(def.w/2+r+70)**2;
    for(let i=0;i<n;i+=3){ const p=pts[i]; if((p.x-x)**2+(p.y-y)**2<lim){ ok=false; break; } }
    if(ok) trees.push({x,y,r});
  }
  T.trees = trees;
  // Reifenstapel an Kurven-Außenseiten
  const trng = mulberry32(def.seed+5), tyres = [];
  for(let i=0;i<n;i+=6){
    const a=pts[i], b=pts[(i+6)%n], cross=a.tx*b.ty - a.ty*b.tx;
    if(Math.abs(cross) < 0.06 || trng()<.3 || th.lava) continue;
    const side = cross>0 ? -1 : 1, d = def.w/2 + 48;
    tyres.push({ x:a.x - a.ty*side*d, y:a.y + a.tx*side*d });
  }
  T.tyres = tyres;
  // Plätze für Zuschauer am Streckenrand (mehr rund um Start/Ziel)
  const srng = mulberry32(def.seed+11), specs = [];
  const trySpec = (i, side, d) => {
    const a=pts[(i+n)%n], x=a.x - a.ty*side*d, y=a.y + a.tx*side*d;
    for(let j=0;j<n;j+=3){ const p=pts[j]; if((p.x-x)**2+(p.y-y)**2 < (def.w/2+55)**2) return; }
    if(trees.some(t=>(t.x-x)**2+(t.y-y)**2 < (t.r+20)**2)) return;
    if(tyres.some(t=>(t.x-x)**2+(t.y-y)**2 < 32**2)) return;
    if(specs.some(s=>(s.x-x)**2+(s.y-y)**2 < 34**2)) return;
    specs.push({x,y});
  };
  for(let i=-70;i<=70;i+=9) for(const side of [-1,1]) trySpec(i, side, def.w/2+72+srng()*14);
  const stepS = Math.max(8, Math.floor(n/90));
  for(let i=80;i<n-80;i+=stepS) trySpec(i, srng()<.5?1:-1, def.w/2+70+srng()*30);
  T.specs = specs;
  // Power-Up-Würfel: 4 Reihen quer über die Strecke
  const boxes = [];
  for(const f of [0.13, 0.38, 0.63, 0.88]){
    const a = pts[Math.floor(f*n)];
    for(const o of [-0.3,-0.1,0.1,0.3]) boxes.push({ x:a.x - a.ty*o*def.w, y:a.y + a.tx*o*def.w });
  }
  T.boxes = boxes;
  // Turbo-Felder und Sprungschanzen
  const mark = f => { const i=Math.floor(f*n)%n, a=pts[i]; return { x:a.x, y:a.y, tx:a.tx, ty:a.ty, idx:i }; };
  T.pads = (def.pads||[]).map(mark);
  T.ramps = (def.ramps||[]).map(mark);
  // Straßenlaternen (Nachtstadt)
  T.lamps = [];
  if(th.lamps) for(let i=0;i<n;i+=22){ const a=pts[i], side=(i/22)%2?1:-1, d=def.w/2+36; T.lamps.push({ x:a.x - a.ty*side*d, y:a.y + a.tx*side*d }); }
  // Hindernisse für die Physik (cr = Abstand Mittelpunkt bis Automitte)
  const p0=pts[0], gh=def.w/2+24;
  T.obst = [
    ...trees.map(t=>({ x:t.x, y:t.y, cr:t.r*th.obstK+13 })),
    ...tyres.map(t=>({ x:t.x, y:t.y, cr:7+12 })),
    ...T.lamps.map(t=>({ x:t.x, y:t.y, cr:3+12 })),
    { x:p0.x - p0.ty*gh, y:p0.y + p0.tx*gh, cr:4+12 }, { x:p0.x + p0.ty*gh, y:p0.y - p0.tx*gh, cr:4+12 },
  ];
  return T;

const TRACKS = TRACK_DEFS.map(buildTrack);

function trackPath(g, T, s=1, ox=0, oy=0){
  g.beginPath();
  T.pts.forEach((p,i)=> i ? g.lineTo(p.x*s+ox, p.y*s+oy) : g.moveTo(p.x*s+ox, p.y*s+oy));
  g.closePath();
}

// Boden-Textur (Gras, Straße, Curbs, Startlinie) – wird auf den 3D-Boden gelegt
function renderGroundCanvas(T){
  const S = Math.min(1, 4096/Math.max(T.W,T.H));
  const c = document.createElement('canvas');
  c.width = Math.ceil(T.W*S); c.height = Math.ceil(T.H*S);
  const g = c.getContext('2d'); g.scale(S,S);
  const rng = mulberry32(T.seed*3+1), th=T.th;
  g.fillStyle=th.ground; g.fillRect(0,0,T.W,T.H);
  for(let i=0;i<14000;i++){ g.fillStyle = th.noise[Math.floor(rng()*th.noise.length)]; const s=3+rng()*(th.lava?22:8); g.fillRect(rng()*T.W, rng()*T.H, s, s); }
  if(th.lava) for(let i=0;i<500;i++){ g.strokeStyle='rgba(60,10,0,.35)'; g.lineWidth=3+rng()*5; g.beginPath(); let x=rng()*T.W, y=rng()*T.H; g.moveTo(x,y); for(let k=0;k<5;k++){ x+=(rng()-.5)*160; y+=(rng()-.5)*160; g.lineTo(x,y); } g.stroke(); }
  if(th.obst!=='building') for(const t of T.trees){ g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.arc(t.x+4,t.y+5,t.r*1.05,0,7); g.fill(); }
  g.lineJoin='round'; g.lineCap='round';
  trackPath(g,T); g.lineWidth=T.w+(th.runoffW||60); g.strokeStyle=th.runoff; g.stroke();
  trackPath(g,T); g.lineWidth=T.w+20; g.strokeStyle='#d8322b'; g.stroke();
  g.setLineDash([26,26]); g.strokeStyle='#fff'; g.stroke(); g.setLineDash([]);
  trackPath(g,T); g.lineWidth=T.w; g.strokeStyle=th.road; g.stroke();
  trackPath(g,T); g.lineWidth=T.w-30; g.strokeStyle='rgba(255,255,255,.03)'; g.stroke();
  trackPath(g,T); g.lineWidth=3; g.setLineDash([30,42]); g.strokeStyle='rgba(255,255,255,.6)'; g.stroke(); g.setLineDash([]);
  const p=T.pts[0], ang=Math.atan2(p.ty,p.tx), cells=10, s=T.w/cells;
  g.save(); g.translate(p.x,p.y); g.rotate(ang);
  for(let i=0;i<cells;i++) for(let j=0;j<2;j++){ g.fillStyle=(i+j)%2?'#fff':'#111'; g.fillRect(-s+j*s, -T.w/2+i*s, s, s); }
  g.restore();
  return c;
}
// Leuchtmaske für Lava (nur die Lava glüht, die Strecke nicht)
function renderLavaGlow(T){
  const S = Math.min(1, 4096/Math.max(T.W,T.H));
  const c = document.createElement('canvas'); c.width = Math.ceil(T.W*S); c.height = Math.ceil(T.H*S);
  const g = c.getContext('2d'); g.scale(S,S);
  g.fillStyle='#ff6a20'; g.fillRect(0,0,T.W,T.H);
  g.lineJoin='round'; g.lineCap='round';
  trackPath(g,T); g.lineWidth=T.w+(T.th.runoffW||60)+8; g.strokeStyle='#000'; g.stroke();
  return c;
}

function drawPreview(T, size, pad=10){
  const c=document.createElement('canvas'), s=(size-2*pad)/Math.max(T.W,T.H);
  c.width=Math.ceil(T.W*s+2*pad); c.height=Math.ceil(T.H*s+2*pad);
  const g=c.getContext('2d'); g.lineJoin='round';
  trackPath(g,T,s,pad,pad); g.lineWidth=Math.max(4,T.w*s); g.strokeStyle='#ddd'; g.stroke();
  trackPath(g,T,s,pad,pad); g.lineWidth=Math.max(2,T.w*s*.6); g.strokeStyle='#555'; g.stroke();
  const p=T.pts[0]; g.fillStyle='#ffcc00'; g.beginPath(); g.arc(p.x*s+pad,p.y*s+pad,4,0,7); g.fill();
  c.scale=s; c.pad=pad; return c;
}

const _m = window.THREE ? new THREE.Matrix4() : null, _q = window.THREE ? new THREE.Quaternion() : null;

const BOX = (x,y,z)=> new THREE.BoxGeometry(x,y,z);
function makeCarMesh(color, ghost=false){
  const mat = (c, basic=false) => ghost
    ? new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:.33, depthWrite:false })
    : basic ? new THREE.MeshBasicMaterial({ color:c }) : new THREE.MeshLambertMaterial({ color:c });
  const g = new THREE.Group(), chassis = new THREE.Group();
  const paint = mat(color), dark = mat(0x1b2330), white = mat(0xffffff), black = mat(0x151515);
  const add = (geo, m, x, y, z, parent=chassis) => { const o=new THREE.Mesh(geo, m); o.position.set(x,y,z); o.castShadow=!ghost; parent.add(o); return o; };
  add(BOX(40,7,20), paint, 0, 8, 0);                 // Karosserie
  add(BOX(12,3,19), paint, 14, 5.6, 0);               // Schnauze
  add(BOX(17,7,16.5), dark, -2, 15, 0);               // Kabine/Scheiben
  add(BOX(13,1.4,15.5), paint, -3, 19.1, 0);          // Dach
  add(BOX(40.3,0.6,4), white, 0, 11.8, 0);            // Rennstreifen
  add(BOX(4,1.4,21), black, -19, 16.5, 0);            // Spoiler
  add(BOX(2,4.5,2), black, -18.5, 13.5, 6); add(BOX(2,4.5,2), black, -18.5, 13.5, -6);
  add(BOX(1,2.4,4.5), mat(0xfff3b0,true), 20.3, 9, 6); add(BOX(1,2.4,4.5), mat(0xfff3b0,true), 20.3, 9, -6);
  add(BOX(1,2.4,4.5), mat(0xff3030,true), -20.3, 9, 6); add(BOX(1,2.4,4.5), mat(0xff3030,true), -20.3, 9, -6);
  g.add(chassis);
  const wGeo = new THREE.CylinderGeometry(5,5,4,14).rotateX(Math.PI/2), wMat = mat(0x111111), wheels=[], front=[];
  for(const [x,z] of [[12,10.5],[12,-10.5],[-12,10.5],[-12,-10.5]]){
    const pivot = new THREE.Group(); pivot.position.set(x,5,z); g.add(pivot);
    const w = new THREE.Mesh(wGeo, wMat); w.castShadow=!ghost; pivot.add(w); wheels.push(w);
    if(x>0) front.push(pivot);
  }
  g.userData = { chassis, wheels, front, paint, spin:0 };
  if(!ghost){
    // Turbo-Flammen
    const fGeo = new THREE.ConeGeometry(3.2, 16, 8).rotateZ(Math.PI/2).translate(-8,0,0);
    const fMat = new THREE.MeshBasicMaterial({ color:0xff9a1f, transparent:true, opacity:.9 });
    const flames = [6,-6].map(z=>{ const f=new THREE.Mesh(fGeo, fMat); f.position.set(-20,7,z); f.visible=false; chassis.add(f); return f; });
    // Schild-Blase
    const shield = new THREE.Mesh(new THREE.SphereGeometry(30,20,14), new THREE.MeshBasicMaterial({ color:0x66ccff, transparent:true, opacity:.25, depthWrite:false }));
    shield.position.y = 9; shield.visible = false; g.add(shield);
    // Blitz über dem Auto (wenn verlangsamt)
    const zap = makeTag('⚡ LANGSAM', '#ffe14a'); zap.position.y = 52; zap.visible = false; g.add(zap);

function disposeGroup(grp){

function buildTrack3D(T){
  if(R3.builtTrack===T) return;
  if(R3.trackGroup){ R3.scene.remove(R3.trackGroup); disposeGroup(R3.trackGroup); }
  const grp = new THREE.Group();
  // Boden mit Strecken-Textur
  const tex = new THREE.CanvasTexture(renderGroundCanvas(T));
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = R3.renderer.capabilities.getMaxAnisotropy();
  const TH = T.th;
  const gMat = new THREE.MeshLambertMaterial({ map:tex });
  if(TH.lava){ const gl=new THREE.CanvasTexture(renderLavaGlow(T)); gl.colorSpace=THREE.SRGBColorSpace; gMat.emissiveMap=gl; gMat.emissive=new THREE.Color(0xffffff); gMat.emissiveIntensity=.85; }
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(T.W, T.H), gMat);
  ground.rotation.x = -Math.PI/2; ground.position.set(T.W/2, 0, T.H/2); ground.receiveShadow = true;
  grp.add(ground);
  // Himmel, Nebel, Licht und Boden bis zum Horizont passend zur Welt
  const sky = new THREE.Color(TH.sky);
  R3.scene.background = sky;
  R3.scene.fog = new THREE.Fog(new THREE.Color(TH.fogColor || TH.sky), TH.fog[0], TH.fog[1]);
  R3.hemi.color.set(TH.hemi[0]); R3.hemi.groundColor.set(TH.hemi[1]); R3.hemi.intensity = TH.hemi[2];
  R3.sun.color.set(TH.sun[0]); R3.sun.intensity = TH.sun[1];
  R3.outer.material.color.set(TH.outer);
  R3.outer.material.emissive = new THREE.Color(TH.lava ? 0xcc3300 : 0x000000);
  // Hindernisse (Bäume, Schneetannen, Hochhäuser, Felsen, Kakteen)
  R3.treeMeshes = buildObstacles3D(T, grp);
  R3.treeOrig = R3.treeMeshes.map(im => im.instanceMatrix.array.slice());
  R3.hiddenTrees = [];
  // Turbo-Felder
  const padMat = new THREE.MeshBasicMaterial({ map:padTexture(), transparent:true, opacity:.95, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-3, polygonOffsetUnits:-3 });
  R3.padMeshes = T.pads.map(pd=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(64, 46).rotateX(-Math.PI/2), padMat);
    m.position.set(pd.x, .45, pd.y); m.rotation.y = -Math.atan2(pd.ty, pd.tx); grp.add(m); return m;
  });
  // Sprungschanzen
  const rampMat = new THREE.MeshLambertMaterial({ map:rampTexture() });
  for(const rp of T.ramps){
    const g = new THREE.Group(); g.position.set(rp.x, 0, rp.y); g.rotation.y = -Math.atan2(rp.ty, rp.tx);
    const m = new THREE.Mesh(BOX(40, 3, T.w), rampMat);
    m.rotation.z = 0.24; m.position.y = 4.6; m.castShadow = true; m.receiveShadow = true; g.add(m);
    grp.add(g);
  }
  // Straßenlaternen
  if(T.lamps.length){
    const pole = new THREE.InstancedMesh(new THREE.CylinderGeometry(1.6,2,70,6).translate(0,35,0), new THREE.MeshLambertMaterial({ color:0x666a72 }), T.lamps.length);
    const head = new THREE.InstancedMesh(new THREE.SphereGeometry(5,10,8), new THREE.MeshBasicMaterial({ color:0xffe9a8 }), T.lamps.length);
    const glow = new THREE.InstancedMesh(new THREE.CircleGeometry(34,20).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ color:0xffd98a, transparent:true, opacity:.18, depthWrite:false }), T.lamps.length);
    const q0 = new THREE.Quaternion();
    T.lamps.forEach((l,i)=>{
      pole.setMatrixAt(i, _m.compose(_p.set(l.x,0,l.y), q0, _s.set(1,1,1)));
      head.setMatrixAt(i, _m.compose(_p.set(l.x,72,l.y), q0, _s.set(1,1,1)));
      glow.setMatrixAt(i, _m.compose(_p.set(l.x,.3,l.y), q0, _s.set(1,1,1)));
    });
    for(const im of [pole,head,glow]){ im.frustumCulled=false; grp.add(im); }
    pole.castShadow = true;
  }
  // Start-/Zieltor
  const p0 = T.pts[0], half = T.w/2 + 24;
  const gate = new THREE.Group(); gate.position.set(p0.x, 0, p0.y); gate.rotation.y = -Math.atan2(p0.ty, p0.tx);
  const postMat = new THREE.MeshLambertMaterial({ color:0xdddddd });
  for(const z of [-half, half]){ const post = new THREE.Mesh(BOX(6,74,6), postMat); post.position.set(0,37,z); post.castShadow=true; gate.add(post); }
  const bmat = new THREE.MeshLambertMaterial({ map:bannerTexture() });
  // Banner: lange Seite quer über die Strecke, bedruckte Seiten zeigen in Fahrtrichtung

  banner.castShadow = true; gate.add(banner);
  grp.add(gate);
  // Reifenstapel an den Kurven-Außenseiten (Deko)
  const tyreGeo = new THREE.CylinderGeometry(7,7,12,10), tyreMat = new THREE.MeshLambertMaterial({ color:0x222222 });
  const tyres = T.tyres;
  if(tyres.length){
    const tm = new THREE.InstancedMesh(tyreGeo, tyreMat, tyres.length);
    tyres.forEach((t,i)=> tm.setMatrixAt(i, _m.compose(_p.set(t.x,6,t.y), new THREE.Quaternion(), _s.set(1,1,1))));
    tm.castShadow=true; tm.frustumCulled=false; grp.add(tm);
  }
  // Power-Up-Würfel
  const boxMat = new THREE.MeshLambertMaterial({ map:boxTexture(), transparent:true, opacity:.92, emissive:0x333333 });
  const boxGeo = BOX(18,18,18);
  R3.boxMeshes = T.boxes.map(b=>{ const m=new THREE.Mesh(boxGeo, boxMat); m.position.set(b.x,14,b.y); m.castShadow=true; grp.add(m); return m; });
  R3.scene.add(grp); R3.trackGroup = grp; R3.builtTrack = T;
}

// Hindernis-Modelle je Welt. Rückgabe: Liste von InstancedMeshes (Index = Baum-Index, zum Ausblenden)
function buildObstacles3D(T, grp){
  const n=T.trees.length, kind=T.th.obst, q=new THREE.Quaternion(), list=[];
  const mk = (geo, mat) => { const im=new THREE.InstancedMesh(geo, mat, n); list.push(im); return im; };
  const LAM = c => new THREE.MeshLambertMaterial({ color:c });
  const unit = g => g.translate(0,.5,0);
  if(kind==='pine' || kind==='snowpine'){
    const trunk = mk(unit(new THREE.CylinderGeometry(.5,.7,1,7)), LAM(0x6b4a2b));
    const crown = mk(unit(new THREE.ConeGeometry(1,1,9)), LAM(kind==='snowpine'?0x2f5a3a:0x2c6a28));
    const crown2 = mk(unit(new THREE.ConeGeometry(1,1,9)), LAM(kind==='snowpine'?0xf4f8ff:0x3d8a36));
    T.trees.forEach((t,i)=>{
      const h=t.r*0.9; q.setFromAxisAngle(UP, t.x*0.37);
      trunk.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, _s.set(t.r*0.5, h, t.r*0.5)));
      crown.setMatrixAt(i, _m.compose(_p.set(t.x,h*0.7,t.y), q, _s.set(t.r*1.05, t.r*1.9, t.r*1.05)));
      crown2.setMatrixAt(i, _m.compose(_p.set(t.x,h*0.7+t.r*1.0,t.y), q, _s.set(t.r*.72, t.r*1.5, t.r*.72)));
    });
  } else if(kind==='cactus'){
    const body = mk(unit(new THREE.CylinderGeometry(.5,.55,1,8)), LAM(0x3f8f3f));
    const armA = mk(unit(new THREE.CylinderGeometry(.5,.5,1,8)), LAM(0x4a9a48));
    const armB = mk(unit(new THREE.CylinderGeometry(.5,.5,1,8)), LAM(0x4a9a48));
    T.trees.forEach((t,i)=>{
      const yaw=t.x*0.37, cx=Math.cos(yaw), sz=Math.sin(yaw), r=t.r;
      q.setFromAxisAngle(UP, yaw);
      body.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, _s.set(r*.45, r*2.6, r*.45)));
      armA.setMatrixAt(i, _m.compose(_p.set(t.x+cx*r*.5,r*0.9,t.y-sz*r*.5), q, _s.set(r*.3, r*1.0, r*.3)));
      armB.setMatrixAt(i, _m.compose(_p.set(t.x-cx*r*.5,r*1.3,t.y+sz*r*.5), q, _s.set(r*.28, r*0.8, r*.28)));
    });
  } else if(kind==='rock'){
    const rock = mk(new THREE.DodecahedronGeometry(1,0), LAM(0x2b2522));
    const tip = mk(new THREE.ConeGeometry(1,1,6), new THREE.MeshBasicMaterial({ color:0xff7a20 }));
    T.trees.forEach((t,i)=>{
      q.setFromAxisAngle(UP, t.x*0.37);
      rock.setMatrixAt(i, _m.compose(_p.set(t.x,t.r*.35,t.y), q, _s.set(t.r, t.r*1.1, t.r)));
      tip.setMatrixAt(i, _m.compose(_p.set(t.x,t.r*1.45,t.y), q, _s.set(t.r*.25, t.r*.5, t.r*.25)));
    });
  } else if(kind==='building'){
    const mat = new THREE.MeshLambertMaterial({ map:windowTexture(), emissiveMap:windowTexture(true), emissive:new THREE.Color(0xffffff), emissiveIntensity:1 });
    const b = mk(unit(new THREE.BoxGeometry(1,1,1)), mat);
    const rng = mulberry32(T.seed+3);
    T.trees.forEach((t,i)=>{
      q.setFromAxisAngle(UP, Math.floor(rng()*4)*Math.PI/2 + .2*(rng()-.5));
      b.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, _s.set(t.r*1.6, 70+rng()*190, t.r*1.6)));
    });
  }
  for(const im of list){ im.castShadow=true; im.receiveShadow=true; im.frustumCulled=false; grp.add(im); }
  return list;
}

function windowTexture(glow=false){
  const c=document.createElement('canvas'); c.width=64; c.height=128; const g=c.getContext('2d');
  const rng=mulberry32(glow?5:5);
  g.fillStyle = glow ? '#000' : '#1d2230'; g.fillRect(0,0,64,128);
  for(let y=4;y<124;y+=10) for(let x=4;x<60;x+=12){
    const on = rng()<.45;

// Blendet die angegebenen Bäume aus (Skalierung 0) und stellt vorher versteckte wieder her
function setHiddenTrees(list){
  const prev=R3.hiddenTrees||[];
  if(prev.length===list.length && prev.every((v,i)=>v===list[i])) return;
  R3.treeMeshes.forEach((im,k)=>{
    const arr=im.instanceMatrix.array, orig=R3.treeOrig[k];
    for(const i of prev) for(let j=0;j<16;j++) arr[i*16+j]=orig[i*16+j];
    for(const i of list){ for(let j=0;j<16;j++) arr[i*16+j]=0; }
    im.instanceMatrix.needsUpdate=true;
  });
  R3.hiddenTrees=list.slice();
}

let hotImgs = [];
async function loadHot(){
  if(location.protocol==='file:') return;
  try{
    const list = await (await fetch('api/hot')).json();
    const imgs = await Promise.all(list.slice(0,100).map(f => new Promise(res=>{
      const im = new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src='hot/'+encodeURIComponent(f);
    })));
    hotImgs = imgs.filter(Boolean);
  }catch(e){ hotImgs = []; }
}
const hotReady = loadHot();

function buildSpectators(T){
  if(R3.specFor===T && R3.specCount===hotImgs.length) return;
  if(R3.specGroup){ R3.scene.remove(R3.specGroup); R3.specGroup=null; }
  R3.specFor=T; R3.specCount=hotImgs.length;
  if(!hotImgs.length) return;
  if(!R3.hotMats || R3.hotMats.length!==hotImgs.length){
    R3.hotMats = hotImgs.map(im=>{
      const t=new THREE.Texture(im); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; t.needsUpdate=true;
      return { m:new THREE.SpriteMaterial({ map:t }), a:im.naturalWidth/Math.max(1,im.naturalHeight) };
    });
  }
  const grp=new THREE.Group(), rng=mulberry32(T.seed+17), off=Math.floor(rng()*hotImgs.length);
  const baseGeo=new THREE.CylinderGeometry(9,9,1.5,14), baseMat=new THREE.MeshLambertMaterial({ color:0x555555 });
  T.specs.forEach((s,i)=>{
    const M=R3.hotMats[(i+off)%R3.hotMats.length];
    const h=42+rng()*10, w=Math.min(h*M.a, 70);
    const sp=new THREE.Sprite(M.m); sp.center.set(.5,0); sp.scale.set(w,h,1); sp.position.set(s.x,1.5,s.y);
    const base=new THREE.Mesh(baseGeo, baseMat); base.position.set(s.x,.75,s.y); base.receiveShadow=true;
    grp.add(sp, base);
  });
  R3.scene.add(grp); R3.specGroup=grp;
}

function addSkid(ax, ay, bx, by, off){
  const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy); if(len<0.01) return;
  const sk=R3.skid, i=R3.skidN % SKID_MAX; R3.skidN++;
  _q.setFromAxisAngle(UP, -Math.atan2(dy,dx));
  sk.setMatrixAt(i, _m.compose(_p.set((ax+bx)/2, .35, (ay+by)/2), _q, _s.set(len, 1, 4.5)));
  sk.setColorAt(i, off ? SKID_BROWN : SKID_BLACK);
  sk.count = Math.min(R3.skidN, SKID_MAX);
  sk.instanceMatrix.needsUpdate = true; sk.instanceColor.needsUpdate = true;
}
const SKID_BLACK = window.THREE ? new THREE.Color(0x111111) : null, SKID_BROWN = window.THREE ? new THREE.Color(0x4a3418) : null;

function colorOf(hex){ return R3.colCache[hex] || (R3.colCache[hex] = new THREE.Color(hex)); }

// ---------- Audio ----------
let actx=null, master, eOsc1, eOsc2, eGain, eFilt, muted = store.get('brumbrum.muted') === true;
function initAudio(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted?0:1; master.connect(actx.destination);
    eOsc1 = actx.createOscillator(); eOsc1.type='sawtooth';
    eOsc2 = actx.createOscillator(); eOsc2.type='square';
    eFilt = actx.createBiquadFilter(); eFilt.type='lowpass'; eFilt.frequency.value=700;
    eGain = actx.createGain(); eGain.gain.value=0;
    const g2 = actx.createGain(); g2.gain.value=.5;
    eOsc1.connect(eFilt); eOsc2.connect(g2).connect(eFilt); eFilt.connect(eGain).connect(master);
    eOsc1.start(); eOsc2.start();
  }catch(e){ actx=null; }
}
function beep(freq, dur=.18, type='square', vol=.12){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
  o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.02);
}
function thud(){ beep(70,.25,'triangle',.3); }
function toggleMute(){ muted=!muted; store.set('brumbrum.muted',muted); if(master) master.gain.value=muted?0:1; showPop($('pop'), muted?'Ton aus 🔇':'Ton an 🔊','',900); }
function updateEngine(){
  if(!actx) return;
  const t=actx.currentTime;
  const active = state==='race'||state==='countdown'||state==='finished';
  let sp=0, throttle=false;
  for(const p of viewers()){ sp=Math.max(sp, Math.hypot(p.car.vx,p.car.vy)); throttle = throttle || p.lastInput.up; }
  const s=Math.min(1.2,sp/650), gear=Math.min(4,Math.floor(s*5)), rpm=s*5-gear;
  const f = 48 + gear*6 + rpm*75 + (state==='countdown'&&throttle?60:0);
  eOsc1.frequency.setTargetAtTime(f,t,.05); eOsc2.frequency.setTargetAtTime(f/2,t,.05);
  eFilt.frequency.setTargetAtTime(400+f*6,t,.05);
  eGain.gain.setTargetAtTime(active ? (throttle?.09:.05) : 0, t, .08);
}

const keys = {}, touch = {left:false,right:false,gas:false,brake:false,item:false};
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const KEYMAPS = {
  wasd:   { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'], hand:['Space','ShiftLeft'], item:['KeyE','KeyQ'], itemKey:'E' },
  arrows: { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'], hand:['ShiftRight','ControlRight','Numpad0'], item:['Enter','NumpadEnter','Numpad1','Period'], itemKey:'Enter' },
};
KEYMAPS.both = { itemKey:'E' }; for(const k of ['up','down','left','right','hand','item']) KEYMAPS.both[k] = [...KEYMAPS.wasd[k], ...KEYMAPS.arrows[k]];
function keyboardInput(map, useTouch=false){
  const any = list => list.some(c => keys[c]);
  return { itemKey: useTouch && isTouch ? '★' : map.itemKey, read(){
    const L = any(map.left) || (useTouch && touch.left), R = any(map.right) || (useTouch && touch.right);
    return { up: any(map.up) || (useTouch && touch.gas), down: any(map.down) || (useTouch && touch.brake), steer:(R?1:0)-(L?1:0), hand: any(map.hand), item: any(map.item) || (useTouch && touch.item) };
  }};
}
const NO_INPUT = { up:false, down:false, steer:0, hand:false, item:false }, BRAKE_INPUT = { up:false, down:true, steer:0, hand:false, item:false };

addEventListener('keydown', e=>{
  if(e.target && e.target.tagName==='INPUT'){ if(e.code==='Enter' || e.code==='NumpadEnter') joinRoom(); return; }
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  if(e.code==='KeyR' && track && state!=='menu') restart();
  else if(e.code==='Escape') showMenu();
  else if(e.code==='KeyM') toggleMute();
  else if(e.code==='KeyP') togglePause();
  else if(e.code==='KeyC'){ camMode=(camMode+1)%3; store.set('brumbrum.cam',camMode); if(state!=='menu') showPop($('pop'), ['Kamera: Nah','Kamera: Weit','Kamera: Hoch'][camMode],'',900); }
  else if(e.code==='KeyG'){ ghostOn=!ghostOn; $('ghostChk').checked=ghostOn; store.set('brumbrum.ghost',ghostOn); if(state!=='menu') showPop($('pop'), ghostOn?'Geist an 👻':'Geist aus','',900); }
  else if(e.code==='Enter' && state==='menu') menuStart();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
[['tL','left'],['tR','right'],['tG','gas'],['tB','brake'],['tI','item']].forEach(([id,k])=>{
  const b=$(id);
  const on=e=>{ e.preventDefault(); touch[k]=true; b.classList.add('on'); initAudio(); };
  const off=e=>{ e.preventDefault(); touch[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
});

// ---------- Netzwerk (Online-Modus) ----------
const net = { ws:null, role:null, code:null, peer:null, ips:[], port:location.port||80, err:null };
function nsend(o){ if(net.ws && net.ws.readyState===1) net.ws.send(JSON.stringify(o)); }
function netConnect(){
  return new Promise((resolve, reject)=>{
    let ws;
    try{ ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host); }catch(e){ return reject(e); }
    net.ws = ws;
    ws.onopen = ()=>{ net.err=null; resolve(); };
    ws.onerror = ()=> reject(new Error('ws'));
    ws.onmessage = e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; } try{ onNet(m); }catch(err){ console.error(err); } };
    ws.onclose = ()=>{ if(net.ws===ws) onNetClose(); };
  });
}
async function ensureNet(){
  if(net.ws && net.ws.readyState===1) return true;
  try{ await netConnect(); return true; }
  catch(e){ net.err='Keine Verbindung zum Server. Läuft „node server.js“?'; renderLobby(); return false; }
}
async function createRoom(){ initAudio(); if(await ensureNet()) nsend({t:'create'}); }
async function joinRoom(){
  initAudio();
  const code=$('codeIn').value.trim().toUpperCase();
  if(code.length!==4){ net.err='Der Code hat 4 Buchstaben.'; renderLobby(); return; }
  if(await ensureNet()) nsend({t:'join', code});
}
function leaveRoomNet(){ nsend({t:'leave'}); net.code=null; net.role=null; net.peer=null; net.err=null; renderLobby(); }
function sendInfo(){ nsend({t:'info', color:COLORS[sel.colors[0]]}); }
function oppColor(c){
  const mine=COLORS[sel.colors[0]];
  if(!c || c==='#888') return '#888';
  return c!==mine ? c : COLORS[(sel.colors[0]+1)%COLORS.length];
}
function remotePlayer(){ return raceMode==='online' ? players.find(p=>p.remote) : null; }
function markRemoteLeft(text){
  const r=remotePlayer();
  if(r && !r.left && state!=='menu'){ r.left=true; showPop($('pop'), text, 'bad', 3500); checkEnd(); }
}

function onNet(m){
  switch(m.t){
    case 'created': net.role='host'; net.code=m.code; net.ips=m.ips||[]; net.port=m.port; net.peer=null; net.err=null; break;
    case 'joined':  net.role='guest'; net.code=m.code; net.peer={color:'#888'}; net.err=null; sendInfo(); break;
    case 'peer':    net.peer={color:'#888'}; sendInfo(); beep(880,.12); break;
    case 'info':    if(net.peer) net.peer.color=m.color; { const r=remotePlayer(); if(r) r.color=oppColor(m.color); } break;
    case 'err':     net.err=m.msg; break;
    case 'left':
      net.peer=null;
      if(m.closed){ net.code=null; net.role=null; net.err='Der Host hat den Raum verlassen.'; }
      markRemoteLeft('Gegner hat das Spiel verlassen');
      break;
    case 'quit':    markRemoteLeft('Gegner hat das Rennen abgebrochen'); break;
    case 'start':   sel.mode='online'; sel.track=m.track; sel.laps=m.laps; sel.pu=!!m.pu; startRace(); break;
    case 's': {
      const r=remotePlayer(); if(!r || state==='menu') return;
      r.net={...m, recv:performance.now()}; r.lapCount=m.l||0; break;
    }
    case 'box':   if(state!=='menu' && racePU && boxTimers[m.i]!=null) boxTimers[m.i]=BOX_RESPAWN; break;
    case 'oil':   if(state!=='menu' && racePU && R3) addOil(m.x, m.y, remotePlayer(), m.id); break;
    case 'oilrm': { const o=oils.find(q=>q.id===m.id); if(o) removeOil(o); break; }
    case 'zap': {
      const me=viewers()[0];
      if(me && state==='race' && racePU){
        if(me.car.shield>0) showPop(me.pop,'🛡️ Blitz abgewehrt!','good',1800);
        else { me.car.slow=SLOW_T; showPop(me.pop,'⚡ Du wurdest geblitzt!','bad',1800); beep(1400,.3,'sawtooth',.1); }
      }
      break;
    }
    case 'fin': {
      const r=remotePlayer(); if(!r || r.finished || state!=='race') return;
      r.laps=m.laps||[]; r.lapCount=r.laps.length; finishPlayer(r, m.time); break;
    }
  }
  renderLobby();
}
function onNetClose(){
  const had=!!net.code;
  net.ws=null; net.code=null; net.role=null; net.peer=null;
  if(had) net.err='Verbindung zum Server getrennt.';
  markRemoteLeft('Verbindung verloren');
  renderLobby();
}

const kLap = (T,pu)=>`brumbrum.lap.${T.id}${puS(pu)}`, kTot=(T,l,pu)=>`brumbrum.total.${T.id}.${l}${puS(pu)}`, kGhost=(T,l,pu)=>`brumbrum.ghostdata.${T.id}.${l}${puS(pu)}`;
const viewers = ()=> players.filter(p=>!p.remote);

function makeCar(offset){
  const i=6, p=track.pts[i], nx=-p.ty, ny=p.tx;
  return { x:p.x+nx*offset, y:p.y+ny*offset, a:Math.atan2(p.ty,p.tx), vx:0, vy:0, steer:0, fwd:0, lat:0, off:false, idx:i, skid:null,
    boost:0, shield:0, jump:0, slow:0, spin:0, spinDir:1, z:0 };
}
function makePlayer(o){
  const offset = o.n>1 ? (o.slot===0 ? -1 : 1) * track.w*0.24 : 0;
  const car = makeCar(offset);
  return { id:o.slot, name:o.name, tag:o.tag||'', color:o.color, input:o.input, remote:!!o.remote, car,
    laps:[], lapStart:0, nextCP:1, finished:false, finishTime:null, place:null, left:false, lapCount:0, net:null,
    item:null, itemHeld:false,
    ghostRec:[], ghostNext:0, lastInput:NO_INPUT, camYaw:car.a, cam3:null, mesh:null, tagSprite:null, hud:null, pop:null, pitch:0 };
}

function startRace(){
  initAudio();
  if(sel.mode==='online' && !net.code) return;
  if(!init3D()){ $('err3d').classList.remove('hidden'); return; }
  raceMode = sel.mode;
  // alte Autos entfernen
  for(const p of players){ if(p.mesh){ R3.scene.remove(p.mesh); disposeGroup(p.mesh); } }
  track = TRACKS[sel.track];
  buildTrack3D(track);
  buildSpectators(track);
  track.obstCur = hotImgs.length ? track.obst.concat(track.specs.map(s=>({ x:s.x, y:s.y, cr:9+12 }))) : track.obst;
  R3.skidN=0; R3.skid.count=0;
  miniCanvas = drawPreview(track, Math.min(200, Math.max(120, W*.22)), 8);
  const mc=$('mini'); mc.width=miniCanvas.width; mc.height=miniCanvas.height;
  const c0=COLORS[sel.colors[0]], c1=COLORS[sel.colors[1]];
  if(raceMode==='solo'){
    players=[ makePlayer({slot:0, n:1, input:keyboardInput(KEYMAPS.both,true), color:c0, name:'Du'}) ];
  } else if(raceMode==='local'){
    players=[ makePlayer({slot:0, n:2, input:keyboardInput(KEYMAPS.wasd), color:c0, name:'Spieler 1', tag:'P1'}),
              makePlayer({slot:1, n:2, input:keyboardInput(KEYMAPS.arrows), color:c1, name:'Spieler 2', tag:'P2'}) ];
  } else {
    const me = net.role==='host' ? 0 : 1;
    players=[ makePlayer({slot:me, n:2, input:keyboardInput(KEYMAPS.both,true), color:c0, name:'Du', tag:'DU'}),
              makePlayer({slot:1-me, n:2, input:null, remote:true, color:oppColor(net.peer&&net.peer.color), name:'Gegner', tag:'GEGNER'}) ];
    if(!net.peer) players[1].left=true;
  }
  // 3D-Objekte pro Spieler
  players.forEach((p,i)=>{
    p.mesh = makeCarMesh(p.color); p.meshColor=p.color; R3.scene.add(p.mesh);
    p.mesh.userData.zap.layers.set(1+i); // nur für die anderen sichtbar
    if(track.th.night){ // Scheinwerfer in der Nacht
      const hl = new THREE.SpotLight(0xfff0c8, 4, 520, Math.PI/6, 0.55, 0);
      hl.position.set(18, 12, 0); hl.target.position.set(220, 0, 0);
      p.mesh.add(hl, hl.target);
    }
    if(players.length>1 && p.tag){ p.tagSprite = makeTag(p.tag, p.color); p.tagSprite.layers.set(1+i); p.mesh.add(p.tagSprite); }
    if(!p.remote){
      p.cam3 = new THREE.PerspectiveCamera(65, 1, 1, 5000);
      for(let l=1;l<=Math.max(2,players.length);l++) p.cam3.layers.enable(l);
      p.cam3.layers.disable(1+i);
    }
  });
  raceTime=0; particles=[]; dnfTimer=null; sendTimer=0;
  racePU = sel.pu;
  clearOils(); oilSeq=0;
  boxTimers = track.boxes.map(()=>0);
  R3.boxMeshes.forEach(m=>{ m.visible=racePU; m.scale.setScalar(1); });

  buildHUDs();
  state='countdown'; cd=3; lastCd=4;

  $('touch').classList.toggle('hidden', !(isTouch && raceMode!=='local'));
  $('msg').textContent='';
  if(document.activeElement) document.activeElement.blur();
}

let msgTimer=null;
function showMsg(t, ms){ $('msg').textContent=t; clearTimeout(msgTimer); if(ms) msgTimer=setTimeout(()=>{ if($('msg').textContent===t) $('msg').textContent=''; }, ms); }
function showPop(el, t, cls='', ms=2500){ el.textContent=t; el.className='pop '+cls; clearTimeout(el._t); el._t=setTimeout(()=>el.classList.add('hidden'), ms); }

function lapDone(p){
  const lt = raceTime-p.lapStart; p.laps.push(lt); p.lapStart=raceTime;
  let txt=`Runde ${p.laps.length}: ${fmt(lt)}`, cls='';
  if(bestLap!=null){ const d=lt-bestLap; txt+=`  (${d<0?'−':'+'}${Math.abs(d).toFixed(3)})`; cls=d<0?'good':'bad'; }
  if(bestLap==null || lt<bestLap){ bestLap=lt; store.set(kLap(track,racePU),lt); if(cls) txt+='  Beste Runde!'; cls='good'; }
  showPop(p.pop, txt, cls);

function finishPlayer(p, time){
  p.finished=true; p.finishTime=time;
  p.place = 1 + players.filter(q=>q!==p && q.finished && q.finishTime<=time).length;
  if(!p.remote){
    if(players.length>1) showPop(p.pop, p.place===1 ? `🏆 Platz 1!  ${fmt(time)}` : `Platz ${p.place}  ${fmt(time)}`, p.place===1?'good':'', 4000);
    if(raceMode==='online') nsend({t:'fin', time, laps:p.laps});
  } else {
    const me=viewers()[0];
    if(me && !me.finished) showPop(me.pop, `Gegner ist im Ziel: ${fmt(time)}`, 'bad', 3000);
  }
  checkEnd();
}
function checkEnd(){
  if(state!=='race') return;
  if(players.every(p=>p.finished||p.left)) endRace();
  else if(players.some(p=>p.finished) && dnfTimer==null) dnfTimer=DNF_TIME;
}

function endRace(){
  if(state!=='race') return;
  state='finished'; finishTimer=1.6; dnfTimer=null;
  showMsg('ZIEL!', 1500);
  const fin = players.filter(p=>p.finished).sort((a,b)=>a.finishTime-b.finishTime);
  const best = fin.find(p=>!p.remote), rec=$('rRec');
  if(best && (recTotal==null || best.finishTime<recTotal)){
    rec.className='rec';
    rec.textContent = (recTotal==null ? '⭐ Erste Bestzeit gesetzt!' : `⭐ NEUER REKORD! (−${(recTotal-best.finishTime).toFixed(3)} s)`) + (raceMode==='local' ? ` – ${best.name}` : '');
    store.set(kTot(track,sel.laps,racePU), best.finishTime);
    store.set(kGhost(track,sel.laps,racePU), best.ghostRec);
    recTotal = best.finishTime;
  } else {
    rec.className='rec no'; rec.textContent=`Rekord: ${fmt(recTotal)}` + (best && players.length===1 ? `  (+${(best.finishTime-recTotal).toFixed(3)} s)` : '');
  }
  if(players.length===1){
    const p=players[0], mn=Math.min(...p.laps);
    $('rTitle').textContent='🏁 Ziel!';
    $('rBody').innerHTML = `<div class="total">${fmt(p.finishTime)}</div><div class="laps">` +
      p.laps.map((l,i)=>`<div class="${l===mn&&p.laps.length>1?'best':''}">Runde ${i+1}: ${fmt(l)}</div>`).join('') + '</div>';
  } else {
    const order = [...fin, ...players.filter(p=>!p.finished)];
    const w = order[0];
    $('rTitle').textContent = !w.finished ? '🏁 Rennen beendet' : raceMode==='online' ? (w.remote ? '😬 Gegner hat gewonnen!' : '🏆 Du hast gewonnen!') : `🏆 ${w.name} gewinnt!`;
    const medals=['🥇','🥈','🥉'];
    $('rBody').innerHTML = order.map((p,i)=>{
      const bl = p.laps.length ? Math.min(...p.laps) : null;
      const t = p.finished ? fmt(p.finishTime) : (p.left ? 'Verlassen' : 'DNF');
      const gap = p.finished && i>0 ? ` <small>+${(p.finishTime-order[0].finishTime).toFixed(3)} s</small>` : '';
      return `<div class="rank"><div class="medal">${p.finished?medals[i]:(p.left?'🚪':'❌')}</div><div class="who"><i style="background:${p.color}"></i>${p.name}</div>`+
        `<div class="t">${t}${gap}<small>Beste Runde: ${fmt(bl)}</small></div></div>`;
    }).join('');
  }
  const ab=$('againBtn');
  if(raceMode==='online' && net.role!=='host'){ ab.textContent='Warte auf Host…'; ab.disabled=true; }
  else { ab.textContent='Nochmal (R)'; ab.disabled=false; }
}

// ---------- Physik (2D von oben; die 3D-Ansicht stellt sie nur dar) ----------
function nearest(x,y,hint){
  const P=track.pts, n=track.n; let best=hint, bd=Infinity;
  for(let k=-60;k<=60;k++){ const i=(hint+k+n)%n, p=P[i], d=(p.x-x)**2+(p.y-y)**2; if(d<bd){ bd=d; best=i; } }
  if(bd > (track.w*2.5)**2){ for(let i=0;i<n;i++){ const p=P[i], d=(p.x-x)**2+(p.y-y)**2; if(d<bd){ bd=d; best=i; } } }
  return [best, Math.sqrt(bd)];
}

function stepCar(c, inp, dt){
  if(c.spin>0){ inp = { up:false, down:false, steer:0, hand:true }; c.a += 9*dt*c.spinDir; }
  if(c.boost>0) inp = { ...inp, up:true, down:false };
  c.steer += (inp.steer - c.steer) * Math.min(1, dt*10);
  const sp = Math.abs(c.fwd);
  const turn = 2.9 * Math.min(1, sp/140) * (1 - 0.4*Math.min(1, sp/650)) * (inp.hand ? 1.3 : 1);
  c.a += c.steer * turn * dt * (c.fwd < -1 ? -1 : 1);
  const fx=Math.cos(c.a), fy=Math.sin(c.a);
  let fwd = c.vx*fx + c.vy*fy, lat = -c.vx*fy + c.vy*fx;
  if(inp.up) fwd += 540*dt;
  if(inp.down){ if(fwd > 20) fwd -= 950*dt; else fwd = Math.max(fwd - 320*dt, -170); }
  const off = c.off && !(c.jump>0), TH = track.th;
  // Turbo: zusätzlicher Schub, aber nur bis zu einer Höchstgeschwindigkeit
  if(c.boost>0 && fwd < BOOST_MAX) fwd += 380*dt;
  let drag = off ? TH.offDrag : 0.83;
  if(c.slow>0) drag += 1.3;
  if(c.spin>0) drag += 1.6;
  fwd -= fwd * drag * dt;
  if(!inp.up && !inp.down){ const r=Math.min(Math.abs(fwd), 70*dt); fwd -= Math.sign(fwd)*r; }
  if(inp.hand && !(c.spin>0)) fwd -= fwd*0.7*dt;
  const grip = c.jump>0 ? 6 : inp.hand ? 1.5 : (off ? TH.offGrip : 9);
  lat *= Math.exp(-grip*dt);
  c.vx = fx*fwd - fy*lat; c.vy = fy*fwd + fx*lat;
  c.x += c.vx*dt; c.y += c.vy*dt;
  c.fwd=fwd; c.lat=lat;
  // Effekt-Timer
  c.boost=Math.max(0,c.boost-dt); c.shield=Math.max(0,c.shield-dt); c.slow=Math.max(0,c.slow-dt); c.spin=Math.max(0,c.spin-dt);
  c.jump=Math.max(0,c.jump-dt);
  c.z = c.jump>0 ? Math.sin(Math.PI*(1-c.jump/(c.jumpT||JUMP_T)))*(c.jumpH||30) : 0;
}

// Turbo-Felder, Sprungschanzen und Lava für ein lokales Auto
function trackFeatures(p, dist){
  const c=p.car;
  for(const pd of track.pads){
    const dx=c.x-pd.x, dy=c.y-pd.y, al=dx*pd.tx+dy*pd.ty, ac=-dx*pd.ty+dy*pd.tx;
    if(Math.abs(al)<32 && Math.abs(ac)<26 && c.z<5){
      if(c.boost<0.3) beep(520,.15,'sawtooth',.08);
      c.boost=Math.max(c.boost, PAD_T);
    }
  }
  if(c.jump<=0) for(const rp of track.ramps){
    const dx=c.x-rp.x, dy=c.y-rp.y, al=dx*rp.tx+dy*rp.ty, ac=-dx*rp.ty+dy*rp.tx;
    const along = c.vx*rp.tx + c.vy*rp.ty;
    if(Math.abs(al)<20 && Math.abs(ac)<track.w/2 && along>120){
      c.jumpT = 0.45 + along/1000; c.jumpH = 14 + along*0.07; c.jump = c.jumpT;
      beep(300,.15,'square',.1); setTimeout(()=>beep(600,.2,'square',.08),80);
    }
  }
  if(track.th.lava && dist > track.w/2 + 40 && c.jump<=0) lavaRespawn(p);
}
function lavaRespawn(p){
  const c=p.car, P=track.pts[c.idx];
  for(let i=0;i<24;i++) particles.push({x:c.x,y:c.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.9,max:.9,c:i%2?'#ff6a00':'#ffd000',r:8});
  c.x=P.x; c.y=P.y; c.a=Math.atan2(P.ty,P.tx); c.vx=c.vy=0; c.fwd=c.lat=0;
  c.spin=0; c.boost=0; c.skid=null; c.shield=Math.max(c.shield,1.5);
  p.camYaw=c.a;
  showPop(p.pop,'🔥 Lava! Zurück auf die Strecke','bad',1600);
  beep(90,.5,'sawtooth',.2);
}

function updateRemote(p, dt){
  const n=p.net, c=p.car; if(!n) return;
  const age=Math.min(.25,(performance.now()-n.recv)/1000);
  const tx=n.x+n.vx*age, ty=n.y+n.vy*age;
  if(Math.hypot(tx-c.x,ty-c.y)>250){ c.x=tx; c.y=ty; c.a=n.a; }
  const k=1-Math.exp(-dt*15);
  c.x+=(tx-c.x)*k; c.y+=(ty-c.y)*k;
  let da=n.a-c.a; da=Math.atan2(Math.sin(da),Math.cos(da)); c.a+=da*k;
  c.vx=n.vx; c.vy=n.vy; c.steer=n.st||0;
  c.fwd = c.vx*Math.cos(c.a) + c.vy*Math.sin(c.a);
  const f=n.f||0;
  c.boost = f&1 ? 1 : 0; c.shield = f&2 ? 1 : 0; c.slow = f&4 ? 1 : 0; c.jump = n.z>0 ? 1 : 0;
  c.z += ((n.z||0) - c.z)*Math.min(1, dt*20);
}

function collideTrees(car){
  for(const t of (car.jump>0 ? [] : (track.obstCur || track.obst))){
    const dx=car.x-t.x, dy=car.y-t.y, R=t.cr, d2=dx*dx+dy*dy;
    if(d2 < R*R){
      const d=Math.sqrt(d2)||1, nx=dx/d, ny=dy/d;
      car.x=t.x+nx*R; car.y=t.y+ny*R;
      const vn=car.vx*nx+car.vy*ny;
      if(vn<0){
        car.vx-=1.4*vn*nx; car.vy-=1.4*vn*ny; car.vx*=.55; car.vy*=.55;
        if(-vn>90){ thud(); for(let i=0;i<12;i++) particles.push({x:car.x-nx*14,y:car.y-ny*14,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.6,max:.6,c:'#2e6b28',r:4}); }
      }
    }
  }
  if(car.x<20){car.x=20;car.vx=Math.abs(car.vx)*.3;} if(car.y<20){car.y=20;car.vy=Math.abs(car.vy)*.3;}
  if(car.x>track.W-20){car.x=track.W-20;car.vx=-Math.abs(car.vx)*.3;} if(car.y>track.H-20){car.y=track.H-20;car.vy=-Math.abs(car.vy)*.3;}
}

function collideCars(){
  const R=28, act=players.filter(p=>!p.left);
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++){
    const pa=act[i], pb=act[j];
    if(pa.remote && pb.remote) continue;
    const a = pb.remote ? pb.car : pa.car, b = pb.remote ? pa.car : pb.car;
    const onlyB = pa.remote || pb.remote;
    const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
    if(d2>=R*R || a.jump>0 || b.jump>0) continue;
    const d=Math.sqrt(d2)||1, nx=dx/d, ny=dy/d;
    const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    // Schild: Auto mit Schild wird nicht geschubst, das andere dafür doppelt
    let wa = 1, wb = 1;
    if(a.shield>0 && !(b.shield>0)){ wa=0; wb=2; } else if(b.shield>0 && !(a.shield>0)){ wa=2; wb=0; }
    if(onlyB){
      if(wb===0) continue;
      b.x+=nx*(R-d); b.y+=ny*(R-d);
      if(vn<0){ const jm=-(1+0.4)*vn/2*wb; b.vx+=jm*nx; b.vy+=jm*ny; }
    } else {
      const ov=(R-d)/2;
      a.x-=nx*ov*wa; a.y-=ny*ov*wa; b.x+=nx*ov*wb; b.y+=ny*ov*wb;
      if(vn<0){ const jm=-(1+0.4)*vn/2; a.vx-=jm*nx*wa; a.vy-=jm*ny*wa; b.vx+=jm*nx*wb; b.vy+=jm*ny*wb; }
    }
    if(vn<-100) beep(110,.15,'triangle',.25);
  }
}

function skidAndDust(c, inp){
  const sp=Math.hypot(c.vx,c.vy);
  const fx=Math.cos(c.a), fy=Math.sin(c.a), rx=-fy, ry=fx;
  const w1={x:c.x-fx*12+rx*10.5, y:c.y-fy*12+ry*10.5}, w2={x:c.x-fx*12-rx*10.5, y:c.y-fy*12-ry*10.5};
  const skidding = sp>50 && (Math.abs(c.lat)>85 || (inp.hand && sp>80) || (inp.down && c.fwd>160));
  if(skidding && c.skid){
    const d=Math.hypot(w1.x-c.skid[0].x, w1.y-c.skid[0].y);
    if(d>3){ addSkid(c.skid[0].x,c.skid[0].y,w1.x,w1.y,c.off); addSkid(c.skid[1].x,c.skid[1].y,w2.x,w2.y,c.off); c.skid=[w1,w2]; }
  } else c.skid = skidding ? [w1,w2] : null;
  if(skidding && !c.off && Math.random()<.12) particles.push({x:w1.x,y:w1.y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:.8,max:.8,c:'#dddddd',r:7});
  if(c.off && sp>60 && Math.random()<.35) particles.push({x:w1.x+(Math.random()-.5)*16,y:w1.y+(Math.random()-.5)*16,vx:-c.vx*.15+(Math.random()-.5)*40,vy:-c.vy*.15+(Math.random()-.5)*40,life:.8,max:.8,c:'#8a6a3a',r:6});
}

// ---------- Power-Ups ----------
function rollItem(){
  const others = players.filter(q=>!q.left).length > 1;
  const pool = ['turbo','turbo','shield','jump','oil'];
  if(others) pool.push('zap','zap','oil');
  return pool[Math.floor(Math.random()*pool.length)];
}
function puSound(){ beep(523,.08); setTimeout(()=>beep(659,.08),70); setTimeout(()=>beep(784,.12),140); }

function powerUps(p, dt){
  const c=p.car;
  const racing = state==='race' && !p.finished;
  // Würfel einsammeln
  if(racing && c.z<20){
    track.boxes.forEach((b,i)=>{
      if(boxTimers[i]>0) return;
      if((c.x-b.x)**2 + (c.y-b.y)**2 > 26*26) return;
      boxTimers[i]=BOX_RESPAWN;
      if(raceMode==='online') nsend({t:'box', i});
      for(let k=0;k<10;k++) particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:.5,max:.5,c:['#ff3cac','#ffb400','#2b86c5'][k%3],r:5});
      if(!p.item && !p.roll){ p.roll={ t:ROLL_T, final:rollItem(), last:0 }; beep(880,.08); }
      else beep(300,.06);
    });
  }
  // Glücksrad läuft ab -> Power-Up bekommen
  if(p.roll){
    p.roll.t -= dt;
    if(p.roll.t<=0){
      p.item=p.roll.final; p.roll=null; p.rollDone=true; puSound();
      showPop(p.pop, `${ITEMS[p.item].icon} ${ITEMS[p.item].name}!  [${p.input.itemKey}]`, 'good', 1600);
    }
  }
  // Item benutzen (nur beim Drücken, nicht beim Halten)
  const pressed = p.lastInput.item && !p.itemHeld;
  p.itemHeld = !!p.lastInput.item;
  if(racing && pressed && p.item) useItem(p);
  // Ölflecken
  if(c.jump<=0){
    for(const o of oils.slice()){
      if((c.x-o.x)**2 + (c.y-o.y)**2 > (o.r+8)**2) continue;
      if(o.owner===p && o.age<1.2) continue;
      removeOil(o);
      if(raceMode==='online') nsend({t:'oilrm', id:o.id});
      if(c.shield>0){ showPop(p.pop,'🛡️ Öl abgewehrt!','good',1400); beep(900,.1); }
      else { c.spin=SPIN_T; c.spinDir=Math.random()<.5?-1:1; showPop(p.pop,'🛢️ Ausgerutscht!','bad',1400); beep(180,.4,'sawtooth',.15); }
    }
  }
}

function useItem(p){
  const c=p.car, it=p.item; p.item=null;
  if(it==='turbo'){ c.boost=BOOST_T; beep(200,.5,'sawtooth',.12); setTimeout(()=>beep(400,.4,'sawtooth',.1),80); }
  else if(it==='shield'){ c.shield=SHIELD_T; beep(700,.25,'sine',.15); }
  else if(it==='jump'){ c.jumpT=JUMP_T; c.jumpH=30; c.jump=JUMP_T; beep(330,.12,'square',.12); setTimeout(()=>beep(660,.15,'square',.1),90); }
  else if(it==='oil'){
    const x=c.x-Math.cos(c.a)*34, y=c.y-Math.sin(c.a)*34, id=`${p.id}-${++oilSeq}`;
    addOil(x, y, p, id);
    if(raceMode==='online') nsend({t:'oil', id, x:Math.round(x), y:Math.round(y)});
    beep(120,.2,'triangle',.2);
  }
  else if(it==='zap'){
    beep(1400,.3,'sawtooth',.1);
    let hit=0;
    for(const o of players){
      if(o===p || o.left || o.finished) continue;
      if(o.remote){ nsend({t:'zap'}); hit++; continue; }
      if(o.car.shield>0) showPop(o.pop,'🛡️ Blitz abgewehrt!','good',1800);
      else { o.car.slow=SLOW_T; showPop(o.pop,'⚡ Du wurdest geblitzt!','bad',1800); }
      hit++;
    }
    showPop(p.pop, hit ? '⚡ Gegner geblitzt!' : '⚡ Niemand zum Blitzen…', hit?'good':'', 1400);
  }
}

function update(dt){
  if(state==='countdown'){ for(const p of viewers()) p.lastInput=p.input.read(); return; }
  for(const p of players){
    if(p.remote){ updateRemote(p, dt); continue; }
    const inp = (state==='race' && !p.finished) ? p.input.read() : BRAKE_INPUT;
    p.lastInput = inp;
    stepCar(p.car, inp, dt);
    collideTrees(p.car);
  }
  if(players.length>1) collideCars();
  if(state==='race') raceTime += dt;

  for(const p of players){
    if(p.remote) continue;
    const c=p.car, [idx, dist] = nearest(c.x, c.y, c.idx);
    c.idx = idx; c.off = dist > track.w/2 + 7;
    trackFeatures(p, dist);
    if(state==='race' && !p.finished){
      const d = (idx - cpIdx[p.nextCP] + track.n) % track.n;
      if(d < track.n/12){ const wasFinish = p.nextCP===0; p.nextCP=(p.nextCP+1)%NCP; if(wasFinish) lapDone(p); }
      while(raceTime >= p.ghostNext && !p.finished){ p.ghostRec.push(Math.round(c.x*10)/10, Math.round(c.y*10)/10, Math.round(c.a*1000)/1000); p.ghostNext+=GHOST_DT; }
    }
    skidAndDust(c, p.lastInput);
    if(racePU) powerUps(p, dt);
  }
  if(racePU){
    for(let i=0;i<boxTimers.length;i++) if(boxTimers[i]>0) boxTimers[i]=Math.max(0, boxTimers[i]-dt);
    for(const o of oils.slice()){ o.age+=dt; if(o.age>o.life) removeOil(o); }
  }

  for(const q of particles){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt; }
  if(particles.length>PMAX) particles.splice(0,particles.length-PMAX);
  particles = particles.filter(q=>q.life>0);

  if(state==='race' && dnfTimer!=null){ dnfTimer-=dt; if(dnfTimer<=0) endRace(); }
}

// ---------- Zeichnen (3D) ----------
function ghostPos(){
  if(!ghostOn || !ghostPlay || state==='menu') return null;
  const f=raceTime/GHOST_DT, i=Math.floor(f), k=i*3;
  if(k+5 >= ghostPlay.length) return null;
  const t=f-i, g=ghostPlay;
  let da=g[k+5]-g[k+2]; da=Math.atan2(Math.sin(da),Math.cos(da));
  return { x:g[k]+(g[k+3]-g[k])*t, y:g[k+1]+(g[k+4]-g[k+1])*t, a:g[k+2]+da*t, steer:0 };
}

function getViews(){
  if(viewers().length<2) return [{x:0,y:0,w:W,h:H}];
  return W>=H ? [{x:0,y:0,w:W/2,h:H},{x:W/2,y:0,w:W/2,h:H}] : [{x:0,y:0,w:W,h:H/2},{x:0,y:H/2,w:W,h:H/2}];
}

function syncCarMesh(p, dt){
  const m=p.mesh, c=p.car, u=m.userData;
  m.visible = !p.left;
  if(p.meshColor!==p.color){ u.paint.color.set(p.color); p.meshColor=p.color; }
  m.position.set(c.x, c.z||0, c.y);
  m.rotation.y = -c.a;
  if(u.flames){
    const fl = c.boost>0;
    for(const f of u.flames){ f.visible=fl; if(fl){ const s=0.8+Math.random()*0.6; f.scale.set(s,1,1); } }
    u.shield.visible = c.shield>0 && (c.shield>1.2 || Math.floor(c.shield*8)%2===0);
    u.zap.visible = c.slow>0;
  }
  for(const f of u.front) f.rotation.y = -(c.steer||0)*0.45;
  u.spin -= (c.fwd||0)*dt/5;
  for(const w of u.wheels) w.rotation.z = u.spin;
  const lat = p.remote ? 0 : (c.lat||0);
  u.chassis.rotation.x = Math.max(-.09, Math.min(.09, lat*0.0007));
  const tp = p.remote ? 0 : (p.lastInput.up ? .025 : 0) - (p.lastInput.down && c.fwd>50 ? .035 : 0);
  p.pitch += (tp - p.pitch)*Math.min(1, dt*6);
  u.chassis.rotation.z = p.pitch;
}

const CAM_PRESETS = [ {dist:78, h:30, look:45, lookH:10}, {dist:115, h:46, look:60, lookH:8}, {dist:150, h:130, look:40, lookH:0} ];
function updateCamera(p, v, dt){
  const c=p.car, cam=p.cam3, sp=Math.hypot(c.vx,c.vy);
  let da=c.a-p.camYaw; da=Math.atan2(Math.sin(da),Math.cos(da));
  p.camYaw += da*Math.min(1, dt*5);
  const P=CAM_PRESETS[camMode]||CAM_PRESETS[0];
  const fx=Math.cos(p.camYaw), fz=Math.sin(p.camYaw);
  const dist=P.dist + sp*0.03, h=P.h + sp*0.008;
  const camX=c.x - fx*dist, camZ=c.y - fz*dist;
  cam.position.set(camX, h, camZ);
  // Bäume zwischen Kamera und Auto merken (werden für diese Ansicht ausgeblendet)
  const hide=[], sx=c.x-camX, sz=c.y-camZ, L2=sx*sx+sz*sz||1;
  track.trees.forEach((t,i)=>{
    if(Math.abs(t.x-c.x) > dist+80 || Math.abs(t.y-c.y) > dist+80) return;
    const u=Math.max(0, Math.min(1, ((t.x-camX)*sx + (t.y-camZ)*sz)/L2));
    const qx=camX+sx*u, qz=camZ+sz*u;
    if((t.x-qx)**2 + (t.y-qz)**2 < (t.r*1.1+10)**2) hide.push(i);
  });
  p.hideTrees = hide;
  cam.lookAt(c.x + fx*P.look, P.lookH, c.y + fz*P.look);
  cam.aspect = v.w/v.h;
  cam.fov = 62 + Math.min(14, sp*0.02);
  cam.updateProjectionMatrix();
}

function render(dt){
  if(!track || state==='menu' || !R3){ drawMenuBackground(dt); return; }
  const gp=ghostPos();
  for(const p of players) syncCarMesh(p, dt);
  // Power-Up-Würfel drehen und nach dem Einsammeln wieder wachsen lassen
  if(R3.boxMeshes){
    const tt=performance.now()/1000;
    R3.boxMeshes.forEach((m,i)=>{
      const t=boxTimers[i]||0;
      m.visible = racePU && t<1;
      if(!m.visible) return;
      m.scale.setScalar(t>0 ? 1-t : 1);
      m.rotation.set(.45, tt*1.6+i, .3);
      m.position.y = 14 + Math.sin(tt*3+i)*2.5;
    });
  }
  const gm=R3.ghost;
  gm.visible=!!gp;
  if(gp){ gm.position.set(gp.x,0,gp.y); gm.rotation.y=-gp.a; }
  // Partikel
  const pos=R3.points.geometry.attributes.position, col=R3.points.geometry.attributes.color;
  const n=Math.min(particles.length, PMAX);
  for(let i=0;i<n;i++){
    const q=particles[i], cc=colorOf(q.c);
    pos.array[i*3]=q.x; pos.array[i*3+1]=3+(1-q.life/q.max)*14; pos.array[i*3+2]=q.y;
    col.array[i*3]=cc.r; col.array[i*3+1]=cc.g; col.array[i*3+2]=cc.b;
  }
  R3.points.geometry.setDrawRange(0,n); pos.needsUpdate=true; col.needsUpdate=true;

  const views=getViews(), rnd=R3.renderer;
  rnd.setScissorTest(true);
  viewers().forEach((p,i)=>{
    const v=views[i];
    updateCamera(p, v, dt);
    const c=p.car, sun=R3.sun;
    sun.position.set(c.x-260, 520, c.y-180); sun.target.position.set(c.x+40, 0, c.y+40); sun.target.updateMatrixWorld();
    setHiddenTrees(p.hideTrees);
    rnd.setViewport(v.x, H-v.y-v.h, v.w, v.h); rnd.setScissor(v.x, H-v.y-v.h, v.w, v.h);
    rnd.render(R3.scene, p.cam3);
  });
  rnd.setScissorTest(false);

  const dv=$('divider');
  if(views.length>1){
    dv.classList.remove('hidden');
    Object.assign(dv.style, W>=H ? {left:(W/2-2)+'px', top:'0', width:'4px', height:H+'px'} : {left:'0', top:(H/2-2)+'px', width:W+'px', height:'4px'});
  } else dv.classList.add('hidden');

  const mc=$('mini'), mg=mc.getContext('2d');
  mg.clearRect(0,0,mc.width,mc.height); mg.drawImage(miniCanvas,0,0);
  const s=miniCanvas.scale, pd=miniCanvas.pad;
  if(gp){ mg.fillStyle='#7fd4ff'; mg.beginPath(); mg.arc(gp.x*s+pd,gp.y*s+pd,4,0,7); mg.fill(); }
  for(const p of players){ if(p.left) continue; mg.fillStyle=p.color; mg.strokeStyle='#000'; mg.lineWidth=1.5; mg.beginPath(); mg.arc(p.car.x*s+pd,p.car.y*s+pd,5,0,7); mg.fill(); mg.stroke(); }
}

let menuT=0;
function drawMenuBackground(dt){
  menuT+=dt;
  const ctx=bctx;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#2f6e2b'; ctx.fillRect(0,0,W,H);
  const T=TRACKS[sel.track];
  if(!T._prev || T._prevSize!==Math.max(W,H)){ T._prev=drawPreview(T, Math.max(W,H)*.95, 0); T._prevSize=Math.max(W,H); }
  const c=T._prev; ctx.globalAlpha=.35;
  ctx.drawImage(c,(W-c.width)/2,(H-c.height)/2); ctx.globalAlpha=1;
  const s=c.scale, cols = sel.mode==='solo' ? [COLORS[sel.colors[0]]] : sel.mode==='local' ? [COLORS[sel.colors[0]],COLORS[sel.colors[1]]] : [COLORS[sel.colors[0]], oppColor(net.peer&&net.peer.color)];
  cols.forEach((col,j)=>{
    const i=((Math.floor(menuT*60 + j*40) % T.n) + T.n) % T.n, p=T.pts[i];
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc((W-c.width)/2+p.x*s,(H-c.height)/2+p.y*s,6,0,7); ctx.fill();
  });
}

function updateRoulette(p, v){
  const R=p.roul; if(!R) return;
  const vis = racePU && !!(p.roll || p.item);
  R.root.classList.toggle('hidden', !vis);
  if(!vis) return;
  // Position: oben rechts in der eigenen Ansicht (neben der Minikarte, falls die dort ist)
  const size = Math.round(Math.max(80, Math.min(120, v.w*0.22)));
  const mini=$('mini'), miniTopRight = mini.style.top==='12px' && v.y===0 && v.x+v.w>=W-1;
  const right = 12 + (miniTopRight ? mini.width + 10 : 0);
  Object.assign(R.root.style, { width:size+'px', height:size+'px', left:(v.x+v.w-right-size)+'px', top:(v.y+12)+'px' });
  R.ic.style.fontSize = Math.round(size*0.52)+'px';
  const setImg = ()=>{
    if(hotImgs.length){ R.img.src = hotImgs[Math.floor(Math.random()*hotImgs.length)].src; R.img.style.display=''; }
    else R.img.style.display='none';
  };
  if(p.roll){
    const now=performance.now(), prog=1-p.roll.t/ROLL_T, iv=50+prog*prog*280;
    if(now-p.roll.last > iv){
      p.roll.last=now; setImg();
      const pool=Object.keys(ITEMS).filter(k=>k!=='zap' || players.filter(q=>!q.left).length>1);
      R.ic.textContent = ITEMS[pool[Math.floor(Math.random()*pool.length)]].icon;
      R.nm.textContent = '? ? ?';
      beep(650+Math.random()*500, .03, 'square', .04);
    }
    R.root.classList.add('spin'); R.root.classList.remove('done');
  } else if(p.rollDone){
    p.rollDone=false;
    R.ic.textContent = ITEMS[p.item].icon;
    R.nm.textContent = `${ITEMS[p.item].name} [${p.input.itemKey}]`;
    R.root.classList.remove('spin','done'); void R.root.offsetWidth; R.root.classList.add('done');
  }
}

function updateHUD(){
  if(state==='menu' || !players.length) return;
  const views=getViews(), r=remotePlayer();
  viewers().forEach((p,i)=>{
    const v=views[i], h=p.hud;
    h.root.style.left=(v.x+12)+'px'; h.root.style.top=(v.y+12)+'px';
    p.pop.style.left=(v.x+v.w/2)+'px'; p.pop.style.top=(v.y+v.h*.62)+'px';
    h.lap.textContent = p.finished ? (players.length>1 ? `Im Ziel – Platz ${p.place}` : 'Im Ziel') : `Runde ${Math.min(p.laps.length+1, sel.laps)}/${sel.laps}`;
    h.total.textContent = fmt(p.finished ? p.finishTime : raceTime);
    h.cur.textContent = `Diese Runde: ${fmt(p.finished ? p.laps[p.laps.length-1] : raceTime-p.lapStart)}`;
    h.best.textContent = `Beste Runde: ${fmt(bestLap)}`;
    h.rec.textContent = `Rekord (${sel.laps} R.): ${fmt(recTotal)}`;
    h.spd.textContent = `${Math.round(Math.hypot(p.car.vx,p.car.vy)*.36)} km/h`;
    h.opp.textContent = !r ? '' : r.left ? 'Gegner: nicht mehr da' : r.finished ? `Gegner im Ziel: ${fmt(r.finishTime)}` : `Gegner: Runde ${Math.min(r.lapCount+1, sel.laps)}/${sel.laps}`;
    h.note.textContent = (!p.finished && dnfTimer!=null && state==='race') ? `⏱ Noch ${Math.ceil(dnfTimer)} s bis Rennende!` : '';
    const c=p.car, fx=[];
    if(c.boost>0) fx.push('🚀 Turbo'); if(c.shield>0) fx.push(`🛡️ Schild ${Math.ceil(c.shield)}s`);
    if(c.slow>0) fx.push('⚡ Verlangsamt'); if(c.spin>0) fx.push('🛢️ Schleudern!');
    h.fx.textContent = fx.join('  ');
    updateRoulette(p, v);
    const itemKey = racePU ? (p.item || '') : '';
    if(h.itemShown!==itemKey){
      h.itemShown=itemKey;
      h.item.innerHTML = p.item ? `${ITEMS[p.item].icon} ${ITEMS[p.item].name}<kbd>${p.input.itemKey}</kbd>` : (racePU ? '<span style="opacity:.5">🎁 –</span>' : '');
    }
  });
  const mini=$('mini');
  if(viewers().length>1 && W>=H){ mini.style.left='50%'; mini.style.right='auto'; mini.style.top='auto'; mini.style.bottom='12px'; mini.style.transform='translateX(-50%)'; }
  else { mini.style.left='auto'; mini.style.right='12px'; mini.style.top='12px'; mini.style.bottom='auto'; mini.style.transform='none'; }
}

// ---------- Hauptschleife ----------
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.max(0, Math.min(.05,(now-last)/1000)); last=now;
  try{ tick(dt); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
function tick(dt){
  if(state==='countdown'){
    cd-=dt; const c=Math.ceil(cd);
    if(c!==lastCd){ lastCd=c; if(c>0){ showMsg(String(c)); beep(440,.2); } }
    if(cd<=0){ state='race'; showMsg('LOS!',800); beep(880,.45); }
  }
  if(state==='finished'){ finishTimer-=dt; if(finishTimer<=0 && $('result').classList.contains('hidden')) $('result').classList.remove('hidden'); }
  if(state==='race'||state==='countdown'||state==='finished'){
    acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; }
    if(raceMode==='online'){
      sendTimer-=dt;
      if(sendTimer<=0){
        sendTimer=1/30;
        const me=viewers()[0], c=me.car, r1=v=>Math.round(v*10)/10;
        nsend({t:'s', x:r1(c.x), y:r1(c.y), a:Math.round(c.a*1000)/1000, vx:r1(c.vx), vy:r1(c.vy), st:Math.round(c.steer*100)/100, l:me.laps.length,
          z:r1(c.z||0), f:(c.boost>0?1:0)|(c.shield>0?2:0)|(c.slow>0?4:0)});
      }
    }
  } else acc=0;
  render(dt); updateHUD(); updateEngine();
}

// ---------- Menü ----------
function seg(el, opts, cur, onPick){
  el.innerHTML='';
  opts.forEach(([val,label])=>{ const b=document.createElement('button'); b.textContent=label; if(val===cur) b.className='sel'; b.onclick=()=>onPick(val); el.appendChild(b); });
}
function renderLobby(){
  const on = sel.mode==='online', sb=$('startBtn');
  $('lobby').classList.toggle('hidden', !on);
  if(!on){ sb.classList.remove('hidden'); sb.textContent="Los geht's! 🏁"; return; }
  const info=$('lobbyInfo'), join=$('lobbyJoin'), leave=$('leaveBtn');
  if(location.protocol==='file:'){
    join.classList.add('hidden'); leave.classList.add('hidden'); sb.classList.add('hidden');
    info.innerHTML='⚠️ Online geht nur über den Server: Starte im Ordner <kbd>node server.js</kbd> und öffne dann <b>http://localhost:8080</b> im Browser.';
    return;
  }
  join.classList.toggle('hidden', !!net.code);
  leave.classList.toggle('hidden', !net.code);
  sb.classList.toggle('hidden', !(net.role==='host' && net.peer));
  sb.textContent='Rennen starten 🏁';
  const esc = s => String(s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  if(!net.code){
    info.innerHTML = (net.err ? `<span class="err">${esc(net.err)}</span><br>` : '') +
      'Einer erstellt einen Raum und sagt dem anderen den Code. Der andere gibt den Code ein und tritt bei.';
  } else if(net.role==='host'){
    const urls = net.ips.map(ip=>`http://${ip}:${net.port}`);
    info.innerHTML = `Raum-Code: <span class="code">${esc(net.code)}</span><br>` + (net.peer
      ? '✅ Mitspieler ist verbunden! Wähle Strecke und Runden und starte das Rennen.'
      : `⏳ Warte auf Mitspieler… Auf dem anderen Gerät ${urls.length ? '<b>'+urls.map(esc).join('</b> oder <b>')+'</b>' : 'diese Seite'} öffnen, „Online“ wählen und den Code eingeben.`);
  } else {
    info.innerHTML = `✅ Verbunden mit Raum <span class="code">${esc(net.code)}</span><br>⏳ Warte, bis der Host das Rennen startet… (Strecke und Runden wählt der Host)`;
  }
}
function buildMenu(){
  seg($('modeSel'), [['solo','👤 1 Spieler'],['local','👥 2 Spieler (eine Tastatur)'],['online','🌐 Online (2 Geräte)']], sel.mode,
    v=>{ sel.mode=v; store.set('brumbrum.mode',v); buildMenu(); });
  const cards=$('cards'); cards.innerHTML='';
  TRACKS.forEach((T,i)=>{
    const d=document.createElement('div'); d.className='card'+(i===sel.track?' sel':'');
    d.appendChild(drawPreview(T,220,10));
    const info=document.createElement('div');
    info.innerHTML=`<b>${T.th.icon} ${T.name}</b><div>Länge: ${(T.len/280).toFixed(2)} km</div><div>Beste Runde${sel.pu?' 🎁':''}: ${fmt(store.get(kLap(T,sel.pu)))}</div><div>Rekord (${sel.laps} R.${sel.pu?', 🎁':''}): ${fmt(store.get(kTot(T,sel.laps,sel.pu)))}</div>`;
    d.appendChild(info);
    d.onclick=()=>{ sel.track=i; store.set('brumbrum.track',i); buildMenu(); };
    d.ondblclick=()=>menuStart();
    cards.appendChild(d);
  });
  seg($('lapsSel'), [[1,'1'],[3,'3'],[5,'5']], sel.laps, v=>{ sel.laps=v; store.set('brumbrum.laps',v); buildMenu(); });
  const rows=$('colorRows'); rows.innerHTML='';
  const nColors = sel.mode==='local' ? 2 : 1;
  for(let j=0;j<nColors;j++){
    const r=document.createElement('div'); r.className='colors';
    if(nColors>1){ const s=document.createElement('span'); s.textContent=`Spieler ${j+1}`; r.appendChild(s); }
    COLORS.forEach((col,i)=>{ const b=document.createElement('button'); b.style.background=col; if(i===sel.colors[j]) b.className='sel';
      b.onclick=()=>{ sel.colors[j]=i; store.set(j?'brumbrum.color2':'brumbrum.color',i); if(j===0) sendInfo(); buildMenu(); }; r.appendChild(b); });
    rows.appendChild(r);
  }
  $('ghostChk').checked=ghostOn;
  $('puChk').checked=sel.pu;
  $('puChk').disabled = sel.mode==='online' && net.role==='guest';
  const common = `<kbd>C</kbd> Kamera wechseln &nbsp; <kbd>R</kbd> Neustart &nbsp; <kbd>M</kbd> Ton &nbsp; <kbd>G</kbd> Geist an/aus &nbsp; <kbd>Esc</kbd> Menü`;
  const puHelp = `<br>🎁 Fahr durch die bunten <b>?-Würfel</b> für ein Power-Up: 🚀 Turbo · 🛡️ Schild · 🦘 Sprung (über Gras &amp; Hindernisse) · 🛢️ Ölfleck (lässt Gegner schleudern) · ⚡ Blitz (bremst Gegner)`;
  $('help').innerHTML = sel.mode==='local'
    ? `<b>Spieler 1:</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fahren &nbsp; <kbd>Leertaste</kbd> oder <kbd>Shift links</kbd> Handbremse &nbsp; <kbd>E</kbd> Power-Up<br>`+
      `<b>Spieler 2:</b> <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> fahren &nbsp; <kbd>Shift rechts</kbd>, <kbd>Strg rechts</kbd> oder <kbd>Num 0</kbd> Handbremse &nbsp; <kbd>Enter</kbd> Power-Up<br>`+
      `${common} &nbsp; <kbd>P</kbd> Pause<br>Wer zuerst ins Ziel kommt, gewinnt. Danach hat der andere noch ${DNF_TIME} Sekunden. Autos können sich rammen!` + (sel.pu?puHelp:'')
    : `<kbd>↑</kbd>/<kbd>W</kbd> Gas &nbsp; <kbd>↓</kbd>/<kbd>S</kbd> Bremse / Rückwärts &nbsp; <kbd>←</kbd><kbd>→</kbd>/<kbd>A</kbd><kbd>D</kbd> Lenken &nbsp; <kbd>Leertaste</kbd> Handbremse (Drift!) &nbsp; <kbd>E</kbd> Power-Up<br>`+
      (sel.mode==='online'
        ? `${common}<br>Beide Geräte müssen im selben WLAN sein. Wer zuerst ins Ziel kommt, gewinnt – danach hat der andere noch ${DNF_TIME} Sekunden.`
        : `${common} &nbsp; <kbd>P</kbd> Pause<br>Gras bremst, Bäume sind hart! Alle Checkpoints müssen durchfahren werden.`) + (sel.pu?puHelp:'');
  renderLobby();
}
$('ghostChk').onchange=e=>{ ghostOn=e.target.checked; store.set('brumbrum.ghost',ghostOn); };
$('puChk').onchange=e=>{ sel.pu=e.target.checked; store.set('brumbrum.pu',sel.pu); buildMenu(); };
$('startBtn').onclick=menuStart;
$('againBtn').onclick=restart;
$('menuBtn').onclick=showMenu;
$('createBtn').onclick=createRoom;
$('joinBtn').onclick=joinRoom;
$('leaveBtn').onclick=leaveRoomNet;

resize();
buildMenu();
requestAnimationFrame(frame);
