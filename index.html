    rec.className='rec no'; rec.textContent=`Rekord: ${fmt(recTotal)}` + (best && players.length===1 ? `  (+${(best.finishTime-recTotal).toFixed(3)} s)` : '');
  }
  if(players.length===1){
    const p=players[0], mn=Math.min(...p.laps);
    $('rTitle').textContent='🏁 Ziel!';
    $('rBody').innerHTML = `<div class="total">${fmt(p.finishTime)}</div><div class="laps">` +
      p.laps.map((l,i)=>`<div class="${l===mn&&p.laps.length>1?'best':''}">Runde ${i+1}: ${fmt(l)}</div>`).join('') + '</div>' +
      `<div class="laps" style="color:var(--hot);font-weight:800">🌀 Drift-Punkte: ${p.drift.total.toLocaleString('de-DE')} <span style="opacity:.75;font-weight:600">(bester Drift: ${p.drift.best.toLocaleString('de-DE')})</span></div>`;
  } else {
    const order = [...fin, ...players.filter(p=>!p.finished)];
    const w = order[0];
    $('rTitle').textContent = !w.finished ? '🏁 Rennen beendet' : raceMode==='online' ? (w.remote ? '😬 Gegner hat gewonnen!' : '🏆 Du hast gewonnen!') : `🏆 ${w.name} gewinnt!`;
    const medals=['🥇','🥈','🥉'];
    $('rBody').innerHTML = order.map((p,i)=>{
      const bl = p.laps.length ? Math.min(...p.laps) : null;
      const t = p.finished ? fmt(p.finishTime) : (p.left ? 'Verlassen' : 'DNF');
      const gap = p.finished && i>0 ? ` <small>+${(p.finishTime-order[0].finishTime).toFixed(3)} s</small>` : '';
      return `<div class="rank"><div class="medal">${p.finished?medals[i]:(p.left?'🚪':'❌')}</div><div class="who"><i style="background:${p.color}"></i>${p.name}</div>`+
        `<div class="t">${t}${gap}<small>Beste Runde: ${fmt(bl)}</small>${p.remote?'':`<small style="color:var(--hot)">🌀 Drift: ${p.drift.total.toLocaleString('de-DE')}</small>`}</div></div>`;
    }).join('');
  }
  const ab=$('againBtn');
  if(raceMode==='online' && net.role!=='host'){ ab.textContent='Warte auf Host…'; ab.disabled=true; }
  else { ab.textContent='Nochmal (R)'; ab.disabled=false; }
}

// ---------- Physik (2D von oben; die 3D-Ansicht stellt sie nur dar) ----------
function nearest(x,y,hint){
  const P=track.pts, n=track.n; let best=hint, bd=Infinity;
  for(let k=-60;k<=60;k++){ const i=(hint+k+n)%n, p=P[i], d=(p.x-x)**2+(p.y-y)**2; if(d<bd){ bd=d; best=i; } }
  if(bd > (track.w*2.5)**2){ for(let i=0;i<n;i++){ const p=P[i], d=(p.x-x)**2+(p.y-y)**2; if(d<bd){ bd=d; best=i; } } }
  return [best, Math.sqrt(bd)];
}

function stepCar(c, inp, dt){
  if(c.spin>0){ inp = { up:false, down:false, steer:0, hand:true }; c.a += 9*dt*c.spinDir; }
  // Nitro: solange gedrückt und Tank nicht leer (Tank füllt sich durch Driften)
  c.nos = !!(inp.nitro && c.nitro>0.02 && !(c.spin>0));
  if(c.nos) c.nitro = Math.max(0, c.nitro - dt*NOS_USE);
  if(c.boost>0 || c.nos) inp = { ...inp, up:true, down:false };
  c.steer += (inp.steer - c.steer) * Math.min(1, dt*10);
  const sp = Math.abs(c.fwd);
  const turn = 2.9 * Math.min(1, sp/140) * (1 - 0.4*Math.min(1, sp/650)) * (inp.hand ? 1.3 : 1);
  c.a += c.steer * turn * dt * (c.fwd < -1 ? -1 : 1);
  const fx=Math.cos(c.a), fy=Math.sin(c.a);
  let fwd = c.vx*fx + c.vy*fy, lat = -c.vx*fy + c.vy*fx;
  if(inp.up) fwd += 540*dt;
  if(inp.down){ if(fwd > 20) fwd -= 950*dt; else fwd = Math.max(fwd - 320*dt, -170); }
  const off = c.off && !(c.jump>0) && !(c.grip>0), TH = track.th;
  // Turbo: zusätzlicher Schub, aber nur bis zu einer Höchstgeschwindigkeit (Raketen-Turbo: mehr Schub, höher)
  if(c.boost>0 && fwd < (c.mega>0 ? MEGA_MAX : BOOST_MAX)) fwd += (c.mega>0 ? 560 : 380)*dt;
  if(c.nos && fwd < NOS_MAX) fwd += 470*dt;
  let drag = off ? TH.offDrag : 0.83;
  if(c.slow>0) drag += 1.3;
  if(c.spin>0) drag += 1.6;
  fwd -= fwd * drag * dt;
  if(!inp.up && !inp.down){ const r=Math.min(Math.abs(fwd), 70*dt); fwd -= Math.sign(fwd)*r; }
  if(inp.hand && !(c.spin>0)) fwd -= fwd*0.7*dt;
  const grip = c.jump>0 ? 6 : c.grip>0 ? (inp.hand ? 3 : 13) : inp.hand ? 1.5 : (off ? TH.offGrip : 9);
  lat *= Math.exp(-grip*dt);
  c.vx = fx*fwd - fy*lat; c.vy = fy*fwd + fx*lat;
  c.x += c.vx*dt; c.y += c.vy*dt;
  c.fwd=fwd; c.lat=lat;
  // Effekt-Timer
  c.boost=Math.max(0,c.boost-dt); c.shield=Math.max(0,c.shield-dt); c.slow=Math.max(0,c.slow-dt); c.spin=Math.max(0,c.spin-dt);
  c.jump=Math.max(0,c.jump-dt); c.mega=Math.max(0,c.mega-dt); c.grip=Math.max(0,c.grip-dt);
  c.z = c.jump>0 ? Math.sin(Math.PI*(1-c.jump/(c.jumpT||JUMP_T)))*(c.jumpH||30) : 0;
}

// Turbo-Felder, Sprungschanzen und Lava für ein lokales Auto
function trackFeatures(p, dist){
  const c=p.car;
  for(const pd of track.pads){
    const dx=c.x-pd.x, dy=c.y-pd.y, al=dx*pd.tx+dy*pd.ty, ac=-dx*pd.ty+dy*pd.tx;
    if(Math.abs(al)<32 && Math.abs(ac)<26 && c.z<5){
      if(c.boost<0.3) beep(520,.15,'sawtooth',.08);
      c.boost=Math.max(c.boost, PAD_T);
    }
  }
  if(c.jump<=0) for(const rp of track.ramps){
    const dx=c.x-rp.x, dy=c.y-rp.y, al=dx*rp.tx+dy*rp.ty, ac=-dx*rp.ty+dy*rp.tx;
    const along = c.vx*rp.tx + c.vy*rp.ty;
    if(Math.abs(al)<20 && Math.abs(ac)<track.w/2 && along>120){
      c.jumpT = 0.45 + along/1000; c.jumpH = 14 + along*0.07; c.jump = c.jumpT;
      beep(300,.15,'square',.1); setTimeout(()=>beep(600,.2,'square',.08),80);
    }
  }
  if(track.th.lava && dist > track.w/2 + 40 && c.jump<=0) lavaRespawn(p);
}
// Drift-Wertung: Punkte für Querfahren, Multiplikator für lange Drifts, Nitro-Tank füllt sich dabei.
// Ein Einschlag (Baum, Leitplanke) während des Drifts kostet die Punkte des laufenden Drifts.
function driftScore(p, dt){
  const c=p.car, d=p.drift, sp=Math.hypot(c.vx,c.vy), racing = state==='race' && !p.finished;
  if(racing) c.nitro = Math.min(1, c.nitro + dt*NOS_IDLE_FILL);
  if(c.hit && d.cur>0){ showPop(p.pop,'💥 Drift verloren!','bad',1100); d.cur=0; d.t=0; d.time=0; d.mult=1; }
  c.hit = 0;
  const drifting = racing && sp>170 && Math.abs(c.lat)>75 && !c.off && c.z<5 && !(c.spin>0);
  if(drifting){
    d.time += dt; d.t = 0.7;
    d.mult = 1 + Math.min(4, Math.floor(d.time/1.5));
    d.cur += dt*(Math.abs(c.lat)*1.2 + sp*0.35)*d.mult;
    c.nitro = Math.min(1, c.nitro + dt*NOS_DRIFT_FILL);
  } else if(d.cur>0){
    d.t -= dt;
    if(d.t<=0){
      const pts=Math.round(d.cur); d.total+=pts; d.best=Math.max(d.best,pts);
      showPop(p.pop, `DRIFT +${pts.toLocaleString('de-DE')}${d.mult>1?'  ×'+d.mult:''}`, 'good drift', 1300);
      beep(660,.08,'square',.07); setTimeout(()=>beep(990,.12,'square',.06),70);
      d.cur=0; d.time=0; d.mult=1;
    }
  }
}
// Leitplanke: Auto kann die Straße nicht verlassen, prallt ab und schrammt mit Funken entlang
function guardRail(c, idx, dist){
  const lim = track.w/2 + 12;
  if(dist <= lim) return;
  const P=track.pts[idx], nx=(c.x-P.x)/dist, ny=(c.y-P.y)/dist;
  c.x = P.x + nx*lim; c.y = P.y + ny*lim;
  const vn = c.vx*nx + c.vy*ny;
  if(vn > 0){
    c.vx -= 1.5*vn*nx; c.vy -= 1.5*vn*ny; c.vx *= .9; c.vy *= .9;
    if(vn > 90){ c.hit=1; thud(); for(let i=0;i<10;i++) particles.push({x:c.x+nx*10,y:c.y+ny*10,vx:(Math.random()-.5)*220+c.vx*.3,vy:(Math.random()-.5)*220+c.vy*.3,life:.35,max:.35,c:i%2?'#ffd34a':'#ff8a1a',r:3}); }
  }
  // beim Entlangschrammen bremsen
  c.vx *= .992; c.vy *= .992;
}
function lavaRespawn(p){
  const c=p.car, P=track.pts[c.idx];
  for(let i=0;i<24;i++) particles.push({x:c.x,y:c.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.9,max:.9,c:i%2?'#ff6a00':'#ffd000',r:8});
  c.x=P.x; c.y=P.y; c.a=Math.atan2(P.ty,P.tx); c.vx=c.vy=0; c.fwd=c.lat=0;
  c.spin=0; c.boost=0; c.mega=0; c.skid=null; c.shield=Math.max(c.shield,1.5);
  p.camYaw=c.a;
  showPop(p.pop,'🔥 Lava! Zurück auf die Strecke','bad',1600);
  beep(90,.5,'sawtooth',.2);
}

function updateRemote(p, dt){
  const n=p.net, c=p.car; if(!n) return;
  const age=Math.min(.25,(performance.now()-n.recv)/1000);
  const tx=n.x+n.vx*age, ty=n.y+n.vy*age;
  if(Math.hypot(tx-c.x,ty-c.y)>250){ c.x=tx; c.y=ty; c.a=n.a; }
  const k=1-Math.exp(-dt*15);
  c.x+=(tx-c.x)*k; c.y+=(ty-c.y)*k;
  let da=n.a-c.a; da=Math.atan2(Math.sin(da),Math.cos(da)); c.a+=da*k;
  c.vx=n.vx; c.vy=n.vy; c.steer=n.st||0;
  c.fwd = c.vx*Math.cos(c.a) + c.vy*Math.sin(c.a);
  const f=n.f||0;
  c.boost = f&1 ? 1 : 0; c.shield = f&2 ? 1 : 0; c.slow = f&4 ? 1 : 0; c.jump = n.z>0 ? 1 : 0;
  c.z += ((n.z||0) - c.z)*Math.min(1, dt*20);
}

function collideTrees(car){
  for(const t of (car.jump>0 ? [] : (track.obstCur || track.obst))){
    const dx=car.x-t.x, dy=car.y-t.y, R=t.cr, d2=dx*dx+dy*dy;
    if(d2 < R*R){
      const d=Math.sqrt(d2)||1, nx=dx/d, ny=dy/d;
      car.x=t.x+nx*R; car.y=t.y+ny*R;
      const vn=car.vx*nx+car.vy*ny;
      if(vn<0){
        car.vx-=1.4*vn*nx; car.vy-=1.4*vn*ny; car.vx*=.55; car.vy*=.55;
        if(-vn>90){ car.hit=1; thud(); for(let i=0;i<12;i++) particles.push({x:car.x-nx*14,y:car.y-ny*14,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.6,max:.6,c:'#2e6b28',r:4}); }
      }
    }
  }
  if(car.x<20){car.x=20;car.vx=Math.abs(car.vx)*.3;} if(car.y<20){car.y=20;car.vy=Math.abs(car.vy)*.3;}
  if(car.x>track.W-20){car.x=track.W-20;car.vx=-Math.abs(car.vx)*.3;} if(car.y>track.H-20){car.y=track.H-20;car.vy=-Math.abs(car.vy)*.3;}
}

function collideCars(){
  const R=28, act=players.filter(p=>!p.left);
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++){
    const pa=act[i], pb=act[j];
    if(pa.remote && pb.remote) continue;
    const a = pb.remote ? pb.car : pa.car, b = pb.remote ? pa.car : pb.car;
    const onlyB = pa.remote || pb.remote;
    const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
    if(d2>=R*R || a.jump>0 || b.jump>0) continue;
    const d=Math.sqrt(d2)||1, nx=dx/d, ny=dy/d;
    const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    // Schild: Auto mit Schild wird nicht geschubst, das andere dafür doppelt
    let wa = 1, wb = 1;
    if(a.shield>0 && !(b.shield>0)){ wa=0; wb=2; } else if(b.shield>0 && !(a.shield>0)){ wa=2; wb=0; }
    if(onlyB){
      if(wb===0) continue;
      b.x+=nx*(R-d); b.y+=ny*(R-d);
      if(vn<0){ const jm=-(1+0.4)*vn/2*wb; b.vx+=jm*nx; b.vy+=jm*ny; }
    } else {
      const ov=(R-d)/2;
      a.x-=nx*ov*wa; a.y-=ny*ov*wa; b.x+=nx*ov*wb; b.y+=ny*ov*wb;
      if(vn<0){ const jm=-(1+0.4)*vn/2; a.vx-=jm*nx*wa; a.vy-=jm*ny*wa; b.vx+=jm*nx*wb; b.vy+=jm*ny*wb; }
    }
    if(vn<-100) beep(110,.15,'triangle',.25);
  }
}

function skidAndDust(c, inp){
  const sp=Math.hypot(c.vx,c.vy);
  const fx=Math.cos(c.a), fy=Math.sin(c.a), rx=-fy, ry=fx;
  const w1={x:c.x-fx*12+rx*10.5, y:c.y-fy*12+ry*10.5}, w2={x:c.x-fx*12-rx*10.5, y:c.y-fy*12-ry*10.5};
  const skidding = sp>50 && (Math.abs(c.lat)>85 || (inp.hand && sp>80) || (inp.down && c.fwd>160));
  if(skidding && c.skid){
    const d=Math.hypot(w1.x-c.skid[0].x, w1.y-c.skid[0].y);
    if(d>3){ addSkid(c.skid[0].x,c.skid[0].y,w1.x,w1.y,c.off); addSkid(c.skid[1].x,c.skid[1].y,w2.x,w2.y,c.off); c.skid=[w1,w2]; }
  } else c.skid = skidding ? [w1,w2] : null;
  if(skidding && !c.off && Math.random()<.12) particles.push({x:w1.x,y:w1.y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:.8,max:.8,c:'#dddddd',r:7});
  if(c.off && sp>60 && Math.random()<.35) particles.push({x:w1.x+(Math.random()-.5)*16,y:w1.y+(Math.random()-.5)*16,vx:-c.vx*.15+(Math.random()-.5)*40,vy:-c.vy*.15+(Math.random()-.5)*40,life:.8,max:.8,c:'#8a6a3a',r:6});
}

// ---------- Power-Ups ----------
function rollItem(){
  const others = players.filter(q=>!q.left).length > 1;
  // Allein nur hilfreiche Items; Ölfleck, Blitz & Risiko nur mit Gegner
  const pool = ['turbo','turbo','turbo3','mega','shield','jump','grip','star'];
  if(others) pool.push('oil','oil','zap','zap','risk');
  return pool[Math.floor(Math.random()*pool.length)];
}
function puSound(){ beep(523,.08); setTimeout(()=>beep(659,.08),70); setTimeout(()=>beep(784,.12),140); }

function powerUps(p, dt){
  const c=p.car;
  const racing = state==='race' && !p.finished;
  // Würfel einsammeln
  if(racing && c.z<20){
    track.boxes.forEach((b,i)=>{
      if(boxTimers[i]>0) return;
      if((c.x-b.x)**2 + (c.y-b.y)**2 > 26*26) return;
      boxTimers[i]=BOX_RESPAWN;
      if(raceMode==='online') nsend({t:'box', i});
      for(let k=0;k<10;k++) particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:.5,max:.5,c:['#ff3cac','#ffb400','#2b86c5'][k%3],r:5});
      if(!p.item && !p.roll){ p.roll={ t:ROLL_T, final:rollItem(), last:0 }; beep(880,.08); }
      else beep(300,.06);
    });
  }
  // Glücksrad läuft ab -> Power-Up bekommen
  if(p.roll){
    p.roll.t -= dt;
    if(p.roll.t<=0){
      p.item=p.roll.final; p.itemN = p.item==='turbo3' ? TURBO3_N : 1; p.roll=null; p.rollDone=true; puSound();
      showPop(p.pop, `${itemLabel(p)}!  [${p.input.itemKey}]`, 'good', 1600);
    }
  }
  // Item benutzen (nur beim Drücken, nicht beim Halten)
  const pressed = p.lastInput.item && !p.itemHeld;
  p.itemHeld = !!p.lastInput.item;
  if(racing && pressed && p.item) useItem(p);
  // Ölflecken
  if(c.jump<=0){
    for(const o of oils.slice()){
      if((c.x-o.x)**2 + (c.y-o.y)**2 > (o.r+8)**2) continue;
      if(o.owner===p && o.age<1.2) continue;
      removeOil(o);
      if(raceMode==='online') nsend({t:'oilrm', id:o.id});
      if(c.shield>0){ showPop(p.pop,'🛡️ Öl abgewehrt!','good',1400); beep(900,.1); }
      else { c.spin=SPIN_T; c.spinDir=Math.random()<.5?-1:1; showPop(p.pop,'🛢️ Ausgerutscht!','bad',1400); beep(180,.4,'sawtooth',.15); }
    }
  }
}

function useItem(p){
  const c=p.car, it=p.item; p.item=null;
  if(it==='turbo' || it==='turbo3'){
    c.boost=Math.max(c.boost, BOOST_T); beep(200,.5,'sawtooth',.12); setTimeout(()=>beep(400,.4,'sawtooth',.1),80);
    if(it==='turbo3' && --p.itemN>0) p.item='turbo3';   // weitere Ladungen behalten
  }
  else if(it==='mega'){
    c.boost=Math.max(c.boost, MEGA_T); c.mega=MEGA_T;
    beep(150,.6,'sawtooth',.15); setTimeout(()=>beep(300,.5,'sawtooth',.12),80); setTimeout(()=>beep(600,.4,'sawtooth',.1),160);
  }
  else if(it==='grip'){ c.grip=GRIP_T; beep(440,.15,'square',.1); setTimeout(()=>beep(550,.15,'square',.08),90); }
  else if(it==='star'){
    c.shield=Math.max(c.shield, STAR_T); c.boost=Math.max(c.boost, STAR_T); c.grip=Math.max(c.grip, STAR_T);
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12,'square',.08), i*70));
  }
  else if(it==='risk'){
    if(Math.random()<.5){
      c.boost=Math.max(c.boost, MEGA_T); c.mega=MEGA_T; c.shield=Math.max(c.shield, MEGA_T);
      showPop(p.pop,'🎰 Jackpot! Raketen-Turbo + Schild','good',1800);
      [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12,'square',.08), i*70));
    } else {
      c.spin=SPIN_T; c.spinDir=Math.random()<.5?-1:1; c.slow=SLOW_T; c.boost=0; c.mega=0;
      showPop(p.pop,'🎰 Pech gehabt! Du schleuderst','bad',1800);
      beep(180,.4,'sawtooth',.15); setTimeout(()=>beep(120,.5,'sawtooth',.15),150);
    }
  }
  else if(it==='shield'){ c.shield=SHIELD_T; beep(700,.25,'sine',.15); }
  else if(it==='jump'){ c.jumpT=JUMP_T; c.jumpH=30; c.jump=JUMP_T; beep(330,.12,'square',.12); setTimeout(()=>beep(660,.15,'square',.1),90); }
  else if(it==='oil'){
    const x=c.x-Math.cos(c.a)*34, y=c.y-Math.sin(c.a)*34, id=`${p.id}-${++oilSeq}`;
    addOil(x, y, p, id);
    if(raceMode==='online') nsend({t:'oil', id, x:Math.round(x), y:Math.round(y)});
    beep(120,.2,'triangle',.2);
  }
  else if(it==='zap'){
    beep(1400,.3,'sawtooth',.1);
    let hit=0;
    for(const o of players){
      if(o===p || o.left || o.finished) continue;
      if(o.remote){ nsend({t:'zap'}); hit++; continue; }
      if(o.car.shield>0) showPop(o.pop,'🛡️ Blitz abgewehrt!','good',1800);
      else { o.car.slow=SLOW_T; showPop(o.pop,'⚡ Du wurdest geblitzt!','bad',1800); }
      hit++;
    }
    showPop(p.pop, hit ? '⚡ Gegner geblitzt!' : '⚡ Niemand zum Blitzen…', hit?'good':'', 1400);
  }
}

function update(dt){
  if(state==='countdown'){ for(const p of viewers()) p.lastInput=p.input.read(); return; }
  for(const p of players){
    if(p.remote){ updateRemote(p, dt); continue; }
    const inp = (state==='race' && !p.finished) ? p.input.read() : BRAKE_INPUT;
    p.lastInput = inp;
    stepCar(p.car, inp, dt);
    collideTrees(p.car);
  }
  if(players.length>1) collideCars();
  if(state==='race') raceTime += dt;

  for(const p of players){
    if(p.remote) continue;
    const c=p.car, [idx, dist] = nearest(c.x, c.y, c.idx);
    c.idx = idx; c.off = dist > track.w/2 + 7;
    if(track.th.rail) guardRail(c, idx, dist);
    trackFeatures(p, dist);
    if(state==='race' && !p.finished){
      const d = (idx - cpIdx[p.nextCP] + track.n) % track.n;
      if(d < track.n/12){ const wasFinish = p.nextCP===0; p.nextCP=(p.nextCP+1)%NCP; if(wasFinish) lapDone(p); }
      while(raceTime >= p.ghostNext && !p.finished){ p.ghostRec.push(Math.round(c.x*10)/10, Math.round(c.y*10)/10, Math.round(c.a*1000)/1000); p.ghostNext+=GHOST_DT; }
    }
    skidAndDust(c, p.lastInput);
    driftScore(p, dt);
    if(racePU) powerUps(p, dt);
  }
  if(racePU){
    for(let i=0;i<boxTimers.length;i++) if(boxTimers[i]>0) boxTimers[i]=Math.max(0, boxTimers[i]-dt);
    for(const o of oils.slice()){ o.age+=dt; if(o.age>o.life) removeOil(o); }
  }

  for(const q of particles){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt; }
  if(particles.length>PMAX) particles.splice(0,particles.length-PMAX);
  particles = particles.filter(q=>q.life>0);

  if(state==='race' && dnfTimer!=null){ dnfTimer-=dt; if(dnfTimer<=0) endRace(); }
}

// ---------- Zeichnen (3D) ----------
function ghostPos(){
  if(!ghostOn || !ghostPlay || state==='menu') return null;
  const f=raceTime/GHOST_DT, i=Math.floor(f), k=i*3;
  if(k+5 >= ghostPlay.length) return null;
  const t=f-i, g=ghostPlay;
  let da=g[k+5]-g[k+2]; da=Math.atan2(Math.sin(da),Math.cos(da));
  return { x:g[k]+(g[k+3]-g[k])*t, y:g[k+1]+(g[k+4]-g[k+1])*t, a:g[k+2]+da*t, steer:0 };
}

function getViews(){
  if(viewers().length<2) return [{x:0,y:0,w:W,h:H}];
  return W>=H ? [{x:0,y:0,w:W/2,h:H},{x:W/2,y:0,w:W/2,h:H}] : [{x:0,y:0,w:W,h:H/2},{x:0,y:H/2,w:W,h:H/2}];
}

function syncCarMesh(p, dt){
  const m=p.mesh, c=p.car, u=m.userData;
  m.visible = !p.left;
  if(p.meshColor!==p.color){ u.paint.color.set(p.color); if(u.glow) u.glow.material.color.set(p.color); p.meshColor=p.color; }
  m.position.set(c.x, c.z||0, c.y);
  m.rotation.y = -c.a;
  if(u.flames){
    const fl = c.boost>0 || c.nos;
    u.flames[0].material.color.setHex(c.nos ? 0x3fa8ff : 0xff9a1f);   // Nitro brennt blau
    for(const f of u.flames){ f.visible=fl; if(fl){ const s=(c.nos?1.3:0.8)+Math.random()*0.6; f.scale.set(s,1,1); } }
    u.shield.visible = c.shield>0 && (c.shield>1.2 || Math.floor(c.shield*8)%2===0);
    u.zap.visible = c.slow>0;
  }
  for(const f of u.front) f.rotation.y = -(c.steer||0)*0.45;
  u.spin -= (c.fwd||0)*dt/5;
  for(const w of u.wheels) w.rotation.z = u.spin;
  const lat = p.remote ? 0 : (c.lat||0);
  u.chassis.rotation.x = Math.max(-.09, Math.min(.09, lat*0.0007));
  const tp = p.remote ? 0 : (p.lastInput.up ? .025 : 0) - (p.lastInput.down && c.fwd>50 ? .035 : 0);
  p.pitch += (tp - p.pitch)*Math.min(1, dt*6);
  u.chassis.rotation.z = p.pitch;
}

const CAM_PRESETS = [ {dist:78, h:30, look:45, lookH:10}, {dist:115, h:46, look:60, lookH:8}, {dist:150, h:130, look:40, lookH:0} ];
function updateCamera(p, v, dt){
  const c=p.car, cam=p.cam3, sp=Math.hypot(c.vx,c.vy);
  let da=c.a-p.camYaw; da=Math.atan2(Math.sin(da),Math.cos(da));
  p.camYaw += da*Math.min(1, dt*5);
  const P=CAM_PRESETS[camMode]||CAM_PRESETS[0];
  const fx=Math.cos(p.camYaw), fz=Math.sin(p.camYaw);
  const dist=P.dist + sp*0.03, h=P.h + sp*0.008;
  const camX=c.x - fx*dist, camZ=c.y - fz*dist;
  cam.position.set(camX, h, camZ);
  // Bäume zwischen Kamera und Auto merken (werden für diese Ansicht ausgeblendet)
  const hide=[], sx=c.x-camX, sz=c.y-camZ, L2=sx*sx+sz*sz||1;
  track.trees.forEach((t,i)=>{
    if(Math.abs(t.x-c.x) > dist+80 || Math.abs(t.y-c.y) > dist+80) return;
    const u=Math.max(0, Math.min(1, ((t.x-camX)*sx + (t.y-camZ)*sz)/L2));
    const qx=camX+sx*u, qz=camZ+sz*u;
    if((t.x-qx)**2 + (t.y-qz)**2 < (t.r*1.1+10)**2) hide.push(i);
  });
  p.hideTrees = hide;
  cam.lookAt(c.x + fx*P.look, P.lookH, c.y + fz*P.look);
  cam.aspect = v.w/v.h;
  // Weitwinkel-Kick bei Nitro/Turbo, leichtes Wackeln bei hohem Tempo
  p.fovKick += (((c.nos||c.boost>0) ? 12 : 0) - p.fovKick)*Math.min(1, dt*4);
  cam.fov = 62 + Math.min(14, sp*0.02) + p.fovKick;
  if(sp>700){ const k=(sp-700)*0.0009 + (c.nos?0.35:0); cam.position.x += (Math.random()-.5)*k; cam.position.y += (Math.random()-.5)*k; }
  cam.updateProjectionMatrix();
}

function render(dt){
  if(!track || state==='menu' || !R3){ drawMenuBackground(dt); return; }
  const gp=ghostPos();
  for(const p of players) syncCarMesh(p, dt);
  updateScreen(dt);
  // Power-Up-Würfel drehen und nach dem Einsammeln wieder wachsen lassen
  if(R3.boxMeshes){
    const tt=performance.now()/1000;
    R3.boxMeshes.forEach((m,i)=>{
      const t=boxTimers[i]||0;
      m.visible = racePU && t<1;
      if(!m.visible) return;
      m.scale.setScalar(t>0 ? 1-t : 1);
      m.rotation.set(.45, tt*1.6+i, .3);
      m.position.y = 14 + Math.sin(tt*3+i)*2.5;
    });
  }
  const gm=R3.ghost;
  gm.visible=!!gp;
  if(gp){ gm.position.set(gp.x,0,gp.y); gm.rotation.y=-gp.a; }
  // Partikel
  const pos=R3.points.geometry.attributes.position, col=R3.points.geometry.attributes.color;
  const n=Math.min(particles.length, PMAX);
  for(let i=0;i<n;i++){
    const q=particles[i], cc=colorOf(q.c);
    pos.array[i*3]=q.x; pos.array[i*3+1]=3+(1-q.life/q.max)*14; pos.array[i*3+2]=q.y;
    col.array[i*3]=cc.r; col.array[i*3+1]=cc.g; col.array[i*3+2]=cc.b;
  }
  R3.points.geometry.setDrawRange(0,n); pos.needsUpdate=true; col.needsUpdate=true;

  const views=getViews(), rnd=R3.renderer;
  rnd.setScissorTest(true);
  viewers().forEach((p,i)=>{
    const v=views[i];
    updateCamera(p, v, dt);
    const c=p.car, sun=R3.sun;
    sun.position.set(c.x-260, 520, c.y-180); sun.target.position.set(c.x+40, 0, c.y+40); sun.target.updateMatrixWorld();
    setHiddenTrees(p.hideTrees);
    rnd.setViewport(v.x, H-v.y-v.h, v.w, v.h); rnd.setScissor(v.x, H-v.y-v.h, v.w, v.h);
    rnd.render(R3.scene, p.cam3);
  });
  rnd.setScissorTest(false);
  drawSpeedFx(views);

  const dv=$('divider');
  if(views.length>1){
    dv.classList.remove('hidden');
    Object.assign(dv.style, W>=H ? {left:(W/2-2)+'px', top:'0', width:'4px', height:H+'px'} : {left:'0', top:(H/2-2)+'px', width:W+'px', height:'4px'});
  } else dv.classList.add('hidden');

  const mc=$('mini'), mg=mc.getContext('2d');
  mg.clearRect(0,0,mc.width,mc.height); mg.drawImage(miniCanvas,0,0);
  const s=miniCanvas.scale, pd=miniCanvas.pad;
  if(gp){ mg.fillStyle='#7fd4ff'; mg.beginPath(); mg.arc(gp.x*s+pd,gp.y*s+pd,4,0,7); mg.fill(); }
  for(const p of players){ if(p.left) continue; mg.fillStyle=p.color; mg.strokeStyle='#000'; mg.lineWidth=1.5; mg.beginPath(); mg.arc(p.car.x*s+pd,p.car.y*s+pd,5,0,7); mg.fill(); mg.stroke(); }
}

let menuT=0;
function drawMenuBackground(dt){
  menuT+=dt;
  const ctx=bctx;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bgG=ctx.createLinearGradient(0,0,0,H); bgG.addColorStop(0,'#0b0820'); bgG.addColorStop(1,'#1a0624');
  ctx.fillStyle=bgG; ctx.fillRect(0,0,W,H);
  const T=TRACKS[sel.track];
  if(!T._prev || T._prevSize!==Math.max(W,H)){ T._prev=drawPreview(T, Math.max(W,H)*.95, 0); T._prevSize=Math.max(W,H); }
  const c=T._prev; ctx.globalAlpha=.35;
  ctx.drawImage(c,(W-c.width)/2,(H-c.height)/2); ctx.globalAlpha=1;
  const s=c.scale, cols = sel.mode==='solo' ? [COLORS[sel.colors[0]]] : sel.mode==='local' ? [COLORS[sel.colors[0]],COLORS[sel.colors[1]]] : [COLORS[sel.colors[0]], oppColor(net.peer&&net.peer.color)];
  cols.forEach((col,j)=>{
    const i=((Math.floor(menuT*60 + j*40) % T.n) + T.n) % T.n, p=T.pts[i];
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc((W-c.width)/2+p.x*s,(H-c.height)/2+p.y*s,6,0,7); ctx.fill();
  });
}

function updateRoulette(p, v){
  const R=p.roul; if(!R) return;
  const vis = racePU && !!(p.roll || p.item);
  R.root.classList.toggle('hidden', !vis);
  if(!vis) return;
  // Position: oben rechts in der eigenen Ansicht (neben der Minikarte, falls die dort ist)
  const size = Math.round(Math.max(80, Math.min(120, v.w*0.22)));
  const mini=$('mini'), miniTopRight = mini.style.top==='12px' && v.y===0 && v.x+v.w>=W-1;
  const right = 12 + (miniTopRight ? mini.width + 10 : 0);
  Object.assign(R.root.style, { width:size+'px', height:size+'px', left:(v.x+v.w-right-size)+'px', top:(v.y+12)+'px' });
  R.ic.style.fontSize = Math.round(size*0.52)+'px';
  const setImg = ()=>{
    if(hotImgs.length){ R.img.src = hotImgs[Math.floor(Math.random()*hotImgs.length)].src; R.img.style.display=''; }
    else R.img.style.display='none';
  };
  if(p.roll){
    const now=performance.now(), prog=1-p.roll.t/ROLL_T, iv=50+prog*prog*280;
    if(now-p.roll.last > iv){
      p.roll.last=now; setImg();
      const pool=Object.keys(ITEMS).filter(k=>!ITEMS[k].multi || players.filter(q=>!q.left).length>1);
      R.ic.textContent = ITEMS[pool[Math.floor(Math.random()*pool.length)]].icon;
      R.nm.textContent = '? ? ?';
      beep(650+Math.random()*500, .03, 'square', .04);
    }
    R.root.classList.add('spin'); R.root.classList.remove('done');
  } else if(p.rollDone){
    p.rollDone=false;
    R.ic.textContent = ITEMS[p.item].icon;
    R.nm.textContent = `${itemLabel(p).replace(/^\S+\s/,'')} [${p.input.itemKey}]`;
    R.root.classList.remove('spin','done'); void R.root.offsetWidth; R.root.classList.add('done');
  }
}

// Gang/Drehzahl aus dem Tempo (6 Gänge), Tacho unten rechts in der eigenen Ansicht
function updateTacho(p, v){
  const T=p.tacho; if(!T) return;
  const c=p.car, sp=Math.hypot(c.vx,c.vy), GS=175;
  let gear, rpm;
  if((c.fwd||0) < -5){ gear='R'; rpm=Math.min(1, sp/170); }
  else { const g=Math.min(6, Math.floor(sp/GS)+1); gear=String(g); rpm=Math.min(1, (sp-(g-1)*GS)/GS); if(p.lastInput.up) rpm=Math.max(rpm,.12); }
  const deg=Math.round(rpm*270), red = rpm>.88;
  T.ring.style.background = `conic-gradient(from 225deg, #00e5ff 0deg, #8a5bff ${Math.round(deg*.6)}deg, ${red?'#ff2b4a':'#ff2bd6'} ${deg}deg, rgba(255,255,255,.12) ${deg}deg 270deg, transparent 270deg 360deg)`;
  T.gear.textContent = gear; T.gear.classList.toggle('red', red);
  T.kmh.textContent = Math.round(sp*.36);
  T.nos.style.width = Math.round(c.nitro*100)+'%';
  T.root.classList.toggle('nosOn', !!c.nos); T.root.classList.toggle('full', c.nitro>=.999);
  const size=150, bottomGap = isTouch ? 200 : 64;
  T.root.style.left=(v.x+v.w-size-18)+'px'; T.root.style.top=(v.y+v.h-size-bottomGap)+'px';
  const d=p.drift;
  T.live.textContent = d.cur>0 ? `DRIFT ${Math.round(d.cur).toLocaleString('de-DE')}${d.mult>1?'  ×'+d.mult:''}` : '';
  T.live.style.left=(v.x+v.w/2)+'px'; T.live.style.top=(v.y+v.h*.18)+'px';
}
// Geschwindigkeits-Striche am Bildrand (stärker bei Nitro)
function drawSpeedFx(views){
  const cv=$('sfx'), g=cv.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H);
  viewers().forEach((p,i)=>{
    const v=views[i], c=p.car, sp=Math.hypot(c.vx,c.vy);
    const k=Math.min(1.3, Math.max(0,(sp-620)/450) + (c.nos?.55:0) + (c.boost>0?.3:0));
    if(k<=0.02 || state==='paused') return;
    g.save(); g.beginPath(); g.rect(v.x,v.y,v.w,v.h); g.clip();
    const cx=v.x+v.w/2, cy=v.y+v.h*.46, R=Math.hypot(v.w,v.h)/2;
    g.strokeStyle = c.nos ? `rgba(120,230,255,${.35*k})` : `rgba(255,255,255,${.22*k})`; g.lineWidth=2;
    g.beginPath();
    for(let n=0;n<Math.round(46*k);n++){
      const a=Math.random()*Math.PI*2, r1=R*(.42+Math.random()*.4), r2=r1+R*(.08+Math.random()*.22)*k;
      g.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); g.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2);
    }
    g.stroke(); g.restore();
  });
}
function updateHUD(){
  if(state==='menu' || !players.length) return;
  const views=getViews(), r=remotePlayer();
  viewers().forEach((p,i)=>{
    const v=views[i], h=p.hud;
    h.root.style.left=(v.x+12)+'px'; h.root.style.top=(v.y+12)+'px';
    p.pop.style.left=(v.x+v.w/2)+'px'; p.pop.style.top=(v.y+v.h*.62)+'px';
    h.lap.textContent = p.finished ? (players.length>1 ? `Im Ziel – Platz ${p.place}` : 'Im Ziel') : `Runde ${Math.min(p.laps.length+1, sel.laps)}/${sel.laps}`;
    h.total.textContent = fmt(p.finished ? p.finishTime : raceTime);
    h.cur.textContent = `Diese Runde: ${fmt(p.finished ? p.laps[p.laps.length-1] : raceTime-p.lapStart)}`;
    h.best.textContent = `Beste Runde: ${fmt(bestLap)}`;
    h.rec.textContent = `Rekord (${sel.laps} R.): ${fmt(recTotal)}`;
    h.spd.textContent = `🌀 Drift: ${p.drift.total.toLocaleString('de-DE')}`;
    updateTacho(p, v);
    h.opp.textContent = !r ? '' : r.left ? 'Gegner: nicht mehr da' : r.finished ? `Gegner im Ziel: ${fmt(r.finishTime)}` : `Gegner: Runde ${Math.min(r.lapCount+1, sel.laps)}/${sel.laps}`;
    h.note.textContent = (!p.finished && dnfTimer!=null && state==='race') ? `⏱ Noch ${Math.ceil(dnfTimer)} s bis Rennende!` : '';
    const c=p.car, fx=[];
    if(c.boost>0) fx.push(c.mega>0 ? '🔥 Raketen-Turbo' : '🚀 Turbo'); if(c.grip>0) fx.push(`🛞 Haftreifen ${Math.ceil(c.grip)}s`); if(c.shield>0) fx.push(`🛡️ Schild ${Math.ceil(c.shield)}s`);
    if(c.slow>0) fx.push('⚡ Verlangsamt'); if(c.spin>0) fx.push('🛢️ Schleudern!');
    h.fx.textContent = fx.join('  ');
    updateRoulette(p, v);
    const itemKey = racePU ? (p.item ? p.item+p.itemN : '') : '';
    if(h.itemShown!==itemKey){
      h.itemShown=itemKey;
      h.item.innerHTML = p.item ? `${itemLabel(p)}<kbd>${p.input.itemKey}</kbd>` : (racePU ? '<span style="opacity:.5">🎁 –</span>' : '');
    }
  });
  const mini=$('mini');
  if(viewers().length>1 && W>=H){ mini.style.left='50%'; mini.style.right='auto'; mini.style.top='auto'; mini.style.bottom='12px'; mini.style.transform='translateX(-50%)'; }
  else { mini.style.left='auto'; mini.style.right='12px'; mini.style.top='12px'; mini.style.bottom='auto'; mini.style.transform='none'; }
}

// ---------- ASCII-Intros (alles aus Zeichen gezeichnet, Neon-Look) ----------
// Eine Szene ist eine Funktion (u, v, t, i, j) -> Zelle; u/v: Bildkoordinaten (Mitte = 0, kurze Seite = 1).
// Sie schreibt in OUT: b = Helligkeit 0..1, p = Farbpalette (0 Cyan, 1 Pink, 2 Grau/Chrom, 3 Dunkelblau, 4 Weiß).
const ASCII_RAMP = ' .:-=+*#%@';
const ASCII_PAL = [['#05323f','#6ff8ff'], ['#40063a','#ff5ad6'], ['#1c1c24','#d8dce6'], ['#070b24','#3a5aa8'], ['#404050','#ffffff']];
const hexLerp = (a,b,k)=>{ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  const ch=s=>Math.round(((A>>s)&255)+((((B>>s)&255)-((A>>s)&255))*k)); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };
const ASCII_COLS = ASCII_PAL.map(([a,b])=>Array.from({length:8},(_,k)=>hexLerp(a,b,k/7)));
const OUT = { b:0, p:0, ch:null };
const hash2 = (i,j)=>{ const s=Math.sin(i*127.1+j*311.7)*43758.5453; return s-Math.floor(s); };
let asciiRun = null;   // laufendes Intro { scene, t, dur, fadeIn, onDone, skippable }

function startAscii(scene, dur, opt={}){
  const cv=$('ascii'); cv.classList.remove('hidden');
  asciiRun = { scene, t:0, dur, onDone:opt.onDone||null, skippable:opt.skippable!==false, fadeOut:opt.fadeOut??0.6, bg:opt.bg??1, ending:false };
  $('asciiHint').classList.toggle('hidden', !opt.hint);
  if(opt.hint) $('asciiHint').textContent = opt.hint;
}
function skipAscii(){ if(asciiRun && asciiRun.skippable && !asciiRun.ending){ asciiRun.ending=true; asciiRun.endT=0; } }
function endAscii(){
  const r=asciiRun; asciiRun=null;
  $('ascii').classList.add('hidden'); $('asciiHint').classList.add('hidden'); $('ascii').style.opacity='';
  if(r && r.onDone) r.onDone();
}
function drawAscii(dt){
  const r=asciiRun; if(!r) return;
  r.t += dt;
  if(!r.ending && r.t >= r.dur){ r.ending=true; r.endT=0; }
  if(r.ending){ r.endT += dt; if(r.endT >= r.fadeOut){ endAscii(); return; } }
  const cv=$('ascii'), g=cv.getContext('2d');
  if(cv.width!==Math.round(W*DPR) || cv.height!==Math.round(H*DPR)){ cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
  g.setTransform(DPR,0,0,DPR,0,0);
  const cw=Math.max(7, Math.round(W/170)), chh=Math.round(cw*1.65), cols=Math.ceil(W/cw), rows=Math.ceil(H/chh), M=Math.min(W,H);
  const bga = typeof r.bg==='function' ? r.bg(r.t) : r.bg;
  g.clearRect(0,0,W,H);
  if(bga>0){ g.fillStyle=`rgba(4,4,12,${bga})`; g.fillRect(0,0,W,H); }
  g.font=`700 ${chh-1}px Consolas,"Courier New",monospace`; g.textBaseline='top';
  const buckets = ASCII_COLS.map(p=>p.map(()=>[]));
  for(let j=0;j<rows;j++){
    const v=((j+.5)*chh - H/2)/M;
    for(let i=0;i<cols;i++){
      const u=((i+.5)*cw - W/2)/M;
      OUT.b=0; OUT.p=0; OUT.ch=null;
      r.scene(u, v, r.t, i, j, cols, rows);
      if(OUT.b<0.06) continue;
      const b=Math.min(1,OUT.b), ch = OUT.ch || ASCII_RAMP[Math.min(9, 1+Math.floor(b*8.99))];
      buckets[OUT.p][Math.min(7,Math.floor(b*8))].push(i*cw, j*chh, ch);
    }
  }
  buckets.forEach((pal,pi)=>pal.forEach((list,k)=>{
    if(!list.length) return; g.fillStyle=ASCII_COLS[pi][k];
    for(let q=0;q<list.length;q+=3) g.fillText(list[q+2], list[q], list[q+1]);
  }));
  cv.style.opacity = r.ending ? String(Math.max(0, 1 - r.endT/r.fadeOut)) : '1';
}

// Text als Maske im Zeichenraster (für Logo und Streckennamen)
function textMask(text, cols, rows, opt={}){
  const c=document.createElement('canvas'); c.width=cols; c.height=rows; const g=c.getContext('2d');
  const size = opt.size || rows*0.3, lines = text.split('\n');
  g.font=`italic 900 ${size}px system-ui,"Segoe UI",sans-serif`; g.textAlign='center'; g.textBaseline='middle';
  const tw = Math.max(...lines.map(l=>g.measureText(l).width)), k = Math.min(1, cols*0.9/Math.max(1,tw*1.65));
  g.font=`italic 900 ${size*k}px system-ui,"Segoe UI",sans-serif`;
  // Zeichenzellen sind ca. 1,65x so hoch wie breit -> Text horizontal strecken
  g.setTransform(1.65,0,0,1, cols/2*(1-1.65), 0);
  g.fillStyle='#fff';
  const lh = size*k*0.92, y0 = rows*(opt.y ?? 0.5) - (lines.length-1)*lh/2;
  lines.forEach((l,n)=>g.fillText(l, cols/2, y0 + n*lh));
  const d=g.getImageData(0,0,cols,rows).data, m=new Float32Array(cols*rows);
  for(let q=0;q<m.length;q++) m[q]=d[q*4+3]/255;
  return { m, cols, rows };
}

// Szene 1 (beim Öffnen der Seite): Felge dreht hoch -> Zoom in die Nabe -> Warp-Sterne -> Logo
function pageIntroScene(){
  let logo=null;
  return (u, v, t, i, j, cols, rows)=>{
    if(!logo || logo.cols!==cols || logo.rows!==rows) logo = textMask('BRUM\nBRUM', cols, rows, { size: rows*0.3, y:0.42 });
    const r0=Math.hypot(u,v), a=Math.atan2(v,u);
    const zoom = t<3 ? 1 + 0.04*Math.sin(t*3) : Math.exp((t-3)*2.4);
    const r = r0/zoom, rot = t*t*1.4;
    // Warp-Sterne (sichtbar in der Nabe und nach dem Zoom überall)
    const warp = () => {
      const bins=120, ab=Math.floor((a+Math.PI)/(Math.PI*2)*bins), h=hash2(ab, 7), h2=hash2(ab, 13);
      const pos=((h + t*(0.35+h2*0.5)) % 1), rr=0.05 + pos*pos*0.9;
      if(hash2(ab,3) < .55 && Math.abs(r0-rr) < 0.006+pos*0.03){ OUT.b=0.35+pos*0.65; OUT.p = h2<.5 ? 0 : 1; OUT.ch = pos>.6 ? '=' : '-'; return true; }
      const s=hash2(i,j); if(s>0.992){ OUT.b=0.3+0.7*Math.abs(Math.sin(t*4+s*50)); OUT.p=4; OUT.ch = s>.997 ? '+' : '.'; return true; }
      return false;
    };
    // Logo-Phase
    if(t>5.0){
      const L=logo.m[j*cols+i];
      if(L>0.4){
        const reveal = (t-5.0)/0.9, hsh=hash2(i*3,j*7);
        if(hsh < reveal){
          OUT.p = (i/cols + Math.sin(t*2+j*.2)*.05) < .5 ? 0 : 1;
          OUT.b = 0.65 + 0.35*Math.sin(t*6 + i*.4 + j*.3)*0.5 + 0.2*L;
          OUT.ch = '01#@%&$'[Math.floor(hash2(i, j+Math.floor(t*8))*7)];
          return;
        }
      }
      // Unterzeile: kleine Linie aus Zeichen unter dem Logo
      if(t>5.8 && Math.abs(j - rows*0.74) < .5 && Math.abs(i-cols/2) < Math.min(cols*0.3, (t-5.8)*cols*0.4)){ OUT.b=.8; OUT.p=1; OUT.ch='━'; return; }
      // Katakana-Unterzeile ブルン・ブルン (echte Zeichen, eins pro Zelle mit Abstand)
      const kt='ブ ル ン ・ ブ ル ン', kj=Math.round(rows*0.79), ki=Math.round(cols/2 - kt.length);
      if(t>6.2 && j===kj && i>=ki && i<ki+kt.length*2 && (i-ki)%2===0){ const ch=kt[(i-ki)/2]; if(ch!==' ' && (i-ki)/2 < (t-6.2)*14){ OUT.b=.95; OUT.p=1; OUT.ch=ch; return; } }
      warp(); OUT.b *= 0.7; return;
    }
    if(t>3.9 || r<0.045){ if(!warp() && t<=3.9){ OUT.b=0; } return; }
    // Felge (Reifen, Felgenhorn, 5 Speichen, Bremsscheibe, pinker Bremssattel)
    if(r>0.44){ const s=hash2(i,j); if(s>.985){ OUT.b=.25; OUT.p=3; OUT.ch='.'; } return; }
    if(r>0.31){ const tread = Math.sin((a+rot)*36) > .55; OUT.b = tread ? .42 : .22; OUT.p=2; OUT.ch = tread ? '#' : ':'; if(r>0.425) { OUT.b=.5; OUT.ch='='; } return; }
    if(r>0.285){ OUT.b=.95; OUT.p=4; OUT.ch='@'; return; }
    const spoke = Math.cos(5*(a-rot));
    if(r>0.07 && spoke>0.80){ OUT.b=.55+.45*(spoke-.8)/.2; OUT.p=0; OUT.ch = spoke>.95 ? '#' : '*'; return; }
    if(r>0.13 && r<0.23 && ((a+Math.PI*2-2.2)%(Math.PI*2)) < 0.7){ OUT.b=.85; OUT.p=1; OUT.ch='%'; return; }   // Bremssattel
    if(r>0.1 && r<0.24){ const hole = Math.sin((a-rot*0.98)*22)>.7 && Math.sin(r*120)>0; OUT.b = hole ? .12 : .3; OUT.p=2; OUT.ch = hole ? '.' : '-'; return; }
    if(r<0.07){ OUT.b=.8; OUT.p=4; OUT.ch='O'; return; }
    OUT.b=.12; OUT.p=3;
  };
}

// Szene 2 (Rennstart): Strecke zeichnet sich, Lichtpunkt fährt sie ab, Name tippt sich ein, dann Zerfall
function raceIntroScene(T){
  let grid=null, name=null, sub=null;
  const build = (cols, rows) => {
    // Strecke ins Zeichenraster legen (untere 60 % des Bildes), Zelle merkt sich den Streckenanteil
    const cw=Math.max(7, Math.round(W/170)), chh=Math.round(cw*1.65);
    const areaW=cols*0.7, areaH=rows*0.55, s=Math.min(areaW/T.W, areaH*chh/cw/T.H);
    const ox=(cols-T.W*s)/2, oy=rows*0.38 + (areaH - T.H*s*cw/chh)/2;
    const m=new Float32Array(cols*rows).fill(-1);
    for(let k=0;k<T.n;k++){
      const p=T.pts[k], ci=Math.round(ox+p.x*s), cj=Math.round(oy+p.y*s*cw/chh);
      if(ci>=0&&cj>=0&&ci<cols&&cj<rows && m[cj*cols+ci]<0) m[cj*cols+ci]=k/T.n;
    }
    grid={ m, cols, rows };
    name = textMask(T.name.toUpperCase(), cols, rows, { size: rows*0.16, y:0.2 });
    sub = `${T.th.icon||''} ${sel.laps} RUNDE${sel.laps>1?'N':''} · ${isNight(T.th)?'NACHT':'TAG'} · ${(T.len/280).toFixed(1)} KM`;
  };
  return (u, v, t, i, j, cols, rows)=>{
    if(!grid || grid.cols!==cols || grid.rows!==rows) build(cols, rows);
    // Zerfall ab 1,9 s: zufällige Zellen verschwinden
    if(t>1.9 && hash2(i*5,j*3) < (t-1.9)/1.1) return;
    const idx=j*cols+i, f=grid.m[idx], draw=Math.min(1, t/1.5);
    if(f>=0 && f<=draw){
      const head = Math.abs(f-draw) < 0.02 || (t>1.5 && Math.abs(f-((t*0.6)%1))<0.015);
      OUT.b = head ? 1 : 0.55+0.25*Math.sin(f*40+t*6); OUT.p = head ? 4 : (f<.5?0:1); OUT.ch = head ? '@' : '#'; return;
    }
    const L=name.m[idx];
    if(L>0.4 && hash2(i,j) < t/0.8){ OUT.b=.75+.25*L; OUT.p = i/cols<.5 ? 0 : 1; OUT.ch='01#%&@'[Math.floor(hash2(i,j+Math.floor(t*10))*6)]; return; }
    // Unterzeile als echter Text, Buchstabe für Buchstabe
    const sj=Math.round(rows*0.33), si=Math.round(cols/2 - sub.length/2);
    if(j===sj && i>=si && i<si+sub.length && (i-si) < t*40){ const ch=sub[i-si]; if(ch!==' '){ OUT.b=.9; OUT.p=4; OUT.ch=ch; } return; }
    if(hash2(i,j)>.994){ OUT.b=.3; OUT.p=3; OUT.ch='.'; }
  };
}
function playPageIntro(){

}

}

// ---------- Hauptschleife ----------
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.max(0, Math.min(.05,(now-last)/1000)); last=now;
  try{ tick(dt); }catch(err){ console.error(err); }
  try{ drawAscii(dt); }catch(err){ console.error(err); endAscii(); }
  requestAnimationFrame(frame);
}
$('ascii').addEventListener('pointerdown', skipAscii);
playPageIntro();
function tick(dt){
  if(state==='countdown'){
    cd-=dt; const c=Math.ceil(cd);
    if(c!==lastCd){ lastCd=c; if(c>0 && c<=3){ showMsg(String(c)); beep(440,.2); } }
    if(cd<=0){ state='race'; showMsg('LOS!',800); beep(880,.45); }
  }
  if(state==='finished'){ finishTimer-=dt; if(finishTimer<=0 && $('result').classList.contains('hidden')) $('result').classList.remove('hidden'); }
  if(state==='race'||state==='countdown'||state==='finished'){
    acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; }
    if(raceMode==='online'){
      sendTimer-=dt;
      if(sendTimer<=0){
        sendTimer=1/30;
        const me=viewers()[0], c=me.car, r1=v=>Math.round(v*10)/10;
        nsend({t:'s', x:r1(c.x), y:r1(c.y), a:Math.round(c.a*1000)/1000, vx:r1(c.vx), vy:r1(c.vy), st:Math.round(c.steer*100)/100, l:me.laps.length,
          z:r1(c.z||0), f:(c.boost>0||c.nos?1:0)|(c.shield>0?2:0)|(c.slow>0?4:0)});
      }
    }
  } else acc=0;
  render(dt); updateHUD(); updateEngine();
}

      `<b>Spieler 2:</b> <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> fahren &nbsp; <kbd>Shift rechts</kbd> oder <kbd>Num 0</kbd> Handbremse &nbsp; <kbd>Strg rechts</kbd> / <kbd>-</kbd> Nitro &nbsp; <kbd>Enter</kbd> Power-Up<br>`+
      `${common} &nbsp; <kbd>P</kbd> Pause<br>Wer zuerst ins Ziel kommt, gewinnt. Danach hat der andere noch ${DNF_TIME} Sekunden. Autos können sich rammen!` + (sel.pu?puHelp:'')
    : `<kbd>↑</kbd>/<kbd>W</kbd> Gas &nbsp; <kbd>↓</kbd>/<kbd>S</kbd> Bremse / Rückwärts &nbsp; <kbd>←</kbd><kbd>→</kbd>/<kbd>A</kbd><kbd>D</kbd> Lenken &nbsp; <kbd>Leertaste</kbd> Handbremse (Drift!) &nbsp; <kbd>Q</kbd> Nitro &nbsp; <kbd>E</kbd> Power-Up<br>`+
      `🌀 Driften gibt Punkte und füllt den Nitro-Tank – aber nicht dabei einschlagen!<br>`+
      (sel.mode==='online'
        ? `${common}<br>Beide Geräte müssen im selben WLAN sein. Wer zuerst ins Ziel kommt, gewinnt – danach hat der andere noch ${DNF_TIME} Sekunden.`
        : `${common} &nbsp; <kbd>P</kbd> Pause<br>Gras bremst, Bäume sind hart! Alle Checkpoints müssen durchfahren werden.`) + (sel.pu?puHelp:'');
  renderLobby();
}
$('ghostChk').onchange=e=>{ ghostOn=e.target.checked; store.set('brumbrum.ghost',ghostOn); };
$('nightChk').onchange=e=>{ nightOn=e.target.checked; store.set('brumbrum.night',nightOn); };
$('puChk').onchange=e=>{ sel.pu=e.target.checked; store.set('brumbrum.pu',sel.pu); buildMenu(); };
$('startBtn').onclick=menuStart;
$('againBtn').onclick=restart;
$('menuBtn').onclick=showMenu;
$('createBtn').onclick=createRoom;
$('joinBtn').onclick=joinRoom;
$('leaveBtn').onclick=leaveRoomNet;

resize();
buildMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
