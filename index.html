<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brum Brum</title>
<style>
  :root{--accent:#00e5ff;--hot:#ff2bd6;--panel:rgba(10,10,22,.9);}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#07070f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#game,canvas#bg,canvas#sfx{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  canvas#sfx{pointer-events:none}
  canvas#ascii{display:block;position:fixed;inset:0;width:100vw;height:100vh;z-index:50;cursor:pointer}
  #asciiHint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:51;font:700 13px Consolas,monospace;letter-spacing:2px;color:#00e5ff;opacity:.75;pointer-events:none;animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #divider{position:fixed;background:#111;pointer-events:none}
  .hidden{display:none!important}

  .hud{position:fixed;background:linear-gradient(135deg,rgba(8,8,20,.78),rgba(40,0,55,.55));border-left:4px solid var(--accent);box-shadow:0 0 18px rgba(0,229,255,.18);padding:10px 14px;border-radius:4px 14px 4px 14px;font-style:italic;font-variant-numeric:tabular-nums;line-height:1.35;min-width:190px;pointer-events:none}
  .hud .pname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
  .hud .pname i{display:inline-block;width:12px;height:12px;border-radius:3px}
  .hud .big{font-size:30px;font-weight:800;letter-spacing:.5px}
  .hud .lap{font-size:18px;font-weight:700;color:var(--accent)}
  .hud .small{font-size:13px;opacity:.85}
  .hud .spd{font-size:16px;font-weight:800;margin-top:2px;color:var(--hot);text-shadow:0 0 8px rgba(255,43,214,.7)}
  .hud .big{text-shadow:0 0 10px rgba(0,229,255,.55)}
  .tacho{position:fixed;width:150px;height:150px;pointer-events:none;font-style:italic}
  .tacho .face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(10,10,24,.85) 55%,rgba(10,10,24,.55) 70%,transparent 72%);box-shadow:0 0 24px rgba(0,229,255,.15)}
  .tacho .ring{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 58%,#000 59%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 58%,#000 59%,#000 70%,transparent 71%);filter:drop-shadow(0 0 6px rgba(0,229,255,.8))}
  .tacho .gear{position:absolute;top:30px;width:100%;text-align:center;font-size:22px;font-weight:900;color:var(--hot);text-shadow:0 0 10px var(--hot)}
  .tacho .gear.red{color:#ff2b4a;text-shadow:0 0 12px #ff2b4a}
  .tacho .kmh{position:absolute;top:54px;width:100%;text-align:center;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 0 12px var(--accent)}
  .tacho .unit{position:absolute;top:98px;width:100%;text-align:center;font-size:11px;font-weight:800;letter-spacing:3px;opacity:.7}
  .tacho .nos{position:absolute;left:8px;right:8px;bottom:-22px;height:12px;background:rgba(0,0,0,.6);border:1px solid rgba(0,229,255,.6);overflow:hidden;transform:skewX(-20deg)}
  .tacho .nos i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0057ff,#00e5ff);box-shadow:0 0 10px #00e5ff}
  .tacho.full .nos i{background:linear-gradient(90deg,#00e5ff,#b8fbff)}
  .tacho.nosOn .nos{border-color:#fff;box-shadow:0 0 14px #00e5ff}
  .tacho.nosOn .nos i{background:linear-gradient(90deg,#00e5ff,#fff)}
  .tacho .nosl{position:absolute;bottom:-42px;width:100%;text-align:center;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--accent);text-shadow:0 0 8px var(--accent)}
  .driftlive{position:fixed;transform:translateX(-50%) skewX(-10deg);font-size:30px;font-weight:900;font-style:italic;color:var(--hot);text-shadow:0 0 16px rgba(255,43,214,.9),0 3px 0 #000;pointer-events:none;white-space:nowrap;letter-spacing:1px}
  .pop.drift{color:var(--hot);text-shadow:0 0 12px rgba(255,43,214,.8);font-style:italic}
  .hud .opp{font-size:14px;font-weight:700;color:#9fd8ff}
  .hud .note{font-size:14px;font-weight:700;color:#ff8a7a}
  .hud .item{margin-top:6px;font-size:17px;font-weight:800;background:rgba(255,255,255,.12);border-radius:10px;padding:5px 10px;display:inline-block}
  .hud .item:empty{display:none}
  .hud .item kbd{font-size:12px;margin-left:6px;vertical-align:middle}
  .hud .fx{font-size:13px;font-weight:700;color:#ffe14a}
  .roul{position:fixed;width:120px;height:120px;border-radius:16px;overflow:hidden;border:4px solid var(--accent);background:linear-gradient(135deg,#ff3cac,#ffb400,#2b86c5);box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
  .roul img{width:100%;height:100%;object-fit:contain;display:block;background:#111}
  .roul .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:62px;opacity:.45;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .roul .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);text-align:center;font-weight:800;font-size:13px;padding:3px 0}
  .roul.spin{border-color:#fff}
  .roul.done{animation:roulPop .4s ease-out}
  @keyframes roulPop{0%{transform:scale(1.4)}60%{transform:scale(.92)}100%{transform:scale(1)}}
  #mini{position:fixed;top:12px;border-radius:12px;background:rgba(0,0,0,.4);pointer-events:none}
  #msg{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) skewX(-12deg);font-size:min(22vw,140px);font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 18px var(--accent),0 0 42px var(--hot),0 6px 0 rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;letter-spacing:4px}
  .pop{position:fixed;transform:translateX(-50%) skewX(-8deg);font-size:22px;font-weight:900;font-style:italic;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.65),rgba(0,0,0,.2));padding:8px 22px;border-radius:2px;pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pop.good{color:#6dff8a}.pop.bad{color:#ff8a7a}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,rgba(80,0,90,.35),rgba(0,0,0,.6));padding:16px;overflow:auto}
  .panel{background:var(--panel);border:1px solid rgba(0,229,255,.25);border-radius:6px 22px 6px 22px;padding:22px 24px;max-width:800px;width:100%;box-shadow:0 0 40px rgba(0,229,255,.12),0 0 80px rgba(255,43,214,.1),0 20px 60px rgba(0,0,0,.6);margin:auto;backdrop-filter:blur(6px)}
  h1{margin:0 0 4px;font-size:50px;font-weight:900;letter-spacing:3px;font-style:italic;text-shadow:0 0 14px rgba(255,255,255,.35)}
  h1 span{color:var(--accent);text-shadow:0 0 16px var(--accent)}
  h1 .jp{font-size:22px;font-style:normal;font-weight:900;letter-spacing:5px;color:#ff4fa8;text-shadow:0 0 12px rgba(255,79,168,.8);vertical-align:middle;white-space:nowrap;font-family:"Yu Gothic","Meiryo","Hiragino Sans","Noto Sans JP",sans-serif}
  h2{margin:0 0 10px;font-size:34px;font-style:italic;color:var(--accent);text-shadow:0 0 14px var(--accent)}
  h3{margin:16px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;opacity:.7}
  .sub{margin:0;opacity:.8}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .card{background:#14141f;border:2px solid transparent;border-radius:4px 14px 4px 14px;padding:10px;cursor:pointer;transition:.15s}
  .card:hover{background:#1c1c2c;border-color:rgba(255,43,214,.5)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 16px rgba(0,229,255,.45)}
  .card canvas{width:100%;height:auto;display:block;border-radius:3px 10px 3px 10px;background:radial-gradient(ellipse at center,#1d1838,#0b0a18)}
  .card b{display:block;margin-top:6px;font-size:17px}
  .card div{font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:30px;flex-wrap:wrap}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button,.colors button{border:2px solid transparent;background:#14141f;color:#fff;font-weight:800;font-style:italic;font-size:16px;border-radius:3px;padding:8px 14px;cursor:pointer;transform:skewX(-8deg)}
  .seg button.sel{border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,.45)}
  .colors{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .colors span{font-size:13px;opacity:.75;width:74px}
  .colors button{width:34px;height:34px;padding:0}
  .colors button.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .colors + .colors{margin-top:8px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:16px;cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--accent)}
  .btn{display:inline-block;border:0;border-radius:3px;padding:14px 30px;font-size:20px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:1px;cursor:pointer;background:linear-gradient(90deg,#00e5ff,#ff2bd6);color:#08080f;margin-top:18px;margin-right:8px;transform:skewX(-10deg);box-shadow:0 0 20px rgba(0,229,255,.45),0 0 30px rgba(255,43,214,.3)}
  .btn:hover{filter:brightness(1.15)}
  .btn.alt{background:#1c1c2c;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .btn.small{padding:10px 18px;font-size:16px;margin-top:0}
  .btn:disabled{opacity:.5;cursor:default}
  .help{margin-top:16px;font-size:13px;opacity:.7;line-height:1.7}
  .warn{margin-top:14px;color:#ff8a7a;font-weight:700}
  kbd{background:#333b49;border-radius:4px;padding:1px 6px;font-family:inherit;font-size:12px}
  .lobby{margin-top:16px;background:#1b2029;border:2px solid #333b49;border-radius:14px;padding:14px}
  .lobby .join{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .lobby input{font-size:20px;font-weight:800;letter-spacing:4px;text-transform:uppercase;width:120px;padding:9px 12px;border-radius:10px;border:2px solid #333b49;background:#0f1218;color:#fff;user-select:text;-webkit-user-select:text}
  .lobby input:focus{outline:none;border-color:var(--accent)}
  .lobby .info{line-height:1.6;font-size:15px}
  .lobby .code{font-size:30px;font-weight:900;letter-spacing:6px;color:var(--accent);vertical-align:middle}
  .lobby .err{color:#ff8a7a;font-weight:700}
  .total{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
  .laps{margin:10px 0;font-variant-numeric:tabular-nums;font-size:17px}
  .laps div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .laps .best{color:#6dff8a;font-weight:700}
  .rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
  .rank .medal{font-size:30px;width:40px;text-align:center}
  .rank .who{flex:1;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
  .rank .who i{display:inline-block;width:14px;height:14px;border-radius:4px}
  .rank .t{text-align:right;font-size:20px;font-weight:800}
  .rank .t small{display:block;font-size:12.5px;font-weight:600;opacity:.75}
  .rec{font-size:22px;font-weight:800;color:#6dff8a;margin-top:10px}
  .rec.no{color:#ddd;font-size:16px;font-weight:600}

  #touch{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none}
  #touch button{position:fixed;bottom:18px;width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:28px;font-weight:900;pointer-events:auto;touch-action:none}
  #touch button.on{background:rgba(255,204,0,.5)}
  #tL{left:16px}#tR{left:104px}#tB{right:104px}#tG{right:16px;background:rgba(80,200,90,.3)!important}
  #touch #tI{right:60px;bottom:106px;width:64px;height:64px;font-size:26px;background:rgba(255,204,0,.3)}
  #touch #tN{left:60px;bottom:106px;width:64px;height:64px;font-size:24px;background:rgba(0,229,255,.35)}
  @media (max-width:600px){.hud{min-width:0;padding:8px 10px}.hud .big{font-size:22px}h1{font-size:34px}}
</style>
<script src="three.min.js"></script>

<body>
<canvas id="bg"></canvas>
<canvas id="game" class="hidden"></canvas>
<canvas id="sfx" class="hidden"></canvas>
<canvas id="ascii" class="hidden"></canvas>
<div id="asciiHint" class="hidden"></div>
<div id="divider" class="hidden"></div>

<div id="huds"></div>
<canvas id="mini" class="hidden"></canvas>
<div id="msg"></div>
<div id="pop" class="pop hidden" style="left:50%;top:56%"></div>

<div id="touch" class="hidden">
  <button id="tL">◀</button><button id="tR">▶</button>
  <button id="tB">■</button><button id="tG">▲</button><button id="tI">★</button><button id="tN">N</button>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>BRUM <span>BRUM</span> <small class="jp">ブルン・ブルン</small></h1>
    <p class="sub">Japan-Straßenrennen 🏮 Zeitfahren allein, Duell an einer Tastatur oder online von zwei Geräten.</p>
    <h3>Modus</h3>
    <div class="seg" id="modeSel"></div>
    <div id="lobby" class="lobby hidden">
      <div class="join" id="lobbyJoin">
        <button class="btn small" id="createBtn">Raum erstellen</button>
        <span style="opacity:.7">oder Code eingeben:</span>
        <input id="codeIn" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false">
        <button class="btn small alt" id="joinBtn">Beitreten</button>
      </div>
      <div class="info" id="lobbyInfo"></div>
      <button class="btn small alt hidden" id="leaveBtn" style="margin-top:10px">Raum verlassen</button>
    </div>
    <h3>Strecke</h3>
    <div class="cards" id="cards"></div>
    <div class="row">
      <div><h3>Runden</h3><div class="seg" id="lapsSel"></div></div>
      <div><h3>Autofarbe</h3><div id="colorRows"></div></div>
    </div>
    <label class="chk"><input type="checkbox" id="puChk" checked> 🎁 Power-Up-Würfel auf der Strecke <span style="opacity:.6;font-size:13px">(eigene Rekorde)</span></label>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="ghostChk" checked> Geist-Auto der Rekordfahrt anzeigen</label>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="nightChk" checked> 🌙 Nachtrennen (Neon, Scheinwerfer, Straßenlaternen-Feeling)</label>
    <div class="warn hidden" id="err3d">⚠️ 3D konnte nicht gestartet werden (WebGL nicht verfügbar).</div>
    <button class="btn" id="startBtn">Los geht's! 🏁</button>
    <div class="help" id="help"></div>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="panel" style="max-width:500px">
    <h2 id="rTitle">🏁 Ziel!</h2>
    <div id="rBody"></div>
    <div class="rec" id="rRec"></div>
    <button class="btn" id="againBtn">Nochmal (R)</button>
    <button class="btn alt" id="menuBtn">Menü</button>
  </div>
</div>

<script>
"use strict";
// ---------- Grundsetup ----------
const cvs = document.getElementById('game');
const bgc = document.getElementById('bg'), bctx = bgc.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  bgc.width = W*DPR; bgc.height = H*DPR;
  const sf=document.getElementById('sfx'); sf.width = W*DPR; sf.height = H*DPR;
  if(R3) { R3.renderer.setPixelRatio(DPR); R3.renderer.setSize(W, H, false); }
}
addEventListener('resize', resize);
const $ = id => document.getElementById(id);

const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function fmt(t){ if(t == null) return '–'; const m = Math.floor(t/60), s = t - m*60; return m + ':' + s.toFixed(3).padStart(6,'0'); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- Strecken ----------
// Welten: Farben, Himmel, Hindernisse und Fahrverhalten neben der Strecke
const THEMES = {
  grass:  { icon:'🌳', sky:'#9fd3f5', fog:[900,2800], hemi:[0xe6f4ff,0x4a7a3a,2.2], sun:[0xfff4e0,2.6], outer:0x3d8a38,
            ground:'#3f8f3a', noise:['#3a8535','#48993f'], runoff:'#bfae78', road:'#4b4c52', obst:'pine', obstK:.65, rScale:1, offDrag:2.5, offGrip:4.5 },
  snow:   { icon:'❄️', sky:'#cfe3f2', fogColor:'#dfe9f2', fog:[600,2300], hemi:[0xffffff,0xb0c4d8,2.4], sun:[0xffffff,2.0], outer:0xe6edf4,
            ground:'#e8eef5', noise:['#d8e2ee','#f6f9fc'], runoff:'#c3cfdc', road:'#55585f', obst:'snowpine', obstK:.65, rScale:1, offDrag:1.5, offGrip:1.8 },
  city:   { icon:'🌃', night:true, sky:'#0b1430', fog:[700,2500], hemi:[0x7788bb,0x222233,1.1], sun:[0x9fb4ff,0.9], outer:0x30333a,
            ground:'#3a3d44', noise:['#34373d','#41444b'], runoff:'#2c2e33', road:'#26272b', obst:'building', obstK:.95, rScale:1.5, offDrag:1.2, offGrip:6, lamps:true,
            neon:true, jpRoad:'white', vending:true },
  // Japanischer Bergpass bei Abenddämmerung: enge Haarnadeln, Leitplanken, Zedern & Ahorn
  touge:  { icon:'⛩️', night:true, sky:'#2e2650', fogColor:'#2e2650', fog:[450,2100], hemi:[0xa89ce0,0x1a2a1a,1.4], sun:[0xffa98a,1.2], outer:0x1b3320,
            ground:'#22402a', noise:['#1d3a24','#2a4d30','#33452a'], runoff:'#4a4a48', runoffW:34, road:'#2b2c30', obst:'cedar', obstK:.55, rScale:1,
            offDrag:3.0, offGrip:3.2, lamps:true, lampEvery:70, rail:true, jpRoad:'yellow', torii:true, vending:true },
  lava:   { icon:'🌋', lava:true, sky:'#3a0d05', fogColor:'#4a1508', fog:[600,2300], hemi:[0xffaa88,0x661100,1.5], sun:[0xffb080,1.7], outer:0xff5a1a,
            ground:'#ff5a1a', noise:['#ff8c1a','#c83010','#ffb030'], runoff:'#2a2523', road:'#3a3534', runoffW:76, obst:'rock', obstK:.9, rScale:1, offDrag:2.5, offGrip:4.5 },
  desert: { icon:'🏜️', sky:'#f7c98b', fogColor:'#f2c98e', fog:[900,3200], hemi:[0xfff0d0,0xc09050,2.3], sun:[0xfff0d0,3.0], outer:0xdcb46e,
            ground:'#e0b872', noise:['#d6ab62','#e9c584'], runoff:'#c99e5a', road:'#5a5550', obst:'cactus', obstK:.45, rScale:1, offDrag:2.0, offGrip:3.5 },
};

// pads = Turbo-Felder, ramps = Sprungschanzen (Position als Anteil der Runde)
const TRACK_DEFS = [
  { id:'sonne2', name:'Sonnenring', theme:'grass', w:125, seed:7, pads:[.05,.2,.37,.55,.7,.85], ramps:[.12,.45,.78],
    pts:[[1800,4200],[2257,3551],[1643,2749],[2100,2100],[2853,2106],[3147,1194],[3900,1200],[4749,1759],[5751,941],[6600,1500],[6896,2155],[7804,2045],[8100,2700],[8853,2706],[9147,1794],[9900,1800],[10096,2404],[10904,2396],[11100,3000],[10592,3749],[11308,4651],[10800,5400],[9945,5594],[9855,6706],[9000,6900],[8353,6192],[7247,6708],[6600,6000],[5796,6094],[5604,7106],[4800,7200],[4151,6743],[3349,7357],[2700,6900],[2859,5847],[1641,5253]] },

function buildTrack(def){
  const P = def.pts, m = P.length, pts = [];
  for(let i=0;i<m;i++){
    const p0=P[(i-1+m)%m], p1=P[i], p2=P[(i+1)%m], p3=P[(i+2)%m];
    const steps = Math.max(6, Math.ceil(Math.hypot(p2[0]-p1[0], p2[1]-p1[1]) / 8));
    for(let s=0;s<steps;s++){
      const t=s/steps, t2=t*t, t3=t2*t;
      const f=(a,b,c,d)=>0.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      pts.push({ x:f(p0[0],p1[0],p2[0],p3[0]), y:f(p0[1],p1[1],p2[1],p3[1]) });

  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of pts){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }
  const M = 450;
  for(const p of pts){ p.x += M-minX; p.y += M-minY; }
  const n = pts.length;
  let len = 0;
  for(let i=0;i<n;i++){
    const a=pts[(i-1+n)%n], b=pts[(i+1)%n], dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1;
    pts[i].tx=dx/l; pts[i].ty=dy/l;
    const c=pts[(i+1)%n]; len += Math.hypot(c.x-pts[i].x, c.y-pts[i].y);
  }
  const th = THEMES[def.theme] || THEMES.grass;
  const T = { ...def, th, pts, n, len, W:Math.ceil(maxX-minX+2*M), H:Math.ceil(maxY-minY+2*M) };
  // Raster der Streckenpunkte: schnelle Abfrage "liegt (x,y) näher als d an der Strecke?"
  const CELL=250, grid=new Map(), gk=(cx,cy)=>cx*65536+cy;
  for(let i=0;i<n;i+=2){ const p=pts[i], k=gk(Math.floor(p.x/CELL), Math.floor(p.y/CELL)); if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(p); }
  const nearTrack = (x,y,d)=>{
    const r=Math.ceil(d/CELL), cx=Math.floor(x/CELL), cy=Math.floor(y/CELL), d2=d*d;
    for(let i=cx-r;i<=cx+r;i++) for(let j=cy-r;j<=cy+r;j++){ const c=grid.get(gk(i,j)); if(c) for(const p of c) if((p.x-x)**2+(p.y-y)**2<d2) return true; }
    return false;
  };
  T.nearTrack = nearTrack;
  // Bäume/Hindernisse in einem Band neben der Strecke; Anzahl wächst mit der Streckenlänge
  const rng = mulberry32(def.seed), trees = [], nTrees = Math.min(2400, Math.round(280*len/9200));
  for(let k=0;k<nTrees*12 && trees.length<nTrees;k++){
    const p=pts[Math.floor(rng()*n)], ang=rng()*Math.PI*2, dd=def.w/2+60+rng()*1050, r=(16+rng()*24)*th.rScale;
    const x=p.x+Math.cos(ang)*dd, y=p.y+Math.sin(ang)*dd;
    if(x<30 || y<30 || x>T.W-30 || y>T.H-30) continue;
    if(!nearTrack(x, y, def.w/2+r+70)) trees.push({x,y,r});

  T.trees = trees;
  // Reifenstapel an Kurven-Außenseiten
  const trng = mulberry32(def.seed+5), tyres = [];
  for(let i=0;i<n;i+=6){
    const a=pts[i], b=pts[(i+6)%n], cross=a.tx*b.ty - a.ty*b.tx;
    if(Math.abs(cross) < 0.06 || trng()<.3 || th.lava || th.jpRoad) continue;   // Straßen-Welten: keine Reifenstapel

    for(let k=tyres.length-1;k>=0;k--) if((tyres[k].x-x)**2+(tyres[k].y-y)**2 < 95**2) tyres.splice(k,1);

    }

  const BD = def.w/2 + 95, BW = 96;
  for(let k=0;k<nBoards;k++){
    for(let tryN=0; tryN<6; tryN++){
      const i = Math.floor(((k+0.25+brng()*0.5)/nBoards)*n) % n, a=pts[i], side = brng()<.5?1:-1;
      const x=a.x - a.ty*side*BD, y=a.y + a.tx*side*BD;
      if(nearTrack(x, y, BD-12)) continue;
      if(trees.some(t=>(t.x-x)**2+(t.y-y)**2 < (t.r+BW/2+12)**2)) continue;
      if(vend.some(t=>(t.x-x)**2+(t.y-y)**2 < (BW/2+20)**2) || (T.screen.x-x)**2+(T.screen.y-y)**2 < 170**2) continue;
      if(boards.some(b=>(b.x-x)**2+(b.y-y)**2 < (BW+40)**2)) continue;
      // Bildfläche zeigt zur Straße (-Normale) und ist 25° gegen die Fahrtrichtung gedreht
      const fx = a.ty*side, fy = -a.tx*side, tw = 0.42;
      const dx = fx*Math.cos(tw) - a.tx*Math.sin(tw), dy = fy*Math.cos(tw) - a.ty*Math.sin(tw);
      boards.push({ x, y, dx, dy, w:BW });
      break;
    }
  }
  T.boards = boards;
  // Plätze für Zuschauer am Streckenrand (mehr rund um Start/Ziel)
  const srng = mulberry32(def.seed+11), specs = [];
  const trySpec = (i, side, d) => {
    const a=pts[(i+n)%n], x=a.x - a.ty*side*d, y=a.y + a.tx*side*d;
    if(nearTrack(x, y, def.w/2+55)) return;
    if(trees.some(t=>(t.x-x)**2+(t.y-y)**2 < (t.r+20)**2)) return;
    if(tyres.some(t=>(t.x-x)**2+(t.y-y)**2 < 32**2) || vend.some(t=>(t.x-x)**2+(t.y-y)**2 < 36**2) || boards.some(b=>(b.x-x)**2+(b.y-y)**2 < (b.w/2+24)**2) || (T.screen.x-x)**2+(T.screen.y-y)**2 < 95**2) return;
    if(specs.some(s=>(s.x-x)**2+(s.y-y)**2 < 34**2)) return;
    specs.push({x,y});
  };
  for(let i=-70;i<=70;i+=9) for(const side of [-1,1]) trySpec(i, side, def.w/2+72+srng()*14);
  const stepS = Math.max(8, Math.floor(n/90));
  for(let i=80;i<n-80;i+=stepS) trySpec(i, srng()<.5?1:-1, def.w/2+70+srng()*30);
  T.specs = specs;
  // Power-Up-Würfel: Reihen quer über die Strecke (lange Strecken bekommen mehr Reihen)
  const boxes = [], rows = Math.max(4, Math.round(len/2800));
  for(let r=0;r<rows;r++){
    const a = pts[Math.floor((r+0.5)/rows*n)];
    for(const o of [-0.3,-0.1,0.1,0.3]) boxes.push({ x:a.x - a.ty*o*def.w, y:a.y + a.tx*o*def.w });
  }
  T.boxes = boxes;
  // Turbo-Felder und Sprungschanzen
  const mark = f => { const i=Math.floor(f*n)%n, a=pts[i]; return { x:a.x, y:a.y, tx:a.tx, ty:a.ty, idx:i }; };
  T.pads = (def.pads||[]).map(mark);
  T.ramps = (def.ramps||[]).map(mark);
  // Straßenlaternen (Nachtstadt)
  T.lamps = [];
  const LE = th.lampEvery || 22;
  if(th.lamps) for(let i=0;i<n;i+=LE){ const a=pts[i], side=(i/LE)%2?1:-1, d=def.w/2+36; T.lamps.push({ x:a.x - a.ty*side*d, y:a.y + a.tx*side*d }); }
  // Hindernisse für die Physik (cr = Abstand Mittelpunkt bis Automitte)
  const p0=pts[0], gh=def.w/2+24;
  T.obst = [
    ...trees.map(t=>({ x:t.x, y:t.y, cr:t.r*th.obstK+13 })),
    ...tyres.map(t=>({ x:t.x, y:t.y, cr:7+12 })),
    ...T.lamps.map(t=>({ x:t.x, y:t.y, cr:3+12 })),
    ...vend.map(t=>({ x:t.x, y:t.y, cr:9+12 })),
    // Pfosten der Plakatwände (links und rechts der Bildfläche)
    ...boards.flatMap(b=>[-1,1].map(s=>({ x:b.x + b.dy*s*(b.w/2-6), y:b.y - b.dx*s*(b.w/2-6), cr:3+12 }))),
    { x:T.screen.x, y:T.screen.y, cr:6+12 },   // Mast der Videowand
    { x:p0.x - p0.ty*gh, y:p0.y + p0.tx*gh, cr:4+12 }, { x:p0.x + p0.ty*gh, y:p0.y - p0.tx*gh, cr:4+12 },
  ];
  return T;
}

function trackPath(g, T, s=1, ox=0, oy=0){
  g.beginPath();
  T.pts.forEach((p,i)=> i ? g.lineTo(p.x*s+ox, p.y*s+oy) : g.moveTo(p.x*s+ox, p.y*s+oy));
  g.closePath();
}

function renderGroundCanvas(T){
  const S = Math.min(1, 4096/Math.max(T.W,T.H));
  const c = document.createElement('canvas');
  c.width = Math.ceil(T.W*S); c.height = Math.ceil(T.H*S);
  const g = c.getContext('2d'); g.scale(S,S);
  const rng = mulberry32(T.seed*3+1), th=T.th;
  g.fillStyle=th.ground; g.fillRect(0,0,T.W,T.H);
  // Boden-Sprenkel: Anzahl wächst mit der Fläche, Größe mit der (bei großen Karten gröberen) Auflösung
  const nNoise = Math.min(60000, Math.round(14000*T.W*T.H/12e6)), nk = Math.max(1, .6/S);
  for(let i=0;i<nNoise;i++){ g.fillStyle = th.noise[Math.floor(rng()*th.noise.length)]; const s=(3+rng()*(th.lava?22:8))*nk; g.fillRect(rng()*T.W, rng()*T.H, s, s); }
  if(th.lava) for(let i=0;i<500;i++){ g.strokeStyle='rgba(60,10,0,.35)'; g.lineWidth=3+rng()*5; g.beginPath(); let x=rng()*T.W, y=rng()*T.H; g.moveTo(x,y); for(let k=0;k<5;k++){ x+=(rng()-.5)*160; y+=(rng()-.5)*160; g.lineTo(x,y); } g.stroke(); }
  if(th.obst!=='building') for(const t of T.trees){ g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.arc(t.x+4,t.y+5,t.r*1.05,0,7); g.fill(); }
  g.lineJoin='round'; g.lineCap='round';
  trackPath(g,T); g.lineWidth=T.w+(th.runoffW||60); g.strokeStyle=th.runoff; g.stroke();
  trackPath(g,T); g.lineWidth=T.w+20; g.strokeStyle='#d8322b'; g.stroke();
  g.setLineDash([26,26]); g.strokeStyle='#fff'; g.stroke(); g.setLineDash([]);
  trackPath(g,T); g.lineWidth=T.w; g.strokeStyle=th.road; g.stroke();
  trackPath(g,T); g.lineWidth=T.w-30; g.strokeStyle='rgba(255,255,255,.03)'; g.stroke();
  trackPath(g,T); g.lineWidth=3; g.setLineDash([30,42]); g.strokeStyle='rgba(255,255,255,.6)'; g.stroke(); g.setLineDash([]);
  const p=T.pts[0], ang=Math.atan2(p.ty,p.tx), cells=10, s=T.w/cells;
  g.save(); g.translate(p.x,p.y); g.rotate(ang);
  for(let i=0;i<cells;i++) for(let j=0;j<2;j++){ g.fillStyle=(i+j)%2?'#fff':'#111'; g.fillRect(-s+j*s, -T.w/2+i*s, s, s); }
  g.restore();
  return c;
}

function renderLavaGlow(T){

function drawPreview(T, size, pad=10){
  const c=document.createElement('canvas'), s=(size-2*pad)/Math.max(T.W,T.H);
  c.width=Math.ceil(T.W*s+2*pad); c.height=Math.ceil(T.H*s+2*pad);
  const g=c.getContext('2d'); g.lineJoin='round';
  trackPath(g,T,s,pad,pad); g.lineWidth=Math.max(4,T.w*s); g.strokeStyle='#ddd'; g.stroke();
  trackPath(g,T,s,pad,pad); g.lineWidth=Math.max(2,T.w*s*.6); g.strokeStyle='#555'; g.stroke();
  const p=T.pts[0]; g.fillStyle='#ffcc00'; g.beginPath(); g.arc(p.x*s+pad,p.y*s+pad,4,0,7); g.fill();

function atmosphere(TH){
  if(TH.night || !nightOn) return TH;
  const snow = TH.obst==='snowpine', lava = !!TH.lava;
  return { sky: lava ? '#1a0603' : '#060a1a', fogColor: lava ? '#2a0a04' : '#0a0f22', fog:[650,2700],
    hemi:[snow ? 0x9fb0e0 : 0x7d8cc4, 0x1c1c26, snow ? 1.3 : 1.05], sun:[0xa8b8ff, 0.75],
    outer: new THREE.Color(TH.outer).multiplyScalar(0.45).getHex() };
}
// Himmel, Nebel, Licht und Boden bis zum Horizont passend zur Welt (und zur Tageszeit)

  R3.scene.fog = new THREE.Fog(new THREE.Color(A.fogColor || A.sky), A.fog[0], A.fog[1]);

    const pole = new THREE.InstancedMesh(new THREE.CylinderGeometry(1.6,2,70,6).translate(0,35,0), new THREE.MeshLambertMaterial({ color:0x666a72 }), T.lamps.length);
    const head = new THREE.InstancedMesh(new THREE.SphereGeometry(5,10,8), new THREE.MeshBasicMaterial({ color:0xffe9a8 }), T.lamps.length);
    const glow = new THREE.InstancedMesh(new THREE.CircleGeometry(34,20).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ color:0xffd98a, transparent:true, opacity:.18, depthWrite:false }), T.lamps.length);
    const q0 = new THREE.Quaternion();
    T.lamps.forEach((l,i)=>{
      pole.setMatrixAt(i, _m.compose(_p.set(l.x,0,l.y), q0, _s.set(1,1,1)));
      head.setMatrixAt(i, _m.compose(_p.set(l.x,72,l.y), q0, _s.set(1,1,1)));
      glow.setMatrixAt(i, _m.compose(_p.set(l.x,.3,l.y), q0, _s.set(1,1,1)));
    });
    for(const im of [pole,head,glow]){ im.frustumCulled=false; grp.add(im); }
    pole.castShadow = true;
  }
  // Start-/Zieltor
  const p0 = T.pts[0], half = T.w/2 + 24;
  const gate = new THREE.Group(); gate.position.set(p0.x, 0, p0.y); gate.rotation.y = -Math.atan2(p0.ty, p0.tx);
  if(TH.torii){
    // Torii: zwei rote Säulen, schwarzer geschwungener Deckbalken, Querbalken und Namenstafel
    const red = new THREE.MeshLambertMaterial({ color:0xd23a22 }), black = new THREE.MeshLambertMaterial({ color:0x1a1a1a });
    const add = (geo, mat, x, y, z) => { const o=new THREE.Mesh(geo, mat); o.position.set(x,y,z); o.castShadow=true; gate.add(o); return o; };
    for(const z of [-half, half]){ add(new THREE.CylinderGeometry(4,4.6,84,12), red, 0, 42, z); add(BOX(11,5,11), black, 0, 2.5, z); }
    add(BOX(9,5,2*half+20), red, 0, 66, 0);                       // Nuki (unterer Querbalken)
    add(BOX(10,6,2*half+44), red, 0, 84, 0);                      // Shimaki
    const top = add(BOX(13,5,2*half+60), black, 0, 89.5, 0);      // Kasagi (oben, schwarz)
    for(const s of [-1,1]){ const tip=add(BOX(13,5,14), black, 0, 92, s*(half+33)); tip.rotation.x = s*0.22; }
    const pmat = new THREE.MeshLambertMaterial({ map:plaqueTexture('峠') });
    add(BOX(3,16,12), [pmat, pmat, black, black, black, black], 0, 75, 0);
    top.castShadow=true;
  } else {
    const postMat = new THREE.MeshLambertMaterial({ color:0xdddddd });
    for(const z of [-half, half]){ const post = new THREE.Mesh(BOX(6,74,6), postMat); post.position.set(0,37,z); post.castShadow=true; gate.add(post); }
    const bmat = new THREE.MeshLambertMaterial({ map:bannerTexture() });
    // Banner: lange Seite quer über die Strecke, bedruckte Seiten zeigen in Fahrtrichtung
    const banner = new THREE.Mesh(BOX(2*half+6, 16, 3), [postMat, postMat, postMat, postMat, bmat, bmat]);
    banner.rotation.y = Math.PI/2; banner.position.y = 70;
    banner.castShadow = true; gate.add(banner);
  }
  grp.add(gate);
  // Reifenstapel an den Kurven-Außenseiten (Deko)
  const tyreGeo = new THREE.CylinderGeometry(7,7,12,10), tyreMat = new THREE.MeshLambertMaterial({ color:0x222222 });
  const tyres = T.tyres;
  if(tyres.length){
    const tm = new THREE.InstancedMesh(tyreGeo, tyreMat, tyres.length);
    tyres.forEach((t,i)=> tm.setMatrixAt(i, _m.compose(_p.set(t.x,6,t.y), new THREE.Quaternion(), _s.set(1,1,1))));
    tm.castShadow=true; tm.frustumCulled=false; grp.add(tm);
  }
  // Power-Up-Würfel
  const boxMat = new THREE.MeshLambertMaterial({ map:boxTexture(), transparent:true, opacity:.92, emissive:0x333333 });
  const boxGeo = BOX(18,18,18);
  R3.boxMeshes = T.boxes.map(b=>{ const m=new THREE.Mesh(boxGeo, boxMat); m.position.set(b.x,14,b.y); m.castShadow=true; grp.add(m); return m; });
  R3.scene.add(grp); R3.trackGroup = grp; R3.builtTrack = T;
}

// Hindernis-Modelle je Welt. Rückgabe: Liste von InstancedMeshes (Index = Baum-Index, zum Ausblenden)
function buildObstacles3D(T, grp){
  const n=T.trees.length, kind=T.th.obst, q=new THREE.Quaternion(), list=[];
  const mk = (geo, mat) => { const im=new THREE.InstancedMesh(geo, mat, n); list.push(im); return im; };
  const LAM = c => new THREE.MeshLambertMaterial({ color:c });
  const unit = g => g.translate(0,.5,0);
  if(kind==='pine' || kind==='snowpine'){
    const trunk = mk(unit(new THREE.CylinderGeometry(.5,.7,1,7)), LAM(0x6b4a2b));
    const crown = mk(unit(new THREE.ConeGeometry(1,1,9)), LAM(kind==='snowpine'?0x2f5a3a:0x2c6a28));
    const crown2 = mk(unit(new THREE.ConeGeometry(1,1,9)), LAM(kind==='snowpine'?0xf4f8ff:0x3d8a36));
    T.trees.forEach((t,i)=>{
      const h=t.r*0.9; q.setFromAxisAngle(UP, t.x*0.37);
      trunk.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, _s.set(t.r*0.5, h, t.r*0.5)));
      crown.setMatrixAt(i, _m.compose(_p.set(t.x,h*0.7,t.y), q, _s.set(t.r*1.05, t.r*1.9, t.r*1.05)));
      crown2.setMatrixAt(i, _m.compose(_p.set(t.x,h*0.7+t.r*1.0,t.y), q, _s.set(t.r*.72, t.r*1.5, t.r*.72)));
    });
  } else if(kind==='cedar'){
    // Japanischer Bergwald: hohe schlanke Zedern, dazwischen rote Ahornbäume (Momiji) und ein paar Kirschblüten
    const trunk = mk(unit(new THREE.CylinderGeometry(.45,.65,1,7)), LAM(0x5a3a24));
    const c1 = mk(unit(new THREE.ConeGeometry(1,1,8)), LAM(0x1c4026));
    const c2 = mk(unit(new THREE.ConeGeometry(1,1,8)), LAM(0x24502e));
    const round = mk(new THREE.IcosahedronGeometry(1,1), LAM(0xffffff));
    const cols = [0xd8401e, 0xe8601a, 0xc22a2a, 0xf09a1c, 0xf4a6c8];
    const zero = _s.set(0,0,0).clone(), col = new THREE.Color();
    T.trees.forEach((t,i)=>{
      q.setFromAxisAngle(UP, t.x*0.37);
      const kindI = (i*7919) % 10;          // 0-5 Zeder, 6-8 Ahorn, 9 Kirschblüte
      if(kindI<6){
        const h=t.r*1.4;
        trunk.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, _s.set(t.r*.4, h, t.r*.4)));
        c1.setMatrixAt(i, _m.compose(_p.set(t.x,h*.6,t.y), q, _s.set(t.r*.8, t.r*3.0, t.r*.8)));
        c2.setMatrixAt(i, _m.compose(_p.set(t.x,h*.6+t.r*1.7,t.y), q, _s.set(t.r*.55, t.r*2.1, t.r*.55)));
        round.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, zero));
      } else {
        const h=t.r*0.9;
        trunk.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, _s.set(t.r*.4, h, t.r*.4)));
        c1.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, zero));
        c2.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, zero));
        round.setMatrixAt(i, _m.compose(_p.set(t.x,h+t.r*.5,t.y), q, _s.set(t.r*1.15, t.r*.95, t.r*1.15)));
      }
      round.setColorAt(i, col.setHex(kindI===9 ? cols[4] : cols[(i*31)%4]));
    });
  } else if(kind==='cactus'){
    const body = mk(unit(new THREE.CylinderGeometry(.5,.55,1,8)), LAM(0x3f8f3f));
    const armA = mk(unit(new THREE.CylinderGeometry(.5,.5,1,8)), LAM(0x4a9a48));
    const armB = mk(unit(new THREE.CylinderGeometry(.5,.5,1,8)), LAM(0x4a9a48));
    T.trees.forEach((t,i)=>{
      const yaw=t.x*0.37, cx=Math.cos(yaw), sz=Math.sin(yaw), r=t.r;
      q.setFromAxisAngle(UP, yaw);
      body.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, _s.set(r*.45, r*2.6, r*.45)));
      armA.setMatrixAt(i, _m.compose(_p.set(t.x+cx*r*.5,r*0.9,t.y-sz*r*.5), q, _s.set(r*.3, r*1.0, r*.3)));
      armB.setMatrixAt(i, _m.compose(_p.set(t.x-cx*r*.5,r*1.3,t.y+sz*r*.5), q, _s.set(r*.28, r*0.8, r*.28)));
    });
  } else if(kind==='rock'){
    const rock = mk(new THREE.DodecahedronGeometry(1,0), LAM(0x2b2522));
    const tip = mk(new THREE.ConeGeometry(1,1,6), new THREE.MeshBasicMaterial({ color:0xff7a20 }));
    T.trees.forEach((t,i)=>{
      q.setFromAxisAngle(UP, t.x*0.37);
      rock.setMatrixAt(i, _m.compose(_p.set(t.x,t.r*.35,t.y), q, _s.set(t.r, t.r*1.1, t.r)));
      tip.setMatrixAt(i, _m.compose(_p.set(t.x,t.r*1.45,t.y), q, _s.set(t.r*.25, t.r*.5, t.r*.25)));
    });
  } else if(kind==='building'){
    const mat = new THREE.MeshLambertMaterial({ map:windowTexture(), emissiveMap:windowTexture(true), emissive:new THREE.Color(0xffffff), emissiveIntensity:1 });
    const b = mk(unit(new THREE.BoxGeometry(1,1,1)), mat);
    const rng = mulberry32(T.seed+3);
    // Leuchtreklamen: je Schild-Art ein InstancedMesh, jedes Haus bekommt eine Art (die anderen bleiben unsichtbar)
    const SIGNS = [['ラーメン','#ff3c6e'],['カラオケ','#3cf0ff'],['すし','#ffcc33'],['ゲーム','#7dff6a'],['ホテル','#ff8a2a'],['居酒屋','#c77dff'],['ネオン','#ff4fd8']];
    const signs = T.th.neon ? SIGNS.map(([txt,colr])=>{
      const face = new THREE.MeshBasicMaterial({ map:neonSignTexture(txt, colr) }), dark = new THREE.MeshBasicMaterial({ color:0x0d0d14 });
      return mk(BOX(16,64,2.5), [dark,dark,dark,dark,face,face]);
    }) : [];
    const zero = new THREE.Vector3(0,0,0);
    T.trees.forEach((t,i)=>{
      const yaw = Math.floor(rng()*4)*Math.PI/2 + .2*(rng()-.5), hgt = 70+rng()*190;
      q.setFromAxisAngle(UP, yaw);
      b.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, _s.set(t.r*1.6, hgt, t.r*1.6)));
      if(signs.length){
        // Schild ragt an einer zufälligen Hauskante senkrecht heraus
        const which = i % signs.length, face = Math.floor(rng()*4), fy = yaw + face*Math.PI/2, half = t.r*0.8;
        const sy = Math.min(hgt-36, 40+rng()*60);
        signs.forEach((sm,k)=>{
          if(k!==which || sy<34){ sm.setMatrixAt(i, _m.compose(_p.set(t.x,0,t.y), q, zero)); return; }
          const qq = new THREE.Quaternion().setFromAxisAngle(UP, fy);
          sm.setMatrixAt(i, _m.compose(_p.set(t.x+Math.cos(fy)*(half+8), sy, t.y-Math.sin(fy)*(half+8)), qq, _s.set(1,1,1)));
        });
      }
    });
  }
  for(const im of list){ im.castShadow=true; im.receiveShadow=true; im.frustumCulled=false; grp.add(im); }
  return list;
}

function windowTexture(glow=false){
  const c=document.createElement('canvas'); c.width=64; c.height=128; const g=c.getContext('2d');
  const rng=mulberry32(glow?5:5);
  g.fillStyle = glow ? '#000' : '#1d2230'; g.fillRect(0,0,64,128);
  for(let y=4;y<124;y+=10) for(let x=4;x<60;x+=12){
    const on = rng()<.45;
    g.fillStyle = on ? (glow ? '#ffd27a' : '#ffe2a0') : (glow ? '#000' : '#2a3142');
    g.fillRect(x,y,8,6);
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
function padTexture(){
  const c=document.createElement('canvas'); c.width=128; c.height=92; const g=c.getContext('2d');
  g.fillStyle='rgba(0,200,255,.35)'; g.fillRect(0,0,128,92);
  g.strokeStyle='#7ff3ff'; g.lineWidth=5; g.strokeRect(3,3,122,86);
  g.fillStyle='#e8fdff';
  for(const x of [18,52,86]){ g.beginPath(); g.moveTo(x,16); g.lineTo(x+26,46); g.lineTo(x,76); g.lineTo(x+12,76); g.lineTo(x+38,46); g.lineTo(x+12,16); g.closePath(); g.fill(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function rampTexture(){
  const c=document.createElement('canvas'); c.width=128; c.height=128; const g=c.getContext('2d');
  g.fillStyle='#ffcc00'; g.fillRect(0,0,128,128);
  g.fillStyle='#151515'; for(let i=-128;i<256;i+=32){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+16,0); g.lineTo(i+16-128,128); g.lineTo(i-128,128); g.closePath(); g.fill(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

function boxTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,128,128); gr.addColorStop(0,'#ff3cac'); gr.addColorStop(.5,'#ffb400'); gr.addColorStop(1,'#2b86c5');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  g.strokeStyle='#fff'; g.lineWidth=10; g.strokeRect(5,5,118,118);

  g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=6; g.fillText('?',64,70);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

let oils = [], oilSeq = 0;
function addOil(x, y, owner, id){
  const m = new THREE.Mesh(new THREE.CircleGeometry(24, 24).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color:0x0d0d12, transparent:true, opacity:.88, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4 }));
  m.position.set(x, .5, y);
  const sheen = new THREE.Mesh(new THREE.CircleGeometry(9, 16).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ color:0x5a4a8a, transparent:true, opacity:.5, depthWrite:false }));
  sheen.position.set(-6,.1,-5); m.add(sheen);
  R3.scene.add(m);
  oils.push({ x, y, r:24, owner, id, age:0, life:25, mesh:m });
}
function removeOil(o){
  R3.scene.remove(o.mesh); o.mesh.geometry.dispose(); o.mesh.material.dispose();
  oils = oils.filter(q=>q!==o);
}
function clearOils(){ for(const o of oils.slice()) removeOil(o); }

// Blendet die angegebenen Bäume aus (Skalierung 0) und stellt vorher versteckte wieder her
function setHiddenTrees(list){
  const prev=R3.hiddenTrees||[];
  if(prev.length===list.length && prev.every((v,i)=>v===list[i])) return;
  R3.treeMeshes.forEach((im,k)=>{
    const arr=im.instanceMatrix.array, orig=R3.treeOrig[k];
    for(const i of prev) for(let j=0;j<16;j++) arr[i*16+j]=orig[i*16+j];
    for(const i of list){ for(let j=0;j<16;j++) arr[i*16+j]=0; }
    im.instanceMatrix.needsUpdate=true;
  });
  R3.hiddenTrees=list.slice();
}

let hotImgs = [];
async function loadHot(){
  if(location.protocol==='file:') return;
  try{
    const list = await (await fetch('api/bilder1')).json();
    const imgs = await Promise.all(list.slice(0,100).map(f => new Promise(res=>{

    })));

    if(!altBilder) hotImgs = bildSets.spec;
  }catch(e){ hotImgs = []; }

const hotReady = loadHot();

function buildSpectators(T){
  if(R3.specFor===T && R3.specCount===hotImgs.length) return;
  if(R3.specGroup){ R3.scene.remove(R3.specGroup); R3.specGroup=null; }
  R3.specFor=T; R3.specCount=hotImgs.length;
  if(!hotImgs.length) return;
  if(!R3.hotMats || R3.hotMats.length!==hotImgs.length){
    R3.hotMats = hotImgs.map(im=>{
      const t=new THREE.Texture(im); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; t.needsUpdate=true;
      return { m:new THREE.SpriteMaterial({ map:t }), a:im.naturalWidth/Math.max(1,im.naturalHeight) };
    });
  }
  const grp=new THREE.Group(), rng=mulberry32(T.seed+17), off=Math.floor(rng()*hotImgs.length);
  const baseGeo=new THREE.CylinderGeometry(9,9,1.5,14), baseMat=new THREE.MeshLambertMaterial({ color:0x555555 });
  T.specs.forEach((s,i)=>{
    const M=R3.hotMats[(i+off)%R3.hotMats.length];
    const h=42+rng()*10, w=Math.min(h*M.a, 70);
    const sp=new THREE.Sprite(M.m); sp.center.set(.5,0); sp.scale.set(w,h,1); sp.position.set(s.x,1.5,s.y);
    const base=new THREE.Mesh(baseGeo, baseMat); base.position.set(s.x,.75,s.y); base.receiveShadow=true;
    grp.add(sp, base);
  });
  R3.scene.add(grp); R3.specGroup=grp;
}

// Platzhalter, solange "bilder" leer ist
const _phTex = {};
function placeholderTexture(k){
  const key = k%2; if(_phTex[key]) return _phTex[key];
  const c=document.createElement('canvas'); c.width=512; c.height=288; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,512,288); gr.addColorStop(0, key?'#1a0630':'#04142a'); gr.addColorStop(1, key?'#3a0a3a':'#0a2a40');
  g.fillStyle=gr; g.fillRect(0,0,512,288);
  g.strokeStyle='rgba(255,255,255,.08)'; g.lineWidth=2; for(let x=-288;x<512;x+=28){ g.beginPath(); g.moveTo(x,288); g.lineTo(x+288,0); g.stroke(); }
  const col = key ? '#ff2bd6' : '#00e5ff';
  g.strokeStyle=col; g.lineWidth=8; g.shadowColor=col; g.shadowBlur=18; g.strokeRect(14,14,484,260); g.shadowBlur=0;
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#fff'; g.shadowColor=col; g.shadowBlur=20; g.font='italic 900 62px system-ui,sans-serif'; g.fillText('DEIN BILD HIER',256,128);
  g.shadowBlur=0; g.fillStyle=col; g.font='800 26px system-ui,sans-serif'; g.fillText('📁 Ordner  bilder2/',256,196);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return _phTex[key]={ tex:t, a:512/288 };
}
// Textur + Seitenverhältnis für Bild Nr. i (oder Platzhalter)
const _bildTex = new Map();
function bildTex(i){
  if(!bildImgs.length) return placeholderTexture(i);
  const im = bildImgs[((i%bildImgs.length)+bildImgs.length)%bildImgs.length];
  if(!_bildTex.has(im)){
    const t=new THREE.Texture(im); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; t.needsUpdate=true;
    _bildTex.set(im, { tex:t, a:im.naturalWidth/Math.max(1,im.naturalHeight) });
  }
  return _bildTex.get(im);
}
// Bildfläche so skalieren, dass das ganze Bild in den Rahmen passt (W x H).
// Die Fläche ist um Y gedreht: Breite liegt auf der lokalen z-Achse, Höhe auf y.
function fitPlane(mesh, info, W, H){
  const sw = Math.min(W, H*info.a), sh = Math.min(H, W/info.a);
  mesh.scale.set(1, sh, sw);
}
// Entfernt eine Gruppe, ohne die gemeinsam genutzten Bild-Texturen zu löschen
function disposeKeepTextures(grp){
  grp.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose()); });
}

function buildBillboards(T){
  if(R3.boardFor===T && R3.boardCount===bildImgs.length) return;
  if(R3.boardGroup){ R3.scene.remove(R3.boardGroup); disposeKeepTextures(R3.boardGroup); }
  R3.boardFor=T; R3.boardCount=bildImgs.length;
  const grp=new THREE.Group(), rng=mulberry32(T.seed+29), off=Math.floor(rng()*1000);
  const dark=new THREE.MeshLambertMaterial({ color:0x15151c }), metal=new THREE.MeshLambertMaterial({ color:0x6a6e78 });
  const neonC=new THREE.MeshBasicMaterial({ color:0x00e5ff }), neonP=new THREE.MeshBasicMaterial({ color:0xff2bd6 });
  const unit=new THREE.PlaneGeometry(1,1).rotateY(Math.PI/2);   // zeigt in +x (Vorderseite der Wand)
  const mk=(geo, m, x, y, z, parent)=>{ const o=new THREE.Mesh(geo, m); o.position.set(x,y,z); o.castShadow=true; parent.add(o); return o; };
  // Wand: Rahmen + Bild + Neonkante, Vorderseite = lokale +x-Achse
  const panel = (parent, W, H, cy, info, neon, twoSided) => {
    mk(BOX(3, H+8, W+8), dark, 0, cy, 0, parent);
    const faces=[];
    for(const s of twoSided ? [1,-1] : [1]){
      const m=new THREE.Mesh(unit, new THREE.MeshBasicMaterial({ map:info.tex, toneMapped:false }));
      m.position.set(s*1.7, cy, 0); if(s<0) m.rotation.y=Math.PI; fitPlane(m, info, W, H); parent.add(m); faces.push(m);
      for(const [h,w,y,z] of [[1.6,W+8,cy+H/2+4,0],[1.6,W+8,cy-H/2-4,0],[H+8,1.6,cy,W/2+4],[H+8,1.6,cy,-W/2-4]]) mk(BOX(0.8,h,w), neon, s*1.9, y, z, parent);
    }
    return faces;
  };
  // Plakatwände
  T.boards.forEach((b,i)=>{
    const g=new THREE.Group(); g.position.set(b.x,0,b.y); g.rotation.y=Math.atan2(-b.dy, b.dx);
    const W=b.w, H=Math.round(b.w*9/16);
    for(const s of [-1,1]) mk(BOX(3, 52, 3), metal, -1, 26, s*(W/2-6), g);
    panel(g, W, H, 52+H/2+4, bildTex(i+off), i%2?neonP:neonC, false);
    // Lichtkegel auf dem Boden vor der Wand
    const glow=new THREE.Mesh(new THREE.CircleGeometry(W*0.45, 20).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ color:i%2?0xff2bd6:0x00e5ff, transparent:true, opacity:.10, depthWrite:false }));
    glow.position.set(W*0.3, .35, 0); g.add(glow);
    grp.add(g);
  });
  // Videowand am Ziel: hoher Mast, großes Bild auf beiden Seiten, wechselt durch
  const S=T.screen;
  if(S){
    const g=new THREE.Group(); g.position.set(S.x,0,S.y); g.rotation.y=Math.atan2(-S.dy, S.dx);
    const W=S.w, H=Math.round(S.w*9/16), cy=96+H/2;
    mk(new THREE.CylinderGeometry(4,5,100,10).translate(0,50,0), metal, 0, 0, 0, g);
    mk(BOX(10,4,W*.6), metal, 0, 96, 0, g);
    R3.screenFaces = panel(g, W, H, cy, bildTex(0), neonP, true);
    R3.screenIdx = 0; R3.screenT = 0;
    grp.add(g);
  } else R3.screenFaces = null;
  R3.scene.add(grp); R3.boardGroup=grp;
}
// Videowand: alle 3,5 Sekunden das nächste Bild
function updateScreen(dt){
  if(!R3.screenFaces) return;
  R3.screenT += dt;
  if(R3.screenT < 3.5) return;
  R3.screenT = 0; R3.screenIdx++;
  const info = bildTex(R3.screenIdx), S=track.screen, W=S.w, H=Math.round(S.w*9/16);
  for(const m of R3.screenFaces){ m.material.map = info.tex; m.material.needsUpdate = true; fitPlane(m, info, W, H); }
}

function addSkid(ax, ay, bx, by, off){
  const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy); if(len<0.01) return;
  const sk=R3.skid, i=R3.skidN % SKID_MAX; R3.skidN++;
  _q.setFromAxisAngle(UP, -Math.atan2(dy,dx));
  sk.setMatrixAt(i, _m.compose(_p.set((ax+bx)/2, .35, (ay+by)/2), _q, _s.set(len, 1, 4.5)));
  sk.setColorAt(i, off ? SKID_BROWN : SKID_BLACK);
  sk.count = Math.min(R3.skidN, SKID_MAX);
  sk.instanceMatrix.needsUpdate = true; sk.instanceColor.needsUpdate = true;
}
const SKID_BLACK = window.THREE ? new THREE.Color(0x111111) : null, SKID_BROWN = window.THREE ? new THREE.Color(0x4a3418) : null;

function colorOf(hex){ return R3.colCache[hex] || (R3.colCache[hex] = new THREE.Color(hex)); }

// ---------- Audio ----------
let actx=null, master, eOsc1, eOsc2, eGain, eFilt, muted = store.get('brumbrum.muted') === true;
function initAudio(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted?0:1; master.connect(actx.destination);
    eOsc1 = actx.createOscillator(); eOsc1.type='sawtooth';
    eOsc2 = actx.createOscillator(); eOsc2.type='square';
    eFilt = actx.createBiquadFilter(); eFilt.type='lowpass'; eFilt.frequency.value=700;
    eGain = actx.createGain(); eGain.gain.value=0;
    const g2 = actx.createGain(); g2.gain.value=.5;
    eOsc1.connect(eFilt); eOsc2.connect(g2).connect(eFilt); eFilt.connect(eGain).connect(master);
    eOsc1.start(); eOsc2.start();
  }catch(e){ actx=null; }
}
function beep(freq, dur=.18, type='square', vol=.12){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
  o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.02);
}
function thud(){ beep(70,.25,'triangle',.3); }
function toggleMute(){ muted=!muted; store.set('brumbrum.muted',muted); if(master) master.gain.value=muted?0:1; showPop($('pop'), muted?'Ton aus 🔇':'Ton an 🔊','',900); }
function updateEngine(){
  if(!actx) return;
  const t=actx.currentTime;
  const active = state==='race'||state==='countdown'||state==='finished';
  let sp=0, throttle=false;
  for(const p of viewers()){ sp=Math.max(sp, Math.hypot(p.car.vx,p.car.vy)); throttle = throttle || p.lastInput.up; }
  const s=Math.min(1.2,sp/650), gear=Math.min(4,Math.floor(s*5)), rpm=s*5-gear;
  const f = 48 + gear*6 + rpm*75 + (state==='countdown'&&throttle?60:0);
  eOsc1.frequency.setTargetAtTime(f,t,.05); eOsc2.frequency.setTargetAtTime(f/2,t,.05);
  eFilt.frequency.setTargetAtTime(400+f*6,t,.05);
  eGain.gain.setTargetAtTime(active ? (throttle?.09:.05) : 0, t, .08);
}

const keys = {}, touch = {left:false,right:false,gas:false,brake:false,item:false,nitro:false};
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const KEYMAPS = {
  wasd:   { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'], hand:['Space','ShiftLeft'], item:['KeyE'], nitro:['KeyQ'], itemKey:'E', nitroKey:'Q' },
  arrows: { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'], hand:['ShiftRight','Numpad0'], item:['Enter','NumpadEnter','Numpad1','Period'], nitro:['ControlRight','Slash','Numpad2'], itemKey:'Enter', nitroKey:'Strg' },
};
KEYMAPS.both = { itemKey:'E', nitroKey:'Q' }; for(const k of ['up','down','left','right','hand','item','nitro']) KEYMAPS.both[k] = [...KEYMAPS.wasd[k], ...KEYMAPS.arrows[k]];
function keyboardInput(map, useTouch=false){
  const any = list => list.some(c => keys[c]);
  return { itemKey: useTouch && isTouch ? '★' : map.itemKey, nitroKey: useTouch && isTouch ? 'N' : map.nitroKey, read(){
    const L = any(map.left) || (useTouch && touch.left), R = any(map.right) || (useTouch && touch.right);
    return { up: any(map.up) || (useTouch && touch.gas), down: any(map.down) || (useTouch && touch.brake), steer:(R?1:0)-(L?1:0), hand: any(map.hand),
      item: any(map.item) || (useTouch && touch.item), nitro: any(map.nitro) || (useTouch && touch.nitro) };
  }};
}
const NO_INPUT = { up:false, down:false, steer:0, hand:false, item:false, nitro:false }, BRAKE_INPUT = { up:false, down:true, steer:0, hand:false, item:false, nitro:false };

addEventListener('keydown', e=>{
  if(e.target && e.target.tagName==='INPUT'){ if(e.code==='Enter' || e.code==='NumpadEnter') joinRoom(); return; }
  if(asciiRun && asciiRun.skippable){ e.preventDefault(); skipAscii(); return; }   // Intro überspringen
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  if(e.code==='KeyB') toggleAltBilder();   // B: überall Bilder aus bilder3 (nochmal B = zurück)
  else if(e.code==='KeyR' && track && state!=='menu') restart();
  else if(e.code==='Escape') showMenu();
  else if(e.code==='KeyM') toggleMute();
  else if(e.code==='KeyP') togglePause();
  else if(e.code==='KeyC'){ camMode=(camMode+1)%3; store.set('brumbrum.cam',camMode); if(state!=='menu') showPop($('pop'), ['Kamera: Nah','Kamera: Weit','Kamera: Hoch'][camMode],'',900); }
  else if(e.code==='KeyG'){ ghostOn=!ghostOn; $('ghostChk').checked=ghostOn; store.set('brumbrum.ghost',ghostOn); if(state!=='menu') showPop($('pop'), ghostOn?'Geist an 👻':'Geist aus','',900); }
  else if(e.code==='Enter' && state==='menu') menuStart();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
[['tL','left'],['tR','right'],['tG','gas'],['tB','brake'],['tI','item'],['tN','nitro']].forEach(([id,k])=>{
  const b=$(id);
  const on=e=>{ e.preventDefault(); touch[k]=true; b.classList.add('on'); initAudio(); };
  const off=e=>{ e.preventDefault(); touch[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
});

// ---------- Netzwerk (Online-Modus) ----------
const net = { ws:null, role:null, code:null, peer:null, ips:[], port:location.port||80, err:null };
function nsend(o){ if(net.ws && net.ws.readyState===1) net.ws.send(JSON.stringify(o)); }
function netConnect(){
  return new Promise((resolve, reject)=>{
    let ws;
    try{ ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host); }catch(e){ return reject(e); }
    net.ws = ws;
    ws.onopen = ()=>{ net.err=null; resolve(); };
    ws.onerror = ()=> reject(new Error('ws'));
    ws.onmessage = e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; } try{ onNet(m); }catch(err){ console.error(err); } };
    ws.onclose = ()=>{ if(net.ws===ws) onNetClose(); };
  });
}
async function ensureNet(){
  if(net.ws && net.ws.readyState===1) return true;
  try{ await netConnect(); return true; }
  catch(e){ net.err='Keine Verbindung zum Server. Läuft „node server.js“?'; renderLobby(); return false; }
}
async function createRoom(){ initAudio(); if(await ensureNet()) nsend({t:'create'}); }
async function joinRoom(){
  initAudio();
  const code=$('codeIn').value.trim().toUpperCase();
  if(code.length!==4){ net.err='Der Code hat 4 Buchstaben.'; renderLobby(); return; }
  if(await ensureNet()) nsend({t:'join', code});
}
function leaveRoomNet(){ nsend({t:'leave'}); net.code=null; net.role=null; net.peer=null; net.err=null; renderLobby(); }
function sendInfo(){ nsend({t:'info', color:COLORS[sel.colors[0]]}); }
function oppColor(c){
  const mine=COLORS[sel.colors[0]];
  if(!c || c==='#888') return '#888';
  return c!==mine ? c : COLORS[(sel.colors[0]+1)%COLORS.length];
}
function remotePlayer(){ return raceMode==='online' ? players.find(p=>p.remote) : null; }
function markRemoteLeft(text){
  const r=remotePlayer();
  if(r && !r.left && state!=='menu'){ r.left=true; showPop($('pop'), text, 'bad', 3500); checkEnd(); }
}

function onNet(m){
  switch(m.t){
    case 'created': net.role='host'; net.code=m.code; net.ips=m.ips||[]; net.port=m.port; net.peer=null; net.err=null; break;
    case 'joined':  net.role='guest'; net.code=m.code; net.peer={color:'#888'}; net.err=null; sendInfo(); break;
    case 'peer':    net.peer={color:'#888'}; sendInfo(); beep(880,.12); break;
    case 'info':    if(net.peer) net.peer.color=m.color; { const r=remotePlayer(); if(r) r.color=oppColor(m.color); } break;
    case 'err':     net.err=m.msg; break;
    case 'left':
      net.peer=null;
      if(m.closed){ net.code=null; net.role=null; net.err='Der Host hat den Raum verlassen.'; }
      markRemoteLeft('Gegner hat das Spiel verlassen');
      break;
    case 'quit':    markRemoteLeft('Gegner hat das Rennen abgebrochen'); break;
    case 'start':   sel.mode='online'; sel.track=m.track; sel.laps=m.laps; sel.pu=!!m.pu; startRace(); break;
    case 's': {
      const r=remotePlayer(); if(!r || state==='menu') return;
      r.net={...m, recv:performance.now()}; r.lapCount=m.l||0; break;
    }
    case 'box':   if(state!=='menu' && racePU && boxTimers[m.i]!=null) boxTimers[m.i]=BOX_RESPAWN; break;
    case 'oil':   if(state!=='menu' && racePU && R3) addOil(m.x, m.y, remotePlayer(), m.id); break;
    case 'oilrm': { const o=oils.find(q=>q.id===m.id); if(o) removeOil(o); break; }
    case 'zap': {
      const me=viewers()[0];
      if(me && state==='race' && racePU){
        if(me.car.shield>0) showPop(me.pop,'🛡️ Blitz abgewehrt!','good',1800);
        else { me.car.slow=SLOW_T; showPop(me.pop,'⚡ Du wurdest geblitzt!','bad',1800); beep(1400,.3,'sawtooth',.1); }
      }
      break;
    }
    case 'fin': {
      const r=remotePlayer(); if(!r || r.finished || state!=='race') return;
      r.laps=m.laps||[]; r.lapCount=r.laps.length; finishPlayer(r, m.time); break;
    }
  }
  renderLobby();
}
function onNetClose(){
  const had=!!net.code;
  net.ws=null; net.code=null; net.role=null; net.peer=null;
  if(had) net.err='Verbindung zum Server getrennt.';
  markRemoteLeft('Verbindung verloren');
  renderLobby();
}

function makeCar(offset){
  const i=6, p=track.pts[i], nx=-p.ty, ny=p.tx;
  return { x:p.x+nx*offset, y:p.y+ny*offset, a:Math.atan2(p.ty,p.tx), vx:0, vy:0, steer:0, fwd:0, lat:0, off:false, idx:i, skid:null,
    boost:0, shield:0, jump:0, slow:0, spin:0, spinDir:1, z:0, mega:0, grip:0, nitro:.35, nos:false, hit:0 };
}
function makePlayer(o){
  const offset = o.n>1 ? (o.slot===0 ? -1 : 1) * track.w*0.24 : 0;
  const car = makeCar(offset);
  return { id:o.slot, name:o.name, tag:o.tag||'', color:o.color, input:o.input, remote:!!o.remote, car,
    laps:[], lapStart:0, nextCP:1, finished:false, finishTime:null, place:null, left:false, lapCount:0, net:null,
    item:null, itemN:0, itemHeld:false, drift:{ cur:0, t:0, time:0, mult:1, total:0, best:0 }, fovKick:0,
    ghostRec:[], ghostNext:0, lastInput:NO_INPUT, camYaw:car.a, cam3:null, mesh:null, tagSprite:null, hud:null, pop:null, pitch:0 };
}

function startRace(){
  initAudio();
  const fromMenu = state==='menu';
  if(sel.mode==='online' && !net.code) return;
  if(!init3D()){ $('err3d').classList.remove('hidden'); return; }
  raceMode = sel.mode;
  // alte Autos entfernen
  for(const p of players){ if(p.mesh){ R3.scene.remove(p.mesh); disposeGroup(p.mesh); } }
  track = TRACKS[sel.track];
  buildTrack3D(track);
  applyAtmosphere(track.th);
  buildSpectators(track);
  buildBillboards(track);
  track.obstCur = hotImgs.length ? track.obst.concat(track.specs.map(s=>({ x:s.x, y:s.y, cr:9+12 }))) : track.obst;
  R3.skidN=0; R3.skid.count=0;
  miniCanvas = drawPreview(track, Math.min(200, Math.max(120, W*.22)), 8);
  const mc=$('mini'); mc.width=miniCanvas.width; mc.height=miniCanvas.height;
  const c0=COLORS[sel.colors[0]], c1=COLORS[sel.colors[1]];
  if(raceMode==='solo'){
    players=[ makePlayer({slot:0, n:1, input:keyboardInput(KEYMAPS.both,true), color:c0, name:'Du'}) ];
  } else if(raceMode==='local'){
    players=[ makePlayer({slot:0, n:2, input:keyboardInput(KEYMAPS.wasd), color:c0, name:'Spieler 1', tag:'P1'}),
              makePlayer({slot:1, n:2, input:keyboardInput(KEYMAPS.arrows), color:c1, name:'Spieler 2', tag:'P2'}) ];
  } else {
    const me = net.role==='host' ? 0 : 1;
    players=[ makePlayer({slot:me, n:2, input:keyboardInput(KEYMAPS.both,true), color:c0, name:'Du', tag:'DU'}),
              makePlayer({slot:1-me, n:2, input:null, remote:true, color:oppColor(net.peer&&net.peer.color), name:'Gegner', tag:'GEGNER'}) ];
    if(!net.peer) players[1].left=true;
  }
  // 3D-Objekte pro Spieler
  players.forEach((p,i)=>{
    p.mesh = makeCarMesh(p.color); p.meshColor=p.color; R3.scene.add(p.mesh);
    p.mesh.userData.zap.layers.set(1+i); // nur für die anderen sichtbar
    if(isNight(track.th)){ // Scheinwerfer in der Nacht
      const hl = new THREE.SpotLight(0xfff0c8, 4, 520, Math.PI/6, 0.55, 0);
      hl.position.set(18, 12, 0); hl.target.position.set(220, 0, 0);
      p.mesh.add(hl, hl.target);
    }
    if(players.length>1 && p.tag){ p.tagSprite = makeTag(p.tag, p.color); p.tagSprite.layers.set(1+i); p.mesh.add(p.tagSprite); }
    if(!p.remote){
      p.cam3 = new THREE.PerspectiveCamera(65, 1, 1, 5000);
      for(let l=1;l<=Math.max(2,players.length);l++) p.cam3.layers.enable(l);
      p.cam3.layers.disable(1+i);
    }
  });
  raceTime=0; particles=[]; dnfTimer=null; sendTimer=0;
  racePU = sel.pu;
  clearOils(); oilSeq=0;
  boxTimers = track.boxes.map(()=>0);
  R3.boxMeshes.forEach(m=>{ m.visible=racePU; m.scale.setScalar(1); });
  cpIdx = Array.from({length:NCP},(_,k)=>Math.floor(k*track.n/NCP));

function endRace(){
  if(state!=='race') return;
  state='finished'; finishTimer=1.6; dnfTimer=null;

  if(best && (recTotal==null || best.finishTime<recTotal)){

    rec.textContent = (recTotal==null ? '⭐ Erste Bestzeit gesetzt!' : `⭐ NEUER REKORD! (−${(recTotal-best.finishTime).toFixed(3)} s)`) + (raceMode==='local' ? ` – ${best.name}` : '');
    store.set(kTot(track,sel.laps,racePU), best.finishTime);
